{"apiVersion":"tekton.dev/v1beta1","kind":"Task","metadata":{"annotations":{"tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/tags":"konflux"},"labels":{"app.kubernetes.io/version":"0.3"},"name":"apply-tags"},"spec":{"description":"Applies additional tags to the built image.","params":[{"description":"Image repository and tag reference of the the built image.","name":"IMAGE_URL","type":"string"},{"description":"Image digest of the built image.","name":"IMAGE_DIGEST","type":"string"},{"default":[],"description":"Additional tags that will be applied to the image in the registry.","name":"ADDITIONAL_TAGS","type":"array"},{"default":"trusted-ca","description":"The name of the ConfigMap to read CA bundle data from.","name":"CA_TRUST_CONFIG_MAP_NAME","type":"string"},{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the CA bundle data.","name":"CA_TRUST_CONFIG_MAP_KEY","type":"string"},{"default":"info","description":"Log level to use in the task. See golang logrus docs for available levels.","name":"LOG_LEVEL","type":"string"}],"stepTemplate":{"volumeMounts":[{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"}]},"steps":[{"args":["--image-url","$(params.IMAGE_URL)","--digest","$(params.IMAGE_DIGEST)","--tags","$(params.ADDITIONAL_TAGS[*])","--tags-from-image-label","konflux.additional-tags"],"command":["konflux-build-cli","image","apply-tags"],"env":[{"name":"KBC_LOG_LEVEL","value":"$(params.LOG_LEVEL)"}],"image":"quay.io/konflux-ci/konflux-build-cli@sha256:a4bff739b5c0cb1c02b454c1b46ad54675f8df121efb5203fed19266a6b01639","name":"apply-additional-tags","resources":{"limits":{"memory":"256Mi"},"requests":{"cpu":"100m","memory":"256Mi"}}}],"volumes":[{"configMap":{"items":[{"key":"$(params.CA_TRUST_CONFIG_MAP_KEY)","path":"ca-bundle.crt"}],"name":"$(params.CA_TRUST_CONFIG_MAP_NAME)","optional":true},"name":"trusted-ca"}]}}