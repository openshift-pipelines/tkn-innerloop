{"apiVersion":"tekton.dev/v1","kind":"Task","metadata":{"annotations":{"tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/tags":"konflux"},"labels":{"app.kubernetes.io/version":"0.1"},"name":"run-opm-command-oci-ta"},"spec":{"description":"This task runs an OPM command with user-specified arguments, passed as an array. It can optionally replace pullspecs in a catalog-template file before running the command.","params":[{"description":"The Trusted Artifact URI pointing to the artifact with the application source code.","name":"SOURCE_ARTIFACT","type":"string"},{"description":"The OCI repository where the Trusted Artifacts are stored.","name":"ociStorage","type":"string"},{"description":"Expiration date for the trusted artifacts. Empty string means no expiration.","name":"ociArtifactExpiresAfter","type":"string"},{"default":"","description":"Optional. Relative path to a file (e.g., catalog-template.yml) in which pullspecs should be updated before running opm.","name":"FILE_TO_UPDATE_PULLSPEC","type":"string"},{"default":[],"description":"The array of arguments to pass to the 'opm' command. (e.g., [ 'alpha', 'render-template', 'basic', 'v4.18/catalog-template.json']).","name":"OPM_ARGS","type":"array"},{"description":"Relative path for the opm command's output file (e.g. 'v4.18/catalog/example-operator/catalog.json'). Relative to the root directory of given source code (Git repository).","name":"OPM_OUTPUT_PATH","type":"string"},{"default":".tekton/images-mirror-set.yaml","description":"Optional, path for ImageDigestMirrorSet file. It defaults to '.tekton/images-mirror-set.yaml'","name":"IDMS_PATH","type":"string"},{"default":"true","description":"Optional. Convert all image tags in the catalog output to sha256 digests. Enabled by default. Set to 'false' to disable.","name":"CONVERT_TAGS_TO_DIGESTS","type":"string"},{"default":"trusted-ca","description":"The name of the ConfigMap containing the CA bundle for TLS verification.","name":"caTrustConfigMapName","type":"string"},{"default":"ca-bundle.crt","description":"The key in the ConfigMap containing the CA bundle.","name":"caTrustConfigMapKey","type":"string"}],"results":[{"description":"The Trusted Artifact URI pointing to the artifact with the application source code with generated file-based catalog from catalog-template.yml.","name":"SOURCE_ARTIFACT"}],"stepTemplate":{"volumeMounts":[{"mountPath":"/var/workdir","name":"workdir"},{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"}]},"steps":[{"args":["use","$(params.SOURCE_ARTIFACT)=/var/workdir/source"],"image":"quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:7c44144ab0a9644c5da8ceea2b9f8df0e2e684aa5c1608688d7df9b8cc2836ac","name":"use-trusted-artifact"},{"args":["#!/bin/bash\nset -euo pipefail\n\necho \"Running OPM command in working directory: $(pwd)\"\nprintf \"OPM Argument received: '%s'\\n\" \"$@\"\n\n# Ensure OPM_OUTPUT_PATH_PARAM is provided\nif [[ $# -eq 0 || -z \"${OPM_OUTPUT_PATH_PARAM}\" ]]; then\n  echo \"Parameter 'OPM_ARGS' or 'OPM_OUTPUT_PATH' is empty. Skipping OPM execution.\"\n\n  echo \"Returning SOURCE_ARTIFACT from previous task.\"\n  echo -n \"${SOURCE_ARTIFACT_PARAM}\" | tee \"$(results.SOURCE_ARTIFACT.path)\"\n\n  echo -n \"true\" \u003e \"$(step.results.skip_create_trusted_artifact.path)\"\n  exit 0\nfi\n\n# Validate that the path is not absolute\nif [[ \"${OPM_OUTPUT_PATH_PARAM}\" == /* ]]; then\n  echo \"Error: OPM_OUTPUT_PATH must be a relative path, but got '${OPM_OUTPUT_PATH_PARAM}'.\"\n  exit 2\nfi\n\n# Get the directory part of the path\nOUTPUT_DIR=$(dirname \"${OPM_OUTPUT_PATH_PARAM}\")\n\n# Create the directory if it's not the current directory '.'\nif [[ \"${OUTPUT_DIR}\" != \".\" ]]; then\n  echo \"Ensuring directory '${OUTPUT_DIR}' exists.\"\n  mkdir -p \"${OUTPUT_DIR}\"\nfi\n\necho \"Running opm $* \u003e ${OPM_OUTPUT_PATH_PARAM}\"\nopm \"$@\" \u003e \"${OPM_OUTPUT_PATH_PARAM}\"\necho \"OPM command finished.\"\n\necho -n \"false\" \u003e \"$(step.results.skip_create_trusted_artifact.path)\"\n","bash","$(params.OPM_ARGS[*])"],"command":["/bin/bash","-c"],"env":[{"name":"OPM_OUTPUT_PATH_PARAM","value":"$(params.OPM_OUTPUT_PATH)"},{"name":"SOURCE_ARTIFACT_PARAM","value":"$(params.SOURCE_ARTIFACT)"}],"image":"quay.io/konflux-ci/operator-sdk-builder:latest@sha256:2737ff035f3a6d94e189cd31e7653998525c52f4d4db994ba1874a3a74bb4912","name":"run-opm-with-user-args","results":[{"description":"Set to 'true' if the create-trusted-artifact step should be skipped.","name":"skip_create_trusted_artifact"}],"securityContext":{"runAsUser":0},"workingDir":"/var/workdir/source"},{"env":[{"name":"OPM_OUTPUT_PATH_PARAM","value":"$(params.OPM_OUTPUT_PATH)"}],"image":"quay.io/konflux-ci/konflux-test:v1.4.50@sha256:8b9c7be18bef49f60ac9926830174072cc2010c620c7b3d0a5bb53ba02fcf71d","name":"convert-image-tags-to-digests","script":"#!/bin/bash\nset -euo pipefail\n\nload_utils() {\n  # shellcheck source=/dev/null\n  source /utils.sh\n}\n\n# Main conversion function\nconvert_tags_to_digests() {\n  local -r catalog_file=\"${OPM_OUTPUT_PATH_PARAM}\"\n\n  echo \"Converting image tags to sha256 digests in '${catalog_file}'.\"\n\n  if [[ ! -f \"${catalog_file}\" ]]; then\n    echo \"Error: Catalog file '${catalog_file}' not found.\" \u003e\u00262\n    return 1\n  fi\n\n  # Extract image references from specific OLM catalog paths only:\n  # - .image (root level bundle image)\n  # - .relatedImages[].image (related images array)\n  echo \"Extracting image references from catalog...\"\n  local -a images=()\n  mapfile -t images \u003c \u003c(jq -r '.image, .relatedImages[]?.image | select(. != null)' \"${catalog_file}\" | sort -u)\n\n  if [[ ${#images[@]} -eq 0 ]]; then\n    echo \"No images found in catalog. Nothing to convert.\"\n    return 0\n  fi\n\n  echo \"Found ${#images[@]} unique image reference(s).\"\n\n  # Map: key=original_image, value=digest_image\n  local -A image_digests_map=()\n\n  # Process each image and get its digest\n  for image in \"${images[@]}\"; do\n    # Fail on empty image references - indicates malformed catalog\n    if [[ -z \"${image}\" ]]; then\n      echo \"Error: Found empty image reference in catalog. This indicates a malformed catalog entry.\" \u003e\u00262\n      return 1\n    fi\n\n    # Parse the image URL using parse_image_url (utils.sh function)\n    local parsed_image parsed_digest parsed_tag parsed_registry_repository\n    parsed_image=$(parse_image_url \"${image}\")\n    parsed_digest=$(echo \"$parsed_image\" | jq -r '.digest')\n    parsed_tag=$(echo \"$parsed_image\" | jq -r '.tag')\n    parsed_registry_repository=$(echo \"$parsed_image\" | jq -r '.registry_repository')\n\n    # Skip images that already use digest format\n    if [[ -n \"${parsed_digest}\" ]]; then\n      echo \"Image '${image}' already uses digest format. Skipping.\"\n      continue\n    fi\n\n    # Fail if image doesn't have a tag\n    # Untagged images are ambiguous and defeat the purpose of digest conversion\n    if [[ -z \"${parsed_tag}\" ]]; then\n      echo \"Error: Image '${image}' has no tag. Cannot convert to digest.\" \u003e\u00262\n      return 1\n    fi\n\n    echo \"Processing image: ${image}\"\n\n    # Get the digest using skopeo with retry wrapper\n    local digest\n    if ! digest=$(retry skopeo inspect --no-tags --format='{{.Digest}}' \"docker://${image}\"); then\n      echo \"Error: Failed to get digest for image '${image}'.\" \u003e\u00262\n      return 1\n    fi\n\n    if [[ -z \"${digest}\" ]]; then\n      echo \"Error: Empty digest returned for image '${image}'.\" \u003e\u00262\n      return 1\n    fi\n\n    # Construct the digest-based image reference\n    local image_with_digest=\"${parsed_registry_repository}@${digest}\"\n\n    image_digests_map[\"${image}\"]=\"${image_with_digest}\"\n  done\n\n  # Apply all replacements\n  if [[ ${#image_digests_map[@]} -gt 0 ]]; then\n    echo \"\"\n    echo \"Applying ${#image_digests_map[@]} replacement(s) to catalog file:\"\n    for img in \"${!image_digests_map[@]}\"; do\n      echo \"  ${img} -\u003e ${image_digests_map[${img}]}\"\n    done\n    echo \"\"\n\n    # Create temporary file for the catalog replacements\n    local tmp_file\n    tmp_file=$(mktemp)\n    trap 'rm -f \"${tmp_file}\"' RETURN\n\n    # Iterate over the map and replace each image reference\n    local old_image\n    for old_image in \"${!image_digests_map[@]}\"; do\n      local new_image=\"${image_digests_map[${old_image}]}\"\n\n      # Replace in specific OLM catalog paths only:\n      # - .image (root level)\n      # - .relatedImages[].image (related images array)\n      if ! jq --arg old \"${old_image}\" --arg new \"${new_image}\" \\\n           '(if .image == $old then .image = $new else . end) |\n            (if .relatedImages then .relatedImages = [.relatedImages[] | if .image == $old then .image = $new else . end] else . end)' \\\n           \"${catalog_file}\" \u003e \"${tmp_file}\"; then\n        echo \"Error: Failed to replace image '${old_image}' in catalog.\" \u003e\u00262\n        return 1\n      fi\n\n      if ! mv \"${tmp_file}\" \"${catalog_file}\"; then\n        echo \"Error: Failed to update catalog file.\" \u003e\u00262\n        return 1\n      fi\n    done\n\n    echo \"Successfully converted ${#image_digests_map[@]} image reference(s) to digest format.\"\n  else\n    echo \"No images needed conversion.\"\n  fi\n}\n\n# Load utilities and run the conversion\nload_utils\nconvert_tags_to_digests\n","securityContext":{"runAsUser":0},"when":[{"input":"$(params.CONVERT_TAGS_TO_DIGESTS)","operator":"in","values":["true"]},{"input":"$(steps.run-opm-with-user-args.results.skip_create_trusted_artifact)","operator":"in","values":["false"]}],"workingDir":"/var/workdir/source"},{"env":[{"name":"IDMS_PATH_PARAM","value":"$(params.IDMS_PATH)"},{"name":"FILE_TO_UPDATE_PULLSPEC_PATH","value":"$(params.FILE_TO_UPDATE_PULLSPEC)"}],"image":"quay.io/konflux-ci/konflux-test:v1.4.50@sha256:8b9c7be18bef49f60ac9926830174072cc2010c620c7b3d0a5bb53ba02fcf71d","name":"replace-related-images-pullspec-in-file","script":"#!/bin/bash\nset -euo pipefail\n\n# shellcheck source=/dev/null\nsource /utils.sh\nif [[ ! -f \"${IDMS_PATH_PARAM}\" ]]; then\n    echo \"Warning: IDMS file '${IDMS_PATH_PARAM}' not found. Skipping replacement.\"\n    exit 0\nfi\nif [[ ! -f \"${FILE_TO_UPDATE_PULLSPEC_PATH}\" ]]; then\n    echo \"Warning: File to update '${FILE_TO_UPDATE_PULLSPEC_PATH}' not found. Skipping replacement.\"\n    exit 0\nfi\n\necho \"Replacing pullspecs in '${FILE_TO_UPDATE_PULLSPEC_PATH}' using '${IDMS_PATH_PARAM}'.\"\nreplace_mirror_pullspec_with_source \"${IDMS_PATH_PARAM}\" \"${FILE_TO_UPDATE_PULLSPEC_PATH}\"\n","securityContext":{"runAsUser":0},"when":[{"input":"$(params.FILE_TO_UPDATE_PULLSPEC)","operator":"notin","values":[""]},{"input":"$(params.IDMS_PATH)","operator":"notin","values":[""]}],"workingDir":"/var/workdir/source"},{"args":["create","--store","$(params.ociStorage)","$(results.SOURCE_ARTIFACT.path)=/var/workdir/source"],"env":[{"name":"IMAGE_EXPIRES_AFTER","value":"$(params.ociArtifactExpiresAfter)"}],"image":"quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:7c44144ab0a9644c5da8ceea2b9f8df0e2e684aa5c1608688d7df9b8cc2836ac","name":"create-trusted-artifact","when":[{"input":"$(steps.run-opm-with-user-args.results.skip_create_trusted_artifact)","operator":"in","values":["false"]}]}],"volumes":[{"emptyDir":{},"name":"workdir"},{"configMap":{"items":[{"key":"$(params.caTrustConfigMapKey)","path":"ca-bundle.crt"}],"name":"$(params.caTrustConfigMapName)","optional":true},"name":"trusted-ca"}]}}