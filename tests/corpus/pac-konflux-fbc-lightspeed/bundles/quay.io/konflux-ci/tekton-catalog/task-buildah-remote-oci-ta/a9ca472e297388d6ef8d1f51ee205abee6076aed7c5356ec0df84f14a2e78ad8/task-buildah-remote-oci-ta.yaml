ot from ${TUF_URL}\"\n  if ! retry cosign initialize --root \"${TUF_URL}/root.json\" --mirror \"${TUF_URL}\"; then\n    echo \"Failed to initialize TUF root\" \u003e\u00262\n    exit 1\n  fi\n\n  # env var consumed by cosign\n  SIGSTORE_ID_TOKEN=\"$(cat /var/run/sigstore/cosign/oidc-token)\"\n  export SIGSTORE_ID_TOKEN\n\n  IMAGE_REF=\"$(cat \"$(results.IMAGE_REF.path)\")\"\n\n  ATT_SBOM_TYPE=\"${SBOM_TYPE}\"\n  if [ \"${ATT_SBOM_TYPE}\" = \"spdx\" ]; then\n    # for format cossistency with cyclonedx format, we want to use spdxjson instad of spdx\n    # spdx export data as rawstring, we want structured json as cyclonedx\n    ATT_SBOM_TYPE=\"spdxjson\"\n  fi\n\n  echo \"[$(date --utc -Ins)] Sign SBOM\"\n  echo \"Signing and attaching SBOM to ${IMAGE_REF} using keyless signing\"\n  if ! retry cosign attest -y --type \"${ATT_SBOM_TYPE}\" --predicate sbom.json \\\n    --rekor-url=\"${REKOR_URL}\" \\\n    --fulcio-url=\"${SIGSTORE_FULCIO_URL}\" \\\n    --oidc-issuer=\"${SIGSTORE_OIDC_ISSUER}\" \\\n    \"${IMAGE_REF}\"; then\n    echo \"Failed to sign SBOM\" \u003e\u00262\n    exit 1\n  fi\nfi\n\necho\necho \"[$(date --utc -Ins)] End upload-sbom\"\n","securityContext":{"runAsNonRoot":false,"runAsUser":0},"volumeMounts":[{"mountPath":"/mnt/trusted-ca","name":"trusted-ca","readOnly":true},{"mountPath":"/var/run/sigstore/cosign","name":"oidc-token","readOnly":true}],"workingDir":"/var/workdir"}],"volumes":[{"name":"activation-key","secret":{"optional":true,"secretName":"$(params.ACTIVATION_KEY)"}},{"name":"additional-secret","secret":{"optional":true,"secretName":"$(params.ADDITIONAL_SECRET)"}},{"name":"etc-pki-entitlement","secret":{"optional":true,"secretName":"$(params.ENTITLEMENT_SECRET)"}},{"name":"oidc-token","projected":{"sources":[{"serviceAccountToken":{"audience":"sigstore","expirationSeconds":600,"path":"oidc-token"}}]}},{"configMap":{"items":[{"key":"$(params.PROXY_CA_TRUST_CONFIG_MAP_KEY)","path":"ca-bundle.crt"}],"name":"$(params.PROXY_CA_TRUST_CONFIG_MAP_NAME)