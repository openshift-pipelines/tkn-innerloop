d.\nThese will be copied to the user's home before prefetch is run. Any\nother files in this Workspace are ignored. It is strongly recommended\nto bind a Secret to this Workspace over other volume types.\n","name":"git-basic-auth","optional":true},{"description":"Workspace containing a .netrc file. Prefetch will use the credentials in this file when\nperforming http(s) requests.\n","name":"netrc","optional":true}]}}