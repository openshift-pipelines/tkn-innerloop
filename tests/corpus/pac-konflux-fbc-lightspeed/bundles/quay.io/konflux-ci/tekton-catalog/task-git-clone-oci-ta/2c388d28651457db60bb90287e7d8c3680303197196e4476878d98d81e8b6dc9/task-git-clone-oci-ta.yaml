{"apiVersion":"tekton.dev/v1","kind":"Task","metadata":{"annotations":{"tekton.dev/categories":"Git","tekton.dev/displayName":"git clone oci trusted artifacts","tekton.dev/pipelines.minVersion":"0.21.0","tekton.dev/platforms":"linux/amd64,linux/s390x,linux/ppc64le,linux/arm64","tekton.dev/tags":"git"},"labels":{"app.kubernetes.io/version":"0.1"},"name":"git-clone-oci-ta"},"spec":{"description":"The git-clone-oci-ta Task will clone a repo from the provided url and store it as a trusted artifact in the provided OCI repository.","params":[{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the CA bundle data.","name":"caTrustConfigMapKey","type":"string"},{"default":"trusted-ca","description":"The name of the ConfigMap to read CA bundle data from.","name":"caTrustConfigMapName","type":"string"},{"default":"1","description":"Perform a shallow clone, fetching only the most recent N commits.","name":"depth","type":"string"},{"default":"true","description":"Check symlinks in the repo. If they're pointing outside of the repo, the build will fail.\n","name":"enableSymlinkCheck","type":"string"},{"default":"false","description":"Fetch all tags for the repo.","name":"fetchTags","type":"string"},{"default":"","description":"HTTP proxy server for non-SSL requests.","name":"httpProxy","type":"string"},{"default":"","description":"HTTPS proxy server for SSL requests.","name":"httpsProxy","type":"string"},{"default":"","description":"Perform a shallow fetch of the target branch, fetching only the most recent N commits.\nIf empty, fetches the full history of the target branch.\n","name":"mergeSourceDepth","type":"string"},{"default":"","description":"URL of the repository to fetch the target branch from when mergeTargetBranch is true.\nIf empty, uses the same repository (origin). This allows merging a branch from a different repository.\n","name":"mergeSourceRepoUrl","type":"string"},{"default":"false","description":"Set to \"true\" to merge the targetBranch into the checked-out revision.","name":"mergeTargetBranch","type":"string"},{"default":"","description":"Opt out of proxying HTTP/HTTPS requests.","name":"noProxy","type":"string"},{"default":"","description":"Expiration date for the trusted artifacts created in the OCI repository. An empty string means the artifacts do not expire.","name":"ociArtifactExpiresAfter","type":"string"},{"description":"The OCI repository where the Trusted Artifacts are stored.","name":"ociStorage","type":"string"},{"default":"","description":"Refspec to fetch before checking out revision.","name":"refspec","type":"string"},{"default":"","description":"Revision to checkout. (branch, tag, sha, ref, etc...)","name":"revision","type":"string"},{"default":"7","description":"Length of short commit SHA","name":"shortCommitLength","type":"string"},{"default":"","description":"Define the directory patterns to match or exclude when performing a sparse checkout.","name":"sparseCheckoutDirectories","type":"string"},{"default":"true","description":"Set the `http.sslVerify` global git config. Setting this to `false` is not advised unless you are sure that you trust your git remote.","name":"sslVerify","type":"string"},{"default":"","description":"Comma-separated list of specific submodule paths to initialize and fetch. Only submodules in the specified directories and their subdirectories will be fetched.\nEmpty string fetches all submodules. Parameter \"submodules\" must be set to \"true\" to make this parameter applicable.\n","name":"submodulePaths","type":"string"},{"default":"true","description":"Initialize and fetch git submodules.","name":"submodules","type":"string"},{"default":"main","description":"The target branch to merge into the revision (if mergeTargetBranch is true).","name":"targetBranch","type":"string"},{"description":"Repository URL to clone from.","name":"url","type":"string"},{"default":"/tekton/home","description":"Absolute path to the user's home directory. Set this explicitly if you are running the image as a non-root user.\n","name":"userHome","type":"string"},{"default":"false","description":"Log the commands that are executed during `git-clone`'s operation.","name":"verbose","type":"string"}],"results":[{"description":"The precise commit SHA that was fetched by this Task. This result uses Chains type hinting to include in the provenance.","name":"CHAINS-GIT_COMMIT"},{"description":"The precise URL that was fetched by this Task. This result uses Chains type hinting to include in the provenance.","name":"CHAINS-GIT_URL"},{"description":"The Trusted Artifact URI pointing to the artifact with the application source code.","name":"SOURCE_ARTIFACT","type":"string"},{"description":"The precise commit SHA that was fetched by this Task.","name":"commit"},{"description":"The commit timestamp of the checkout","name":"commit-timestamp"},{"description":"The SHA of the commit after merging the target branch (if the param mergeTargetBranch is true).","name":"merged_sha"},{"description":"The commit SHA that was fetched by this Task limited to params.shortCommitLength number of characters","name":"short-commit"},{"description":"The precise URL that was fetched by this Task.","name":"url"}],"steps":[{"env":[{"name":"HOME","value":"$(params.userHome)"},{"name":"PARAM_URL","value":"$(params.url)"},{"name":"PARAM_REVISION","value":"$(params.revision)"},{"name":"PARAM_REFSPEC","value":"$(params.refspec)"},{"name":"PARAM_SUBMODULES","value":"$(params.submodules)"},{"name":"PARAM_SUBMODULE_PATHS","value":"$(params.submodulePaths)"},{"name":"PARAM_DEPTH","value":"$(params.depth)"},{"name":"PARAM_SHORT_COMMIT_LENGTH","value":"$(params.shortCommitLength)"},{"name":"PARAM_SSL_VERIFY","value":"$(params.sslVerify)"},{"name":"PARAM_HTTP_PROXY","value":"$(params.httpProxy)"},{"name":"PARAM_HTTPS_PROXY","value":"$(params.httpsProxy)"},{"name":"PARAM_NO_PROXY","value":"$(params.noProxy)"},{"name":"PARAM_VERBOSE","value":"$(params.verbose)"},{"name":"PARAM_SPARSE_CHECKOUT_DIRECTORIES","value":"$(params.sparseCheckoutDirectories)"},{"name":"PARAM_USER_HOME","value":"$(params.userHome)"},{"name":"PARAM_FETCH_TAGS","value":"$(params.fetchTags)"},{"name":"PARAM_MERGE_TARGET_BRANCH","value":"$(params.mergeTargetBranch)"},{"name":"PARAM_TARGET_BRANCH","value":"$(params.targetBranch)"},{"name":"PARAM_MERGE_SOURCE_REPO_URL","value":"$(params.mergeSourceRepoUrl)"},{"name":"PARAM_MERGE_SOURCE_DEPTH","value":"$(params.mergeSourceDepth)"},{"name":"WORKSPACE_SSH_DIRECTORY_BOUND","value":"$(workspaces.ssh-directory.bound)"},{"name":"WORKSPACE_SSH_DIRECTORY_PATH","value":"$(workspaces.ssh-directory.path)"},{"name":"WORKSPACE_BASIC_AUTH_DIRECTORY_BOUND","value":"$(workspaces.basic-auth.bound)"},{"name":"WORKSPACE_BASIC_AUTH_DIRECTORY_PATH","value":"$(workspaces.basic-auth.path)"},{"name":"CHECKOUT_DIR","value":"/var/workdir/source"}],"image":"quay.io/konflux-ci/git-clone@sha256:09ac9c14392b5c2b8057f66cc4abfb8ce5d7214706318959d00908923a754434","name":"clone","script":"#!/usr/bin/env sh\nset -eu\n\nif [ \"${PARAM_VERBOSE}\" = \"true\" ]; then\n  set -x\nfi\n\nif [ \"${WORKSPACE_BASIC_AUTH_DIRECTORY_BOUND}\" = \"true\" ]; then\n  if [ -f \"${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.git-credentials\" ] \u0026\u0026 [ -f \"${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.gitconfig\" ]; then\n    cp \"${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.git-credentials\" \"${PARAM_USER_HOME}/.git-credentials\"\n    cp \"${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/.gitconfig\" \"${PARAM_USER_HOME}/.gitconfig\"\n  # Compatibility with kubernetes.io/basic-auth secrets\n  elif [ -f \"${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/username\" ] \u0026\u0026 [ -f \"${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/password\" ]; then\n    HOSTNAME=$(echo $PARAM_URL | awk -F/ '{print $3}')\n    echo \"https://$(cat ${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/username):$(cat ${WORKSPACE_BASIC_AUTH_DIRECTORY_PATH}/password)@$HOSTNAME\" \u003e\"${PARAM_USER_HOME}/.git-credentials\"\n    echo -e \"[credential \\\"https://$HOSTNAME\\\"]\\n  helper = store\" \u003e\"${PARAM_USER_HOME}/.gitconfig\"\n  else\n    echo \"Unknown basic-auth workspace format\"\n    exit 1\n  fi\n  chmod 400 \"${PARAM_USER_HOME}/.git-credentials\"\n  chmod 400 \"${PARAM_USER_HOME}/.gitconfig\"\nfi\n\n# Should be called after the gitconfig is copied from the repository secret\nca_bundle=/mnt/trusted-ca/ca-bundle.crt\nif [ -f \"$ca_bundle\" ]; then\n  echo \"INFO: Using mounted CA bundle: $ca_bundle\"\n  git config --global http.sslCAInfo \"$ca_bundle\"\nfi\n\nif [ \"${WORKSPACE_SSH_DIRECTORY_BOUND}\" = \"true\" ]; then\n  cp -R \"${WORKSPACE_SSH_DIRECTORY_PATH}\" \"${PARAM_USER_HOME}\"/.ssh\n  chmod 700 \"${PARAM_USER_HOME}\"/.ssh\n  chmod -R 400 \"${PARAM_USER_HOME}\"/.ssh/*\nfi\n\ntest -z \"${PARAM_HTTP_PROXY}\" || export HTTP_PROXY=\"${PARAM_HTTP_PROXY}\"\ntest -z \"${PARAM_HTTPS_PROXY}\" || export HTTPS_PROXY=\"${PARAM_HTTPS_PROXY}\"\ntest -z \"${PARAM_NO_PROXY}\" || export NO_PROXY=\"${PARAM_NO_PROXY}\"\n\n/ko-app/git-init \\\n  -url=\"${PARAM_URL}\" \\\n  -revision=\"${PARAM_REVISION}\" \\\n  -refspec=\"${PARAM_REFSPEC}\" \\\n  -path=\"${CHECKOUT_DIR}\" \\\n  -sslVerify=\"${PARAM_SSL_VERIFY}\" \\\n  -submodules=\"${PARAM_SUBMODULES}\" \\\n  -submodulePaths=\"${PARAM_SUBMODULE_PATHS}\" \\\n  -depth=\"${PARAM_DEPTH}\" \\\n  -sparseCheckoutDirectories=\"${PARAM_SPARSE_CHECKOUT_DIRECTORIES}\" \\\n  -retryMaxAttempts=10\ncd \"${CHECKOUT_DIR}\"\nRESULT_SHA=\"$(git rev-parse HEAD)\"\nRESULT_SHA_SHORT=\"$(git rev-parse --short=\"${PARAM_SHORT_COMMIT_LENGTH}\" HEAD)\"\n\nif [ \"${PARAM_MERGE_TARGET_BRANCH}\" = \"true\" ]; then\n  echo \"Merge option enabled. Attempting to merge target branch '${PARAM_TARGET_BRANCH}' into HEAD (${RESULT_SHA}).\"\n\n  if [ \"${PARAM_DEPTH}\" = \"1\" ]; then\n    echo \"WARNING: Shallow clone with depth=1 may cause merge conflicts due to insufficient commit history.\" \u003e\u00262\n  fi\n\n  if [ \"${PARAM_MERGE_SOURCE_DEPTH}\" = \"1\" ]; then\n    echo \"WARNING: Shallow fetch with mergeSourceDepth=1 may cause merge conflicts due to insufficient commit history.\" \u003e\u00262\n  fi\n\n  # Determine if merging from a different repository or the same one\n  if [ -n \"${PARAM_MERGE_SOURCE_REPO_URL}\" ]; then\n    # Normalize URLs for comparison (remove trailing slashes and .git suffix)\n    normalize_url() {\n      echo \"$1\" | sed -e 's#/$##' -e 's#\\.git$##'\n    }\n\n    NORMALIZED_ORIGIN_URL=$(normalize_url \"${PARAM_URL}\")\n    NORMALIZED_MERGE_URL=$(normalize_url \"${PARAM_MERGE_SOURCE_REPO_URL}\")\n\n    if [ \"${NORMALIZED_ORIGIN_URL}\" = \"${NORMALIZED_MERGE_URL}\" ]; then\n      echo \"Merge source URL is the same as origin. Using existing 'origin' remote.\"\n      MERGE_REMOTE=\"origin\"\n    else\n      echo \"Merging from different repository: ${PARAM_MERGE_SOURCE_REPO_URL}\"\n      echo \"Adding remote 'merge-source'...\"\n      git remote add merge-source \"${PARAM_MERGE_SOURCE_REPO_URL}\"\n      MERGE_REMOTE=\"merge-source\"\n    fi\n  else\n    echo \"Merging from the same repository (origin)\"\n    MERGE_REMOTE=\"origin\"\n  fi\n\n  echo \"Fetching target branch '${PARAM_TARGET_BRANCH}' from ${MERGE_REMOTE}...\"\n  if [ -n \"${PARAM_MERGE_SOURCE_DEPTH}\" ]; then\n    retry git fetch --depth=\"${PARAM_MERGE_SOURCE_DEPTH}\" ${MERGE_REMOTE} \"${PARAM_TARGET_BRANCH}\"\n  else\n    retry git fetch ${MERGE_REMOTE} \"${PARAM_TARGET_BRANCH}\"\n  fi\n\n  echo \"Merging ${MERGE_REMOTE}/${PARAM_TARGET_BRANCH} into current HEAD...\"\n  git config --global user.email \"tekton-git-clone@tekton.dev\"\n  git config --global user.name \"Tekton Git Clone Task\"\n\n  if ! git merge FETCH_HEAD --no-commit --no-ff --allow-unrelated-histories; then\n    echo \"ERROR: Merge conflict detected or merge failed before commit.\" \u003e\u00262\n    echo \"--- Git Status ---\"\n    git status\n    echo \"------------------\"\n    exit 1\n  fi\n\n  # Check if there are changes staged for commit\n  if git diff --staged --quiet; then\n    echo \"No diff was found, skipping merge...\" \u003e\u00262\n  else\n    echo \"Merge successful (no conflicts found), committing...\"\n    if ! git commit -m \"Merge branch '${PARAM_TARGET_BRANCH}' from ${MERGE_REMOTE} into ${RESULT_SHA}\"; then\n      echo \"ERROR: Failed to commit merge.\" \u003e\u00262\n      exit 1\n    fi\n    MERGED_SHA=$(git rev-parse HEAD)\n    echo \"New HEAD after merge: ${MERGED_SHA}\"\n    echo \"${MERGED_SHA}\" \u003e\"$(results.merged_sha.path)\"\n  fi\n\nelse\n  echo \"Merge option disabled. Using checked-out revision ${RESULT_SHA} directly.\"\nfi\nprintf \"%s\" \"${RESULT_SHA}\" \u003e\"$(results.commit.path)\"\nprintf \"%s\" \"${RESULT_SHA}\" \u003e\"$(results.CHAINS-GIT_COMMIT.path)\"\nprintf \"%s\" \"${RESULT_SHA_SHORT}\" \u003e\"$(results.short-commit.path)\"\nprintf \"%s\" \"${PARAM_URL}\" \u003e\"$(results.url.path)\"\nprintf \"%s\" \"${PARAM_URL}\" \u003e\"$(results.CHAINS-GIT_URL.path)\"\nprintf \"%s\" \"$(git log -1 --pretty=%ct)\" \u003e\"$(results.commit-timestamp.path)\"\n\nif [ \"${PARAM_FETCH_TAGS}\" = \"true\" ]; then\n  echo \"Fetching tags\"\n  retry git fetch --tags\nfi\n","securityContext":{"runAsUser":0},"volumeMounts":[{"mountPath":"/mnt/trusted-ca","name":"trusted-ca","readOnly":true},{"mountPath":"/var/workdir","name":"workdir"}]},{"env":[{"name":"PARAM_ENABLE_SYMLINK_CHECK","value":"$(params.enableSymlinkCheck)"},{"name":"CHECKOUT_DIR","value":"/var/workdir/source"}],"image":"quay.io/konflux-ci/git-clone@sha256:09ac9c14392b5c2b8057f66cc4abfb8ce5d7214706318959d00908923a754434","name":"symlink-check","script":"#!/usr/bin/env bash\nset -euo pipefail\n\ncheck_symlinks() {\n  FOUND_SYMLINK_POINTING_OUTSIDE_OF_REPO=false\n  while read -r symlink; do\n    target=$(readlink -m \"$symlink\")\n    if ! [[ \"$target\" =~ ^$CHECKOUT_DIR ]]; then\n      echo \"The cloned repository contains symlink pointing outside of the cloned repository: $symlink\"\n      FOUND_SYMLINK_POINTING_OUTSIDE_OF_REPO=true\n    fi\n  done \u003c \u003c(find $CHECKOUT_DIR -type l -print)\n  if [ \"$FOUND_SYMLINK_POINTING_OUTSIDE_OF_REPO\" = true ]; then\n    return 1\n  fi\n}\n\nif [ \"${PARAM_ENABLE_SYMLINK_CHECK}\" = \"true\" ]; then\n  echo \"Running symlink check\"\n  check_symlinks\nfi\n","volumeMounts":[{"mountPath":"/var/workdir","name":"workdir"}]},{"args":["create","--store","$(params.ociStorage)","$(results.SOURCE_ARTIFACT.path)=/var/workdir/source"],"computeResources":{"limits":{"memory":"3Gi"},"requests":{"cpu":"1","memory":"3Gi"}},"env":[{"name":"IMAGE_EXPIRES_AFTER","value":"$(params.ociArtifactExpiresAfter)"}],"image":"quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:15d7dc86012e41b10d1eb37679ec03ee75c96436224fadd0938a49dc537aa4ad","name":"create-trusted-artifact","volumeMounts":[{"mountPath":"/var/workdir","name":"workdir"},{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"}]}],"volumes":[{"configMap":{"items":[{"key":"$(params.caTrustConfigMapKey)","path":"ca-bundle.crt"}],"name":"$(params.caTrustConfigMapName)","optional":true},"name":"trusted-ca"},{"emptyDir":{},"name":"workdir"}],"workspaces":[{"description":"A Workspace containing a .gitconfig and .git-credentials file or username and password.\nThese will be copied to the user's home before any git commands are run. Any\nother files in this Workspace are ignored. It is strongly recommended\nto use ssh-directory over basic-auth whenever possible and to bind a\nSecret to this Workspace over other volume types.\n","name":"basic-auth","optional":true},{"description":"A .ssh directory with private key, known_hosts, config, etc. Copied to\nthe user's home before git commands are executed. Used to authenticate\nwith the git remote when performing the clone. Binding a Secret to this\nWorkspace is strongly recommended over other volume types.\n","name":"ssh-directory","optional":true}]}}