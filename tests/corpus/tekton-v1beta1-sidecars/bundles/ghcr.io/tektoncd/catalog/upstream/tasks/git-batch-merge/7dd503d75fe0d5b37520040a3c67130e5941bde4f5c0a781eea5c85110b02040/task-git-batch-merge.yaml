{"apiVersion":"tekton.dev/v1beta1","kind":"Task","metadata":{"annotations":{"tekton.dev/categories":"Git","tekton.dev/deprecated":"true","tekton.dev/displayName":"git batch merge","tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/platforms":"linux/amd64,linux/s390x,linux/ppc64le,linux/arm64","tekton.dev/tags":"git"},"labels":{"app.kubernetes.io/version":"0.2"},"name":"git-batch-merge"},"spec":{"description":"This task takes a set of refspecs, fetches them and performs git operations (cherry-pick or merge) to apply them in order on the given base revision (default master).\nThe resulting commit SHA will not match across taskruns, but the git tree SHA should match. This can be useful for batch testing changes, for example, when you want to batch up your PRs into a single merge by taking the HEAD of the branch you want to merge to, and adding all the PRs to it. This concept is used in tools such as Tide to batch test PR’s, and Zuul CI Gating, to perform speculative execution of PR’s/change requests individually","params":[{"description":"git url to clone","name":"url","type":"string"},{"default":"master","description":"base git revision to checkout (branch, tag, sha, ref…)","name":"revision","type":"string"},{"default":"refs/heads/master:refs/heads/master","description":"base git refspec to fetch before checking out revision","name":"refspec","type":"string"},{"description":"git refs to fetch and batch on top of revision using the given mode (must be a valid refname, no commit SHA's)","name":"batchedRefs","type":"string"},{"default":"GitBatch Task","description":"git user name to use for creating the batched commit (First Last)","name":"gitUserName","type":"string"},{"default":"GitBatch.Task@tekton.dev","description":"git user email to use for creating the batched commit (First.Last@domain.com)","name":"gitUserEmail","type":"string"},{"default":"merge","description":"git operation to perform while batching (choose from merge, cherry-pick)","name":"mode","type":"string"},{"default":"true","description":"defines if the resource should initialize and fetch the submodules","name":"submodules","type":"string"},{"default":"0","description":"performs a shallow clone where only the most recent commit(s) will be fetched","name":"depth","type":"string"},{"default":"true","description":"defines if http.sslVerify should be set to true or false in the global git config","name":"sslVerify","type":"string"},{"default":"","description":"subdirectory inside the \"output\" workspace to clone the git repo into","name":"subdirectory","type":"string"},{"default":"false","description":"clean out the contents of the repo's destination directory (if it already exists) before trying to clone the repo there","name":"deleteExisting","type":"string"},{"default":"ghcr.io/tektoncd/github.com/tektoncd/pipeline/cmd/git-init:v0.18.1","description":"The image used where the git-init binary is.","name":"gitInitImage","type":"string"}],"results":[{"description":"The final commit SHA that was obtained after batching all provided refs onto revision","name":"commit"},{"description":"The git tree SHA that was obtained after batching all provided refs onto revision.","name":"tree"}],"steps":[{"image":"$(params.gitInitImage)","name":"clone","script":"CHECKOUT_DIR=\"$(workspaces.output.path)/$(params.subdirectory)\"\n\ncleandir() {\n  # Delete any existing contents of the repo directory if it exists.\n  #\n  # We don't just \"rm -rf $CHECKOUT_DIR\" because $CHECKOUT_DIR might be \"/\"\n  # or the root of a mounted volume.\n  if [[ -d \"$CHECKOUT_DIR\" ]] ; then\n    # Delete non-hidden files and directories\n    rm -rf \"$CHECKOUT_DIR\"/*\n    # Delete files and directories starting with . but excluding ..\n    rm -rf \"$CHECKOUT_DIR\"/.[!.]*\n    # Delete files and directories starting with .. plus any other character\n    rm -rf \"$CHECKOUT_DIR\"/..?*\n  fi\n}\n\nif [[ \"$(params.deleteExisting)\" == \"true\" ]] ; then\n  cleandir\nfi\n\np=\"$(params.batchedRefs)\"\nrefs=\"$(params.refspec)\"\nfor ref in $p; do\n  refs=\"$refs $ref:refs/batch/$ref\"\ndone\n\n/ko-app/git-init \\\n  -url \"$(params.url)\" \\\n  -revision \"$(params.revision)\" \\\n  -refspec \"$refs\" \\\n  -path \"$CHECKOUT_DIR\" \\\n  -sslVerify=\"$(params.sslVerify)\" \\\n  -submodules=\"$(params.submodules)\" \\\n  -depth \"$(params.depth)\"\n\ngit -C $CHECKOUT_DIR config user.name \"$(params.gitUserName)\"\ngit -C $CHECKOUT_DIR config user.email \"$(params.gitUserEmail)\"\n\nmode=\"$(params.mode)\"\nif [[ $mode == \"merge\" ]]; then\n  for ref in $p; do\n     git -C $CHECKOUT_DIR merge --quiet --allow-unrelated-histories refs/batch/$ref\n  done\nelif [[ $mode == \"cherry-pick\" ]]; then\n  for ref in $p; do\n     git -C $CHECKOUT_DIR cherry-pick --allow-empty --keep-redundant-commits refs/batch/$ref\n  done\nelse\n    echo \"unsupported mode $mode\"\n    exit 1\nfi\n\nRESULT_SHA=\"$(git -C $CHECKOUT_DIR rev-parse HEAD)\"\nTREE_SHA=\"$(git -C $CHECKOUT_DIR rev-parse HEAD^{tree})\"\n# Make sure we don't add a trailing newline to the result!\necho -n \"$(echo $RESULT_SHA | tr -d '\\n')\" \u003e $(results.commit.path)\necho -n \"$(echo $TREE_SHA | tr -d '\\n')\" \u003e $(results.tree.path)\n"}],"workspaces":[{"description":"The git repo will be cloned onto the volume backing this workspace","name":"output"}]}}