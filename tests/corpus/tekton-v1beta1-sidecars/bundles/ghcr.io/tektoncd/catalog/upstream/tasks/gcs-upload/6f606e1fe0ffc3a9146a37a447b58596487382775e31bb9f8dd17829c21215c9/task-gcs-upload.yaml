{"apiVersion":"tekton.dev/v1beta1","kind":"Task","metadata":{"annotations":{"tekton.dev/categories":"Cloud, Storage","tekton.dev/deprecated":"true","tekton.dev/displayName":"Upload to GCS","tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/platforms":"linux/amd64","tekton.dev/tags":"cloud, gcs"},"labels":{"app.kubernetes.io/version":"0.1"},"name":"gcs-upload"},"spec":{"description":"A Task that uploads a GCS bucket.\nThis task uploads files or directories from a Workspace to a GCS bucket.","params":[{"description":"The path to files or directories relative to the source workspace that you'd like to upload.","name":"path","type":"string"},{"description":"The address (including \"gs://\") where you'd like to upload files to.","name":"location","type":"string"},{"default":"service_account.json","description":"The path inside the credentials workspace to the GOOGLE_APPLICATION_CREDENTIALS key file.","name":"serviceAccountPath","type":"string"}],"steps":[{"image":"gcr.io/google.com/cloudsdktool/cloud-sdk:310.0.0@sha256:cb03669fcdb9191d55a6200f2911fff3baec0b8c39b156d95b68aabe975ac506","name":"upload","script":"#!/usr/bin/env bash\nset -xe\n\nCRED_PATH=\"$(workspaces.credentials.path)/$(params.serviceAccountPath)\"\nSOURCE=\"$(workspaces.source.path)/$(params.path)\"\n\nif [[ -f \"$CRED_PATH\" ]]; then\n  GOOGLE_APPLICATION_CREDENTIALS=\"$CRED_PATH\"\nfi\n\nif [[ \"${GOOGLE_APPLICATION_CREDENTIALS}\" != \"\" ]]; then\n  echo GOOGLE_APPLICATION_CREDENTIALS is set, activating Service Account...\n  gcloud auth activate-service-account --key-file=${GOOGLE_APPLICATION_CREDENTIALS}\nfi\n\nif [[ -d \"$SOURCE\" ]]; then\n  gsutil -m rsync -d -r \"$SOURCE\" \"$(params.location)\"\nelse\n  gsutil cp \"$SOURCE\" \"$(params.location)\"\nfi\n"}],"workspaces":[{"description":"A secret with a service account key to use as GOOGLE_APPLICATION_CREDENTIALS.","name":"credentials"},{"description":"A workspace where files will be uploaded from.","name":"source"}]}}