{"apiVersion":"tekton.dev/v1beta1","kind":"Task","metadata":{"annotations":{"tekton.dev/categories":"Build Tools","tekton.dev/deprecated":"true","tekton.dev/displayName":"golang build","tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/platforms":"linux/amd64,linux/s390x,linux/ppc64le","tekton.dev/tags":"build-tool"},"labels":{"app.kubernetes.io/version":"0.3"},"name":"golang-build"},"spec":{"description":"This Task is Golang task to build Go projects.","params":[{"description":"base package to build in","name":"package"},{"default":"./cmd/...","description":"packages to build (default: ./cmd/...)","name":"packages"},{"default":"latest","description":"golang version to use for builds","name":"version"},{"default":"-v","description":"flags to use for the test command","name":"flags"},{"default":"linux","description":"running program's operating system target","name":"GOOS"},{"default":"amd64","description":"running program's architecture target","name":"GOARCH"},{"default":"auto","description":"value of module support","name":"GO111MODULE"},{"default":"","description":"Go caching directory path","name":"GOCACHE"},{"default":"","description":"Go mod caching directory path","name":"GOMODCACHE"},{"default":"","description":"Toggle cgo tool during Go build. Use value '0' to disable cgo (for static builds).","name":"CGO_ENABLED"},{"default":"","description":"Go checksum database url. Use value 'off' to disable checksum validation.","name":"GOSUMDB"}],"steps":[{"env":[{"name":"GOOS","value":"$(params.GOOS)"},{"name":"GOARCH","value":"$(params.GOARCH)"},{"name":"GO111MODULE","value":"$(params.GO111MODULE)"},{"name":"GOCACHE","value":"$(params.GOCACHE)"},{"name":"GOMODCACHE","value":"$(params.GOMODCACHE)"},{"name":"CGO_ENABLED","value":"$(params.CGO_ENABLED)"},{"name":"GOSUMDB","value":"$(params.GOSUMDB)"}],"image":"docker.io/library/golang:$(params.version)","name":"build","script":"if [ ! -e $GOPATH/src/$(params.package)/go.mod ];then\n  SRC_PATH=\"$GOPATH/src/$(params