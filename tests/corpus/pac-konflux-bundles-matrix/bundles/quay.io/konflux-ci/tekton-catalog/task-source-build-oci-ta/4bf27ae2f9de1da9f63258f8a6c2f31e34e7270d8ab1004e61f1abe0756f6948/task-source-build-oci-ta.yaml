{"apiVersion":"tekton.dev/v1","kind":"Task","metadata":{"annotations":{"tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/tags":"konflux"},"labels":{"app.kubernetes.io/version":"0.4.0"},"name":"source-build-oci-ta"},"spec":{"description":"Source image build.","params":[{"default":"","description":"By default, the task inspects the SBOM of the binary image to find the base image. With this parameter, you can override that behavior and pass the base image directly. The value should be a newline-separated list of images, in the same order as the FROM instructions specified in a multistage Dockerfile.","name":"BASE_IMAGES","type":"string"},{"description":"Binary image name with tag.","name":"BINARY_IMAGE","type":"string"},{"description":"Digest of the binary image.","name":"BINARY_IMAGE_DIGEST","type":"string"},{"default":"false","description":"When set to \"true\", source build task won't fail when source image is missing signatures (this can be used for development)","name":"IGNORE_UNSIGNED_IMAGE","type":"string"},{"default":"","description":"The Trusted Artifact URI pointing to the artifact with the prefetched dependencies.","name":"PREFETCH_ARTIFACT","type":"string"},{"description":"The Trusted Artifact URI pointing to the artifact with the application source code.","name":"SOURCE_ARTIFACT","type":"string"},{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the CA bundle data.","name":"caTrustConfigMapKey","type":"string"},{"default":"trusted-ca","description":"The name of the ConfigMap to read CA bundle data from.","name":"caTrustConfigMapName","type":"string"}],"results":[{"description":"Build result.","name":"BUILD_RESULT"},{"description":"Image reference of the built image.","name":"IMAGE_REF"},{"description":"The source image digest.","name":"SOURCE_IMAGE_DIGEST"},{"description":"The source image url.","name":"SOURCE_IMAGE_URL"}],"stepTemplate":{"env":[{"name":"BASE_IMAGES_FILE","value":"/var/workdir/base-images.txt"},{"name":"BINARY_IMAGE","value":"$(params.BINARY_IMAGE)"},{"name":"BINARY_IMAGE_DIGEST","value":"$(params.BINARY_IMAGE_DIGEST)"},{"name":"IMAGE_NOT_EXIST_FLAG","value":"/var/workdir/image-not-exist"}],"imagePullPolicy":"IfNotPresent","volumeMounts":[{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"},{"mountPath":"/var/workdir","name":"workdir"}]},"steps":[{"args":["use","$(params.SOURCE_ARTIFACT)=/var/workdir/source","$(params.PREFETCH_ARTIFACT)=/var/workdir/prefetch"],"image":"quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:6df16e808f147926a2ba5f88588350bd8f77e73fde43614e79ddbd6e2b097d2e","name":"use-trusted-artifact"},{"computeResources":{"limits":{"memory":"128Mi"},"requests":{"cpu":"50m","memory":"128Mi"}},"env":[{"name":"BASE_IMAGES","value":"$(params.BASE_IMAGES)"}],"image":"quay.io/konflux-ci/task-runner:1.8.1@sha256:b9ef0479b57a494368a12a02886c650314c9ac7391c6228f21065865aab71c9e","name":"get-base-images","script":"#!/usr/bin/env bash\nset -euo pipefail\n\nif [[ ! $BINARY_IMAGE_DIGEST =~ ^sha256:[[:xdigit:]]+$ ]]; then\n  echo \"$BINARY_IMAGE_DIGEST is not a valid sha256 digest.\"\n  exit 1\nfi\n\nif [[ -n \"$BASE_IMAGES\" ]]; then\n  echo \"BASE_IMAGES param received:\"\n  printf \"%s\" \"$BASE_IMAGES\" | tee \"$BASE_IMAGES_FILE\"\n  exit\nfi\n\necho \"BASE_IMAGES param is empty, inspecting the SBOM instead\"\n\nimage_pinned_by_digest=\"${BINARY_IMAGE%:*}@${BINARY_IMAGE_DIGEST}\"\n\nif raw_inspect=$(skopeo inspect --raw \"docker://${image_pinned_by_digest}\"); then\n  echo \"Got manifest of image ${image_pinned_by_digest}\"\nelse\n  if [[ $? == 2 ]]; then\n    printf \"Binary image %s no longer exists in the registry.\\n\" \"$image_pinned_by_digest\" |\n      tee \"$IMAGE_NOT_EXIST_FLAG\"\n    exit\n  else\n    exit 1\n  fi\nfi\n\nif manifest_digest=$(jq -e -r '.manifests[0].digest' \u003c\u003c\u003c\"$raw_inspect\"); then\n  # The BINARY_IMAGE is an image index, each manifest in the list has its own SBOM.\n  # We're gonna assume the base images are the same or similar enough in all the SBOMs.\n  echo \"Image (${image_pinned_by_digest}) is a manifest list, picking an arbitrary image from the list\"\n  image=${image_pinned_by_digest%@*}@${manifest_digest}\nelse\n  # The image is a single manifest\n  image=$image_pinned_by_digest\nfi\n\n# Pre-select the correct credentials to work around cosign not supporting the containers-auth.json spec\nmkdir -p /tmp/auth \u0026\u0026 select-oci-auth \"$image\" \u003e/tmp/auth/config.json\n\nfor i in {1..5}; do\n  echo \"Downloading SBOM for $image (attempt $i)\"\n  sbom=$(DOCKER_CONFIG=/tmp/auth cosign download sbom \"$image\") \u0026\u0026 break\n  [[ \"$i\" -lt 5 ]] \u0026\u0026 sleep 1\ndone\n\nif [[ -z \"$sbom\" ]]; then\n  echo \"Failed to download SBOM after 5 attempts. Proceeding anyway.\"\n  echo \"WARNING: the source image will not include sources for the base image.\"\n  exit 0\nfi\n\necho -n \"Looking for base image in SBOM\"\n\n# Note: the SBOM should contain at most one image with the is_base_image property - the\n# base image for the last FROM instruction. That is the only base image we care about.\nif jq -e '.bomFormat == \"CycloneDX\"' \u003c\u003c\u003c\"$sbom\" \u003e/dev/null; then\n  echo \" (.formulation[].components[] with 'konflux:container:is_base_image' property)\"\n  jq -r '\n        .formulation[]?\n        | .components[]?\n        | select(any(.properties[]?; .name == \"konflux:container:is_base_image\"))\n        | (\n            .purl\n            | capture(\"^pkg:oci/.*?@(?\u003cdigest\u003e[a-z0-9]+:[a-f0-9]+)(?:\\\\?[^#]*repository_url=(?\u003crepository_url\u003e[^\u0026#]*))?\")\n          ) as $matched\n        | $matched.repository_url + \"@\" + $matched.digest\n    ' \u003c\u003c\u003c\"$sbom\" | tee \"$BASE_IMAGES_FILE\"\nelse\n  echo ' (a package with a {\"name\": \"konflux:container:is_base_image\"} JSON-encoded annotation)'\n  jq -r '\n          .packages[]\n          | select(any(.annotations[]?.comment; (fromjson?).name? == \"konflux:container:is_base_image\"))\n          | [.externalRefs[]? | select(.referenceType == \"purl\").referenceLocator] as $purls\n          | (\n              $purls | first\n              | capture(\"^pkg:oci/.*?@(?\u003cdigest\u003e[a-z0-9]+:[a-f0-9]+)(?:\\\\?[^#]*repository_url=(?\u003crepository_url\u003e[^\u0026#]*))?\")\n            ) as $matched\n          | $matched.repository_url + \"@\" + $matched.digest\n\n    ' \u003c\u003c\u003c\"$sbom\" | tee \"$BASE_IMAGES_FILE\"\nfi\n"},{"computeResources":{"limits":{"memory":"2Gi"},"requests":{"cpu":"250m","memory":"2Gi"}},"env":[{"name":"SOURCE_DIR","value":"/var/workdir/source"},{"name":"RESULT_FILE","value":"$(results.BUILD_RESULT.path)"},{"name":"PREFETCH_ARTIFACTS_DIR","value":"/var/workdir/prefetch"},{"name":"RESULT_SOURCE_IMAGE_URL","value":"$(results.SOURCE_IMAGE_URL.path)"},{"name":"RESULT_SOURCE_IMAGE_DIGEST","value":"$(results.SOURCE_IMAGE_DIGEST.path)"},{"name":"WS_BUILD_RESULT_FILE","value":"/var/workdir/source_build_result.json"},{"name":"IGNORE_UNSIGNED_IMAGE","value":"$(params.IGNORE_UNSIGNED_IMAGE)"},{"name":"RESULT_IMAGE_REF","value":"$(results.IMAGE_REF.path)"}],"image":"quay.io/konflux-ci/source-container-build:latest@sha256:157c38d973b561c2a2dcb71777f51674fecdfa58597410bc06b8adc5fe89cad3","name":"build","script":"#!/usr/bin/env bash\nset -euo pipefail\n\nif [ -f \"$IMAGE_NOT_EXIST_FLAG\" ]; then\n  echo \"Drop building source container image.\"\n  printf \"\" \u003e\"$RESULT_SOURCE_IMAGE_URL\"\n  printf \"\" \u003e\"$RESULT_SOURCE_IMAGE_DIGEST\"\n  printf \"\" \u003e\"$RESULT_IMAGE_REF\"\n  message=$(cat \"$IMAGE_NOT_EXIST_FLAG\")\n  printf \"{\\\"status\\\": \\\"drop\\\", \\\"message\\\": \\\"%s\\\"}\" \"$message\" \u003e\"$WS_BUILD_RESULT_FILE\"\n  exit\nfi\n\napp_dir=/opt/source_build\nregistry_allowlist=\"\nregistry.access.redhat.com\nregistry.redhat.io\n\"\n\n## This is needed for the builds performed by the rpm-ostree task\n## otherwise, we can see this error:\n## \"fatal: detected dubious ownership in repository at '/var/workdir/source'\"\n##\ngit config --global --add safe.directory \"$SOURCE_DIR\"\n\nbase_images=$(if [[ -f \"$BASE_IMAGES_FILE\" ]]; then cat \"$BASE_IMAGES_FILE\"; fi)\n\nargs=(\n  --binary-image-ref \"${BINARY_IMAGE}@${BINARY_IMAGE_DIGEST}\"\n  --workspace /var/workdir\n  --source-dir \"$SOURCE_DIR\"\n  --base-images \"$base_images\"\n  --write-result-to \"$RESULT_FILE\"\n  --prefetch-artifacts-dir \"$PREFETCH_ARTIFACTS_DIR\"\n  --registry-allowlist=\"$registry_allowlist\"\n)\nif [ \"$IGNORE_UNSIGNED_IMAGE\" == \"true\" ]; then\n  args+=(--ignore-unsigned-image)\nfi\n\n${app_dir}/appenv/bin/python3 ${app_dir}/source_build.py \"${args[@]}\"\n\njq -j \".image_url\" \u003c\"$RESULT_FILE\" \u003e\"$RESULT_SOURCE_IMAGE_URL\"\njq -j \".image_digest\" \u003c\"$RESULT_FILE\" \u003e\"$RESULT_SOURCE_IMAGE_DIGEST\"\njq -j '\"\\(.image_url)@\\(.image_digest)\"' \"${RESULT_FILE}\" \u003e\"$RESULT_IMAGE_REF\"\n\ncp \"$RESULT_FILE\" \"$WS_BUILD_RESULT_FILE\"\n","securityContext":{"capabilities":{"add":["SETFCAP"]},"runAsUser":0},"workingDir":"/var/workdir"}],"volumes":[{"configMap":{"items":[{"key":"$(params.caTrustConfigMapKey)","path":"ca-bundle.crt"}],"name":"$(params.caTrustConfigMapName)","optional":true},"name":"trusted-ca"},{"emptyDir":{},"name":"workdir"}]}}