{"apiVersion":"tekton.dev/v1","kind":"Task","metadata":{"annotations":{"tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/tags":"image-build, konflux"},"labels":{"app.kubernetes.io/version":"0.4"},"name":"build-image-index"},"spec":{"description":"This takes existing Image Manifests and combines them in an Image Index.","params":[{"description":"The target image and tag where the image will be pushed to.","name":"IMAGE","type":"string"},{"default":"true","description":"Verify the TLS on the registry endpoint (for push/pull to a non-TLS registry)","name":"TLSVERIFY","type":"string"},{"description":"List of Image Manifests to be referenced by the Image Index","name":"IMAGES","type":"array"},{"default":[],"description":"Optional per-image platform mapping as 'imageRef=os/arch' entries (e.g. 'quay.io/org/repo@sha256:aaa=linux/amd64'). Used to set the platform on each index entry explicitly, which is required for OCI artifacts whose empty config carries no platform information. When empty, platforms are left to buildah's inference (unchanged behaviour).","name":"IMAGE_PLATFORM_MAP","type":"array"},{"default":"true","description":"Build an image index even if IMAGES is of length 1. Default true. If the image index generation is skipped, the task will forward values for params.IMAGES[0] to results.IMAGE_*. In order to properly set all results, use the repository:tag@sha256:digest format for the IMAGES parameter.","name":"ALWAYS_BUILD_INDEX","type":"string"},{"default":"vfs","description":"Storage driver to configure for buildah","name":"STORAGE_DRIVER","type":"string"},{"default":"oci","description":"The format for the resulting image's mediaType. Valid values are oci (default) or docker.","name":"BUILDAH_FORMAT","type":"string"},{"default":"false","description":"Flag to enable or disable SBOM validation before save. Validation is optional - use this if you are experiencing performance issues.","name":"SBOM_SKIP_VALIDATION","type":"string"},{"default":"trusted-ca","description":"The name of the ConfigMap to read CA bundle data from","name":"caTrustConfigMapName","type":"string"},{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the CA bundle data","name":"caTrustConfigMapKey","type":"string"}],"results":[{"description":"Digest of the image just built","name":"IMAGE_DIGEST"},{"description":"Image repository and tag where the built image was pushed","name":"IMAGE_URL"},{"description":"List of all referenced image manifests","name":"IMAGES"},{"description":"Image reference of the built image containing both the repository and the digest","name":"IMAGE_REF"},{"description":"Reference of SBOM blob digest to enable digest-based verification from provenance","name":"SBOM_BLOB_URL","type":"string"}],"stepTemplate":{"env":[{"name":"BUILDAH_FORMAT","value":"$(params.BUILDAH_FORMAT)"},{"name":"IMAGE","value":"$(params.IMAGE)"},{"name":"TLSVERIFY","value":"$(params.TLSVERIFY)"},{"name":"ALWAYS_BUILD_INDEX","value":"$(params.ALWAYS_BUILD_INDEX)"},{"name":"STORAGE_DRIVER","value":"$(params.STORAGE_DRIVER)"},{"name":"SBOM_SKIP_VALIDATION","value":"$(params.SBOM_SKIP_VALIDATION)"}],"imagePullPolicy":"IfNotPresent","volumeMounts":[{"mountPath":"/index-build-data","name":"shared-dir"},{"mountPath":"/mnt/trusted-ca","name":"trusted-ca","readOnly":true}]},"steps":[{"args":["--image-platform-map","$(params.IMAGE_PLATFORM_MAP[*])","--images","$(params.IMAGES[*])"],"computeResources":{"limits":{"memory":"4Gi"},"requests":{"cpu":"250m","memory":"4Gi"}},"image":"quay.io/konflux-ci/konflux-build-cli@sha256:337cc9e8f2a3e2d3756119e3abc7baa3a9114a7357c8f45c6937445055b4b7f3","name":"build","script":"#!/bin/bash\n# Fixing group permission on /var/lib/containers\nset -eu\nset -o pipefail\n\nchown root:root /var/lib/containers\n\nsed -i 's/^\\s*short-name-mode\\s*=\\s*.*/short-name-mode = \"disabled\"/' /etc/containers/registries.conf\n\necho \"[$(date --utc -Ins)] Update CA trust\"\n\nca_bundle=/mnt/trusted-ca/ca-bundle.crt\nif [ -f \"$ca_bundle\" ]; then\n  echo \"INFO: Using mounted CA bundle: $ca_bundle\"\n  cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors\n  update-ca-trust\nfi\n\nMANIFEST_DATA_FILE=\"/index-build-data/manifest_data.json\"\n\necho \"Running konflux-build-cli\"\n# shellcheck disable=SC2153  # IMAGE is provided via the step env, not assigned here\nif ! konflux-build-cli image build-image-index \\\n  --image \"$IMAGE\" \\\n  --tls-verify=\"$TLSVERIFY\" \\\n  --buildah-format \"$BUILDAH_FORMAT\" \\\n  --always-build-index=\"$ALWAYS_BUILD_INDEX\" \\\n  --additional-tags \"$(context.taskRun.name)\" \\\n  --output-manifest-path \"$MANIFEST_DATA_FILE\" \\\n  --result-path-image-digest \"$(results.IMAGE_DIGEST.path)\" \\\n  --result-path-image-url \"$(results.IMAGE_URL.path)\" \\\n  --result-path-image-ref \"$(results.IMAGE_REF.path)\" \\\n  --result-path-images \"$(results.IMAGES.path)\" \\\n  \"$@\"; then\n  echo \"Failed to build image index\"\n  exit 1\nfi\n","securityContext":{"capabilities":{"add":["SETFCAP"]},"runAsUser":0}},{"computeResources":{"limits":{"memory":"512Mi"},"requests":{"cpu":"100m","memory":"512Mi"}},"image":"quay.io/konflux-ci/mobster:1.2.1-1782136886@sha256:1374bc35c71781987cce00ef5efe2be42923f83def19b60a570e947189b90d15","name":"create-sbom","script":"#!/bin/bash\nset -e\n\nMANIFEST_DATA_FILE=\"/index-build-data/manifest_data.json\"\nif [ ! -f \"$MANIFEST_DATA_FILE\" ]; then\n  echo \"The manifest_data.json file does not exist. Skipping the SBOM creation...\"\n  exit 0\nfi\n\nIMAGE_URL=\"$(cat \"$(results.IMAGE_URL.path)\")\"\nIMAGE_DIGEST=\"$(cat \"$(results.IMAGE_DIGEST.path)\")\"\necho \"Creating SBOM result file...\"\nmobster_args=(generate --output /index-build-data/index.spdx.json)\n\nif [ \"${SBOM_SKIP_VALIDATION}\" == \"true\" ]; then\n  echo \"Skipping SBOM validation\"\n  mobster_args+=(--skip-validation)\nfi\n\nmobster_args+=(\n  oci-index\n  --index-image-pullspec \"$IMAGE_URL\"\n  --index-image-digest \"$IMAGE_DIGEST\"\n  --index-manifest-path \"$MANIFEST_DATA_FILE\"\n)\nmobster \"${mobster_args[@]}\"\n"},{"computeResources":{"limits":{"memory":"512Mi"},"requests":{"cpu":"100m","memory":"512Mi"}},"image":"quay.io/konflux-ci/task-runner:2.0.0@sha256:4b01fbf98fa7155f5c21443c285f88853864ae7cc66981cf6b543fc6ba16b81b","name":"upload-sbom","script":"#!/bin/bash\nset -e\n\necho \"[$(date --utc -Ins)] Update CA trust\"\n\nca_bundle=/mnt/trusted-ca/ca-bundle.crt\nif [ -f \"$ca_bundle\" ]; then\n  echo \"INFO: Using mounted CA bundle: $ca_bundle\"\n  cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors\n  update-ca-trust\nfi\n\nSBOM_RESULT_FILE=\"/index-build-data/index.spdx.json\"\nif [ ! -f \"$SBOM_RESULT_FILE\" ]; then\n  echo \"The index.spdx.json file does not exists. Skipping the SBOM upload...\"\n  exit 0\nfi\n\n# Pre-select the correct credentials to work around cosign not supporting the containers-auth.json spec\nmkdir -p /tmp/auth \u0026\u0026 select-oci-auth \"$(cat \"$(results.IMAGE_REF.path)\")\" \u003e /tmp/auth/config.json\nexport DOCKER_CONFIG=/tmp/auth\n\necho \"Pushing sbom to registry\"\nif ! retry cosign attach sbom --sbom \"$SBOM_RESULT_FILE\" --type spdx \"$(cat \"$(results.IMAGE_REF.path)\")\"\nthen\n    echo \"Failed to push sbom to registry\"\n    exit 1\nfi\n\n# Remove tag from IMAGE while allowing registry to contain a port number.\nsbom_repo=\"${IMAGE%:*}\"\nsbom_digest=\"$(sha256sum \"$SBOM_RESULT_FILE\" | cut -d' ' -f1)\"\n# The SBOM_BLOB_URL is created by `cosign attach sbom`.\necho -n \"${sbom_repo}@sha256:${sbom_digest}\" | tee \"$(results.SBOM_BLOB_URL.path)\"\n","securityContext":{"runAsNonRoot":false,"runAsUser":0}}],"volumes":[{"emptyDir":{},"name":"shared-dir"},{"configMap":{"items":[{"key":"$(params.caTrustConfigMapKey)","path":"ca-bundle.crt"}],"name":"$(params.caTrustConfigMapName)","optional":true},"name":"trusted-ca"}]}}