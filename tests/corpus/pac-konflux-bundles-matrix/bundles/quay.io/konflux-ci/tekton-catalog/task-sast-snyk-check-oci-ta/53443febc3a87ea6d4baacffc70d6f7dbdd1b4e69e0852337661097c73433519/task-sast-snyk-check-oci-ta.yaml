{"apiVersion":"tekton.dev/v1","kind":"Task","metadata":{"annotations":{"tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/tags":"konflux"},"labels":{"app.kubernetes.io/version":"0.5.1"},"name":"sast-snyk-check-oci-ta"},"spec":{"description":"Scans source code for security vulnerabilities, including common issues such as SQL injection, cross-site scripting (XSS), and code injection attacks using Snyk Code, a Static Application Security Testing (SAST) tool.\n\nFollow the steps given [here](https://konflux-ci.dev/docs/testing/build/snyk/) to obtain a snyk-token and to enable the snyk task in a Pipeline.\n\nThe snyk binary used in this Task comes from a container image defined in https://github.com/konflux-ci/konflux-test\n\nSee https://snyk.io/product/snyk-code/ and https://snyk.io/ for more information about the snyk tool.","params":[{"default":"","description":"Append arguments.","name":"ARGS","type":"string"},{"default":"(^|/)(Dockerfile|Containerfile|[^/]+\\.(sh|bash|zsh|ksh|py|rb|pl|js|mjs|cjs|ts|ps1))$","description":"Extended regex matched against org.opencontainers.image.title (and olot.layer.content.inlayerpath when present) when FETCH_EXTRA_ARTIFACTS=true.","name":"EXTRA_ARTIFACT_FILTER","type":"string"},{"default":"false","description":"When \"true\", fetch files matching EXTRA_ARTIFACT_FILTER from image-url@image-digest into /var/workdir/source alongside the restored SOURCE_ARTIFACT. Supports OCI artifacts (raw titled blobs) and container images with titled layers (e.g. ModelCar/olot), extracting matching tar layers without unpacking the full image.","name":"FETCH_EXTRA_ARTIFACTS","type":"string"},{"default":"","description":"Directories or files to be excluded from Snyk scan (Comma-separated). Useful to split the directories of a git repo across multiple components.","name":"IGNORE_FILE_PATHS","type":"string"},{"default":"true","description":"Report only important findings in task result. Default is \"true\". To report all findings in task result, specify \"false\". Uploaded SARIF report to remote registry always includes all findings, regardless of severity level.","name":"IMP_FINDINGS_ONLY","type":"string"},{"default":"SITE_DEFAULT","description":"Known False Positives (KFP) git URL (optionally taking a revision delimited by \\#). Defaults to \"SITE_DEFAULT\", which means the default value \"https://gitlab.cee.redhat.com/osh/known-false-positives.git\" for internal Konflux instance and empty string for external Konflux instance. If set to an empty string, the KFP filtering is disabled.","name":"KFP_GIT_URL","type":"string"},{"default":"","description":"Name of the scanned project, used to find path exclusions. By default, the Konflux component name will be used.","name":"PROJECT_NAME","type":"string"},{"default":"false","description":"Write excluded records in file. Useful for auditing (defaults to false).","name":"RECORD_EXCLUDED","type":"string"},{"default":"snyk-secret","description":"Name of secret which contains Snyk token.","name":"SNYK_SECRET"},{"description":"The Trusted Artifact URI pointing to the artifact with the application source code.","name":"SOURCE_ARTIFACT","type":"string"},{"default":".","description":"Target directories in component's source code. Multiple values should be separated with commas.","name":"TARGET_DIRS","type":"string"},{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the CA bundle data.","name":"caTrustConfigMapKey","type":"string"},{"default":"trusted-ca","description":"The name of the ConfigMap to read CA bundle data from.","name":"caTrustConfigMapName","type":"string"},{"description":"Digest of the image to scan.","name":"image-digest","type":"string"},{"description":"Image URL.","name":"image-url","type":"string"}],"results":[{"description":"Tekton task test output.","name":"TEST_OUTPUT"}],"stepTemplate":{"volumeMounts":[{"mountPath":"/var/workdir","name":"workdir"}]},"steps":[{"args":["use","$(params.SOURCE_ARTIFACT)=/var/workdir/source"],"computeResources":{"limits":{"memory":"4Gi"},"requests":{"cpu":"50m","memory":"4Gi"}},"image":"quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:d4155ab6553b406bd5ab96b98bb10ab97a38a6f9dcb7c39dd18678428e8b2e64","name":"use-trusted-artifact","volumeMounts":[{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"}]},{"computeResources":{"limits":{"cpu":"100m","memory":"2Gi"},"requests":{"cpu":"100m","memory":"2Gi"}},"env":[{"name":"FETCH_EXTRA_ARTIFACTS","value":"$(params.FETCH_EXTRA_ARTIFACTS)"},{"name":"EXTRA_ARTIFACT_FILTER","value":"$(params.EXTRA_ARTIFACT_FILTER)"},{"name":"IMAGE_URL","value":"$(params.image-url)"},{"name":"IMAGE_DIGEST","value":"$(params.image-digest)"},{"name":"CA_FILE","value":"/etc/pki/tls/certs/ca-custom-bundle.crt"}],"image":"quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:d4155ab6553b406bd5ab96b98bb10ab97a38a6f9dcb7c39dd18678428e8b2e64","name":"fetch-extra-artifacts","script":"#!/usr/bin/env bash\nset -euo pipefail\n\nif [[ \"${FETCH_EXTRA_ARTIFACTS}\" != \"true\" ]]; then\n  exit 0\nfi\n\nif [[ -z \"${IMAGE_URL}\" || -z \"${IMAGE_DIGEST}\" ]]; then\n  echo \"INFO: image-url/image-digest missing, cannot fetch extra artifacts\"\n  exit 0\nfi\n\nSOURCE_ROOT=\"/var/workdir/source\"\nMANIFEST_FILE=\"/tmp/manifest.json\"\n\ndeclare -a oras_opts=()\n# shellcheck source=/dev/null\nsource /usr/local/bin/oras_opts.sh\n\nIMAGE_REF=\"${IMAGE_URL}@${IMAGE_DIGEST}\"\necho \"INFO: Fetching extra artifacts from OCI reference ${IMAGE_REF}\"\n\nauthfile=\"$(mktemp)\"\ncleanup_paths=(\"${authfile}\")\ncleanup() {\n  rm -rf \"${cleanup_paths[@]}\"\n}\ntrap cleanup EXIT\n/usr/local/bin/select-oci-auth.sh \"${IMAGE_URL}\" \u003e\"${authfile}\"\n\n# shellcheck disable=SC2086 # empty-array expansion under set -u\nretry oras manifest fetch ${oras_opts[@]+\"${oras_opts[@]}\"} --registry-config \"${authfile}\" \"${IMAGE_REF}\" \u003e\"${MANIFEST_FILE}\"\n\n# Multi-arch index (e.g. modelcar build-image-index) → one platform manifest.\nmedia_type=\"$(jq -r '.mediaType // \"\"' \"${MANIFEST_FILE}\")\"\nif [[ \"${media_type}\" == \"application/vnd.oci.image.index.v1+json\" ]] ||\n  [[ \"${media_type}\" == \"application/vnd.docker.distribution.manifest.list.v2+json\" ]]; then\n  child_digest=\"$(jq -r '\n    (.manifests // []) as $m\n    | ($m | map(select(.platform.architecture == \"amd64\" and ((.platform.os // \"linux\") == \"linux\"))) | .[0].digest)\n      // ($m | map(select((.platform.os // \"linux\") == \"linux\")) | .[0].digest)\n      // ($m[0].digest)\n      // empty\n  ' \"${MANIFEST_FILE}\")\"\n  if [[ -z \"${child_digest}\" || \"${child_digest}\" == \"null\" ]]; then\n    echo \"ERROR: image index has no manifests to resolve\"\n    exit 1\n  fi\n  echo \"INFO: Resolving image index to ${child_digest}\"\n  # shellcheck disable=SC2086 # empty-array expansion under set -u\n  retry oras manifest fetch ${oras_opts[@]+\"${oras_opts[@]}\"} --registry-config \"${authfile}\" \"${IMAGE_URL}@${child_digest}\" \u003e\"${MANIFEST_FILE}\"\nfi\n\nconfig_media_type=\"$(jq -r '.config.mediaType // \"\"' \"${MANIFEST_FILE}\")\"\nis_container_image=false\nif [[ \"${config_media_type}\" == \"application/vnd.oci.image.config.v1+json\" ]] ||\n  [[ \"${config_media_type}\" == \"application/vnd.docker.container.image.v1+json\" ]]; then\n  is_container_image=true\n  echo \"INFO: Reference is a container image (${config_media_type}); extracting titled layers matching EXTRA_ARTIFACT_FILTER\"\nfi\n\nmkdir -p \"${SOURCE_ROOT}\"\nfetched_count=0\n\npath_allowed() {\n  local rel_path=\"$1\"\n  local resolved_dest\n  resolved_dest=\"$(realpath -m \"${SOURCE_ROOT}/${rel_path}\")\"\n  if [[ ! \"${resolved_dest}\" == \"${SOURCE_ROOT}\"/* ]]; then\n    echo \"WARN: Skipping path outside source root: ${rel_path}\"\n    return 1\n  fi\n  printf '%s\\n' \"${resolved_dest}\"\n}\n\nif [[ \"${is_container_image}\" == \"true\" ]]; then\n  # ModelCar/olot (and similar) store one file per titled tar layer. Fetch only\n  # matching layers — skip base-image layers (no title) and huge weight blobs.\n  while IFS=$'\\t' read -r digest media_type title inlayer_path; do\n    [[ -n \"${title}\" ]] || continue\n    match_path=\"${inlayer_path:-${title}}\"\n    match_path=\"${match_path#/}\"\n    if ! printf '%s\\n' \"${match_path}\" | grep -Eq \"${EXTRA_ARTIFACT_FILTER}\" \u0026\u0026\n      ! printf '%s\\n' \"${title}\" | grep -Eq \"${EXTRA_ARTIFACT_FILTER}\"; then\n      continue\n    fi\n\n    tmp_blob=\"$(mktemp)\"\n    tmp_dir=\"$(mktemp -d)\"\n    cleanup_paths+=(\"${tmp_blob}\" \"${tmp_dir}\")\n    echo \"INFO: Fetching layer ${digest} (${title}) for extraction\"\n    # shellcheck disable=SC2086 # empty-array expansion under set -u\n    retry oras blob fetch ${oras_opts[@]+\"${oras_opts[@]}\"} --registry-config \"${authfile}\" \"${IMAGE_URL}@${digest}\" --output \"${tmp_blob}\"\n\n    # olot model files are uncompressed tar; modelcard layers are tar+gzip.\n    if [[ \"${media_type}\" == *gzip* ]] || [[ \"${media_type}\" == *tar+gzip* ]]; then\n      tar -xzf \"${tmp_blob}\" -C \"${tmp_dir}\"\n    else\n      tar -xf \"${tmp_blob}\" -C \"${tmp_dir}\"\n    fi\n\n    while IFS= read -r -d '' extracted; do\n      rel_path=\"${extracted#\"${tmp_dir}\"/}\"\n      rel_path=\"${rel_path#./}\"\n      [[ -n \"${rel_path}\" ]] || continue\n      if ! dest_path=\"$(path_allowed \"${rel_path}\")\"; then\n        continue\n      fi\n      mkdir -p \"$(dirname \"${dest_path}\")\"\n      cp -a \"${extracted}\" \"${dest_path}\"\n      echo \"INFO: Extracted ${rel_path}\"\n      fetched_count=$((fetched_count + 1))\n    done \u003c \u003c(find \"${tmp_dir}\" -type f -print0)\n\n    rm -rf \"${tmp_blob}\" \"${tmp_dir}\"\n  done \u003c \u003c(jq -r '\n    (.layers // [])[]\n    | [\n        .digest,\n        (.mediaType // \"\"),\n        (.annotations[\"org.opencontainers.image.title\"] // \"\"),\n        (.annotations[\"olot.layer.content.inlayerpath\"] // \"\")\n      ]\n    | @tsv\n  ' \"${MANIFEST_FILE}\")\nelse\n  while IFS=$'\\t' read -r digest rel_path; do\n    [[ -n \"${rel_path}\" ]] || continue\n    if ! printf '%s\\n' \"${rel_path}\" | grep -Eq \"${EXTRA_ARTIFACT_FILTER}\"; then\n      continue\n    fi\n\n    if ! dest_path=\"$(path_allowed \"${rel_path}\")\"; then\n      continue\n    fi\n\n    mkdir -p \"$(dirname \"${dest_path}\")\"\n    echo \"INFO: Fetching blob ${digest} -\u003e ${rel_path}\"\n    # shellcheck disable=SC2086 # empty-array expansion under set -u\n    retry oras blob fetch ${oras_opts[@]+\"${oras_opts[@]}\"} --registry-config \"${authfile}\" \"${IMAGE_URL}@${digest}\" --output \"${dest_path}\"\n    fetched_count=$((fetched_count + 1))\n  done \u003c \u003c(jq -r '(.layers // [])[] | [.digest, (.annotations[\"org.opencontainers.image.title\"] // \"\")] | @tsv' \"${MANIFEST_FILE}\")\nfi\n\nif [[ \"${fetched_count}\" -eq 0 ]]; then\n  echo \"INFO: No files matched EXTRA_ARTIFACT_FILTER\"\nelse\n  echo \"INFO: Fetched ${fetched_count} extra artifact file(s) alongside SOURCE_ARTIFACT\"\nfi\n","volumeMounts":[{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"}],"workingDir":"/var/workdir"},{"computeResources":{"limits":{"cpu":"1","memory":"6Gi"},"requests":{"cpu":"1","memory":"6Gi"}},"env":[{"name":"SNYK_SECRET","value":"$(params.SNYK_SECRET)"},{"name":"ARGS","value":"$(params.ARGS)"},{"name":"IGNORE_FILE_PATHS","value":"$(params.IGNORE_FILE_PATHS)"},{"name":"IMP_FINDINGS_ONLY","value":"$(params.IMP_FINDINGS_ONLY)"},{"name":"KFP_GIT_URL","value":"$(params.KFP_GIT_URL)"},{"name":"PROJECT_NAME","value":"$(params.PROJECT_NAME)"},{"name":"RECORD_EXCLUDED","value":"$(params.RECORD_EXCLUDED)"},{"name":"COMPONENT_LABEL","valueFrom":{"fieldRef":{"fieldPath":"metadata.labels['appstudio.openshift.io/component']"}}},{"name":"BUILD_PLR_LOG_URL","valueFrom":{"fieldRef":{"fieldPath":"metadata.annotations['pipelinesascode.tekton.dev/log-url']"}}},{"name":"TARGET_DIRS","value":"$(params.TARGET_DIRS)"}],"image":"quay.io/konflux-ci/konflux-test:v1.5.8@sha256:ce93e7ff1618deda40a66d90289d8fee1bf1ac151c06f1defd33d2a56dbd2b94","name":"sast-snyk-check","script":"#!/usr/bin/env bash\n\nset -euo pipefail\n# shellcheck source=/dev/null\n. /utils.sh\ntrap 'handle_error $(results.TEST_OUTPUT.path)' EXIT\n\nif [[ -z \"${PROJECT_NAME}\" ]]; then\n  PROJECT_NAME=${COMPONENT_LABEL}\nfi\n\necho \"INFO: The PROJECT_NAME used is: ${PROJECT_NAME}\"\n\nif [[ \"${ARGS}\" != *\"--project-name\"* ]]; then\n  ARGS=\"$ARGS --project-name=${PROJECT_NAME}\"\nfi\n\n# Installation of Red Hat certificates for cloning Red Hat internal repositories\nca_bundle=/mnt/trusted-ca/ca-bundle.crt\nif [ -f \"$ca_bundle\" ]; then\n  echo \"INFO: Using mounted CA bundle: $ca_bundle\"\n  cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors\n  update-ca-trust\nfi\n\nSNYK_TOKEN_PATH=\"/etc/secrets/snyk_token\"\nif [ -f \"${SNYK_TOKEN_PATH}\" ] \u0026\u0026 [ -s \"${SNYK_TOKEN_PATH}\" ]; then\n  # SNYK token is provided\n  SNYK_TOKEN=\"$(cat ${SNYK_TOKEN_PATH})\"\n  export SNYK_TOKEN\nelse\n  # According to shellcheck documentation, the following error can be ignored as it is ignored through indirection: https://www.shellcheck.net/wiki/SC2034\n  # shellcheck disable=SC2034\n  to_enable_snyk='[here](https://konflux-ci.dev/docs/testing/build/snyk/)'\n  note=\"Task $(context.task.name) skipped: If you wish to use the Snyk code SAST task, please create a secret name snyk-secret with the key 'snyk_token' containing the Snyk token by following the steps given ${to_enable_snyk}\"\n  TEST_OUTPUT=$(make_result_json -r SKIPPED -t \"$note\")\n  echo \"${TEST_OUTPUT}\" | tee \"$(results.TEST_OUTPUT.path)\"\n  exit 0\nfi\n\n# Wrapper around snyk code test that maps valid non-zero exit codes (1, 3)\n# to 0 so the existing retry function only retries on exit code 2 (error).\n# Exit codes: 0 = success, 1 = vulnerabilities found, 2 = error, 3 = no supported files\n# The real exit code is always preserved in SNYK_EXIT_CODE.\n# Error codes (2+) always override, valid codes (0, 1, 3) only if no previous error.\n_snyk_code_test() {\n  snyk code test \"$@\" 1\u003e\u00262 \u003e\u003e\"${WORK_DIR}/stdout.txt\"\n  local ec=$?\n  if [[ \"$ec\" -ne 0 ]] \u0026\u0026 [[ \"$ec\" -ne 1 ]] \u0026\u0026 [[ \"$ec\" -ne 3 ]]; then\n    SNYK_EXIT_CODE=$ec\n  fi\n  if [[ \"$ec\" -eq 1 ]] || [[ \"$ec\" -eq 3 ]]; then\n    return 0\n  fi\n  return \"$ec\"\n}\n\n_empty_sarif() {\n  local snyk_ver\n  snyk_ver=$(snyk --version 2\u003e/dev/null | head -1 | tr -d '\\n' || echo \"unknown\")\n  jq -n --arg version \"$snyk_ver\" '{\n    \"$schema\": \"https://json.schemastore.org/sarif-2.1.0.json\",\n    \"version\": \"2.1.0\",\n    \"runs\": [{\n      \"tool\": {\n        \"driver\": {\n          \"name\": \"snyk\",\n          \"version\": $version,\n          \"informationUri\": \"https://snyk.io\"\n        }\n      },\n      \"results\": [],\n      \"properties\": {\n        \"coverage\": []\n      }\n    }]\n  }'\n}\n\nSNYK_EXIT_CODE=0\nWORK_DIR=\"$(pwd)\"\nSOURCE_CODE_DIR=/var/workdir/source\n\n# We ignore files using snyk ignore if the user set up the IGNORE_FILE_PATHS variable.\n(cd \"${SOURCE_CODE_DIR}\" \u0026\u0026 IFS=\",\" \u0026\u0026 for path in $IGNORE_FILE_PATHS; do\n  snyk ignore --file-path=\"${path}\"\ndone)\n\nset +e\necho \"INFO: Running 'snyk code test'..\"\n# We do want to expand ARGS (it can be multiple CLI flags, not just one)\n# shellcheck disable=SC2086\n\n# Generate full paths for each directory in TARGET_DIRS\nIFS=\",\" read -ra TARGETS_ARRAY \u003c\u003c\u003c\"$TARGET_DIRS\"\nfor d in \"${TARGETS_ARRAY[@]}\"; do\n  potential_path=\"${SOURCE_CODE_DIR}/${d}\"\n  resolved_path=$(realpath -m \"$potential_path\")\n\n  # Ensure resolved path is still within SOURCE_CODE_DIR\n  if [[ ! \"$resolved_path\" == \"$SOURCE_CODE_DIR\"* ]]; then\n    echo \"Error: path traversal attempt, '$potential_path' is outside '$SOURCE_CODE_DIR'\"\n    exit 1\n  fi\n\n  # Ensure directory exists\n  if [ ! -d \"$resolved_path\" ]; then\n    echo \"Warning: Directory $resolved_path does not exist, skipping\"\n    continue\n  fi\n\n  echo \"INFO: Scanning directory: $resolved_path\"\n  # We do want to expand ARGS (it can be multiple CLI flags, not just one)\n  # shellcheck disable=SC2086\n  RETRY_INTERVAL=30 retry _snyk_code_test $ARGS \"$resolved_path\" --max-depth=1 --sarif-file-output=\"${resolved_path}/sast_snyk_check_out_${d//\\//_}.json\"\n\n  sarif_out=\"${resolved_path}/sast_snyk_check_out_${d//\\//_}.json\"\n  if [[ \"$d\" != \".\" \u0026\u0026 -f \"$sarif_out\" ]]; then\n    prefix=\"${d%/}/\"\n    echo \"INFO: Prepending path prefix '${prefix}' to ${sarif_out}\"\n    csgrep --mode=sarif --prepend-path-prefix=\"$prefix\" \"$sarif_out\" \u003e\"${sarif_out}.tmp\" \u0026\u0026 mv \"${sarif_out}.tmp\" \"$sarif_out\"\n  fi\n\ndone\n\n# Merge all per-target SARIF outputs into a single valid SARIF file\nshopt -s globstar nullglob\ncd \"${SOURCE_CODE_DIR}\" || exit 1\nsarif_files=(./**/sast_snyk_check_out_*.json)\nif [[ ${#sarif_files[@]} -gt 0 ]]; then\n  csgrep --mode=sarif \"${sarif_files[@]}\" \u003e\"${SOURCE_CODE_DIR}/sast_snyk_check_out.json\" 2\u003e\"${WORK_DIR}/csgrep_merge.err\" || {\n    echo \"WARN: Failed to merge SARIF files with csgrep, creating empty SARIF\"\n    cat \"${WORK_DIR}/csgrep_merge.err\" \u003e\u00262\n    _empty_sarif \u003e\"${SOURCE_CODE_DIR}/sast_snyk_check_out.json\"\n  }\nelse\n  echo \"WARN: No SARIF output files found, creating empty SARIF\"\n  _empty_sarif \u003e\"${SOURCE_CODE_DIR}/sast_snyk_check_out.json\"\nfi\nshopt -u globstar nullglob\ncd \"${WORK_DIR}\" || exit 1\nset -e\ntest_not_skipped=0\nSKIP_MSG=\"We found 0 supported files\"\ngrep -q \"$SKIP_MSG\" \"${WORK_DIR}/stdout.txt\" || test_not_skipped=$?\n\nif [[ \"$SNYK_EXIT_CODE\" -eq 0 ]] || [[ \"$SNYK_EXIT_CODE\" -eq 1 ]]; then\n  # Check if the merged SARIF file has content - this could happen if the snyk scan found no findings\n  if [ ! -s \"${SOURCE_CODE_DIR}/sast_snyk_check_out.json\" ]; then\n    echo \"WARN: No JSON output files were generated by snyk scan\"\n    _empty_sarif \u003e\"${SOURCE_CODE_DIR}/sast_snyk_check_out.json\"\n  fi\n\n  # In order to generate csdiff/v1, we need to add the whole path of the source code as Snyk only provides an URI to embed the context\n  (cd \"${SOURCE_CODE_DIR}\" \u0026\u0026 csgrep --mode=json --embed-context=3 \"${SOURCE_CODE_DIR}\"/sast_snyk_check_out.json) \\\n    \u003esast_snyk_check_out_all_findings.json\n\n  echo \"INFO: Initial results:\"\n  csgrep --mode=evtstat sast_snyk_check_out_all_findings.json\n  csgrep sast_snyk_check_out_all_findings.json\n\n  if [[ \"${KFP_GIT_URL}\" == \"SITE_DEFAULT\" ]]; then\n    KFP_GIT_URL=\"https://gitlab.cee.redhat.com/osh/known-false-positives.git\"\n  fi\n  PROBE_URL=\"${KFP_GIT_URL%.git}\" # trims '.git' suffix\n\n  # create the KFP clone directory regardless\n  KFP_DIR=\"known-false-positives\"\n  KFP_CLONED=\"0\"\n  mkdir -p \"${KFP_DIR}\"\n\n  # We check if the KFP_GIT_URL variable is set to clone and apply the filters or not\n  if [[ -n \"${KFP_GIT_URL}\" ]]; then\n    # Default location only reachable from internal Konflux instances, check reachable first\n    echo -n \"INFO: Probing ${PROBE_URL}... \"\n    if curl --fail --head --max-time 60 --no-progress-meter \"${PROBE_URL}\" \u003e \u003e(head -1); then\n      echo \"INFO: Trying to clone known-false-positives..\"\n      git clone \"${KFP_GIT_URL}\" \"${KFP_DIR}\" \u0026\u0026 KFP_CLONED=\"1\"\n    fi\n  fi\n\n  if [[ \"${KFP_CLONED}\" -eq \"0\" ]]; then\n    echo \"WARN: Failed to clone known-false-positives at ${KFP_GIT_URL}, scan results will not be filtered\"\n    mv sast_snyk_check_out_all_findings.json filtered_sast_snyk_check_out.json\n  else\n    echo \"INFO: Filtering false positives in results files using csfilter-kfp...\"\n\n    CMD=(\n      csfilter-kfp\n      --verbose\n      --kfp-dir=\"${KFP_DIR}\"\n      --project-nvr=\"${PROJECT_NAME}\"\n    )\n\n    if [ \"${RECORD_EXCLUDED}\" == \"true\" ]; then\n      CMD+=(--record-excluded=\"excluded-findings.json\")\n    fi\n\n    set +e\n    \"${CMD[@]}\" sast_snyk_check_out_all_findings.json \u003efiltered_sast_snyk_check_out.json\n    status=$?\n    set -e\n    if [ \"$status\" -ne 0 ]; then\n      echo \"WARN: failed to filter known false positives\" \u003e\u00262\n    else\n      echo \"INFO: Succeeded filtering known false positives\" \u003e\u00262\n    fi\n    echo \"INFO: Results after filtering:\"\n    (set -x \u0026\u0026 csgrep --mode=evtstat filtered_sast_snyk_check_out.json)\n    csgrep filtered_sast_snyk_check_out.json\n  fi\n\n  # Generation of scan stats\n\n  total_files=$(jq '[(.runs[0].properties.coverage // [])[].files] | add' \"${SOURCE_CODE_DIR}\"/sast_snyk_check_out.json)\n  supported_files=$(jq '[(.runs[0].properties.coverage // [])[] | select(.type == \"SUPPORTED\") | .files] | add' \"${SOURCE_CODE_DIR}\"/sast_snyk_check_out.json)\n\n  # We make sure the values are 0 if no supported/total files are found\n  if [ \"$total_files\" = \"null\" ] || [ -z \"$total_files\" ]; then\n    total_files=0\n  fi\n\n  if [ \"$supported_files\" = \"null\" ] || [ -z \"$supported_files\" ]; then\n    supported_files=0\n  fi\n\n  coverage_ratio=0\n  if ((total_files \u003e 0)); then\n    coverage_ratio=$((supported_files * 100 / total_files))\n  fi\n\n  # embed stats in results file and convert to SARIF\n  csgrep --mode=sarif --set-scan-prop snyk-scanned-files-coverage:\"${coverage_ratio}\" \\\n    --set-scan-prop snyk-scanned-files-success:\"${supported_files}\" \\\n    --set-scan-prop snyk-scanned-files-total:\"${total_files}\" \\\n    filtered_sast_snyk_check_out.json \u003esast_snyk_check_out.sarif\n\n  # Create filtered SARIF for Tekton task result based on IMP_FINDINGS_ONLY parameter\n  if [ \"${IMP_FINDINGS_ONLY}\" == \"true\" ]; then\n    # Filter to only \"error\" level or higher (high/critical severity) for Tekton task result\n    # In SARIF, defects are given a level like \"error\" or \"warning\". Snyk maps \"high\" level findings to \"error\".\n    # - \"error\" → importance level 1\n    # - \"warning\" (or missing level) → importance level 0\n    RESULT_SARIF=\"result_sast_snyk_check_out.sarif\"\n    csgrep --mode=sarif --imp-level 1 sast_snyk_check_out.sarif \u003e\"$RESULT_SARIF\"\n  else\n    # Use all findings for Tekton task result\n    RESULT_SARIF=\"sast_snyk_check_out.sarif\"\n  fi\n\n  TEST_OUTPUT=\n  parse_test_output \"$(context.task.name)\" sarif \"$RESULT_SARIF\" || true\n\n# When the test is skipped, the \"SNYK_EXIT_CODE\" is 3 and it can also be 3 in some other situation\nelif [[ \"$test_not_skipped\" -eq 0 ]]; then\n  note=\"Task $(context.task.name) success: Snyk code test found zero supported files.\"\n  ERROR_OUTPUT=$(make_result_json -r SUCCESS -t \"$note\")\nelse\n  echo \"sast-snyk-check test failed because of the following issues:\"\n  cat \"${WORK_DIR}/stdout.txt\"\n  note=\"Task $(context.task.name) failed: For details, check Tekton task log.\"\n  ERROR_OUTPUT=$(make_result_json -r ERROR -t \"$note\")\nfi\necho \"${TEST_OUTPUT:-${ERROR_OUTPUT}}\" | tee \"$(results.TEST_OUTPUT.path)\"\n","volumeMounts":[{"mountPath":"/etc/secrets","name":"snyk-secret","readOnly":true},{"mountPath":"/mnt/trusted-ca","name":"trusted-ca","readOnly":true}],"workingDir":"/var/workdir/source"},{"computeResources":{"limits":{"cpu":"100m","memory":"256Mi"},"requests":{"cpu":"100m","memory":"256Mi"}},"env":[{"name":"IMAGE_URL","value":"$(params.image-url)"},{"name":"IMAGE_DIGEST","value":"$(params.image-digest)"}],"image":"quay.io/konflux-ci/oras:latest@sha256:1cc659b4d30536ec98300ac551739ef36dee345a7dcfe06129fd78abdc3688ac","name":"upload","script":"#!/usr/bin/env bash\n\nif [ -z \"${IMAGE_URL}\" ]; then\n  echo 'No image-url provided. Skipping upload.'\n  exit 0\nfi\n\nUPLOAD_FILES=\"sast_snyk_check_out.sarif excluded-findings.json\"\nfor UPLOAD_FILE in ${UPLOAD_FILES}; do\n  i