{"apiVersion":"tekton.dev/v1","kind":"Task","metadata":{"labels":{"app.kubernetes.io/version":"0.2.2"},"name":"rpms-signature-scan"},"spec":{"description":"Scans RPMs in an image and provide information about RPMs signatures.","params":[{"description":"Image URL","name":"image-url","type":"string"},{"description":"Image digest to scan","name":"image-digest","type":"string"},{"default":"/tmp","description":"Directory that will be used for storing temporary\nfiles produced by this task.\n","name":"workdir","type":"string"},{"default":"trusted-ca","description":"The name of the ConfigMap to read CA bundle data from.","name":"ca-trust-config-map-name","type":"string"},{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the CA bundle data.","name":"ca-trust-config-map-key","type":"string"}],"results":[{"description":"Tekton task test output.","name":"TEST_OUTPUT"},{"description":"Information about signed and unsigned RPMs","name":"RPMS_DATA"},{"description":"Images processed in the task.","name":"IMAGES_PROCESSED"},{"description":"Diagnostic log from the RPM scan (e.g. selective extraction info).","name":"SCAN_LOG"}],"steps":[{"computeResources":{"limits":{"cpu":"200m","memory":"256Mi"},"requests":{"cpu":"200m","memory":"256Mi"}},"env":[{"name":"IMAGE_URL","value":"$(params.image-url)"},{"name":"IMAGE_DIGEST","value":"$(params.image-digest)"},{"name":"WORKDIR","value":"$(params.workdir)"}],"image":"quay.io/konflux-ci/tools@sha256:8f8733cf24d0bf29833cdbece8b7c65bce22d5ea221e2316bfb84e266e1575df","name":"rpms-signature-scan","script":"#!/bin/bash\nset -ex\nset -o pipefail\n\nrpm_verifier \\\n  --image-url \"${IMAGE_URL}\" \\\n  --image-digest \"${IMAGE_DIGEST}\" \\\n  --workdir \"${WORKDIR}\" \\\n  2\u003e \u003e(tee \"${WORKDIR}/stderr\" \u003e\u00262)\n","volumeMounts":[{"mountPath":"$(params.workdir)","name":"workdir"},{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"}]},{"computeResources":{"limits":{"cpu":"50m","memory":"32Mi"},"requests":{"cpu":"50m","memory":"32Mi"}},"env":[{"name":"WORKDIR","value":"$(params.workdir)"}],"image":"quay.io/konflux-ci/konflux-test:v1.5.9@sha256:7faaebc542c61704003fecbab81a9c81c9770b4df8c5bba18459fba3f58e9c51","name":"output-results","script":"#!/bin/bash\nset -ex\n\nsource /utils.sh\nstatus=$(cat \"${WORKDIR}\"/status)\nrpms_data=$(cat \"${WORKDIR}\"/results)\nimages_processed=$(cat \"${WORKDIR}\"/images_processed)\n\nif [ \"$status\" == \"ERROR\" ]; then\n  note=\"Task $(context.task.name) failed to scan images. Refer to Tekton task output for details\"\nelse\n  note=\"Task $(context.task.name) completed successfully\"\nfi\n\nTEST_OUTPUT=$(make_result_json -r \"$status\" -t \"$note\")\n\necho \"${TEST_OUTPUT}\" | tee \"$(results.TEST_OUTPUT.path)\"\necho \"${rpms_data}\" | tee \"$(results.RPMS_DATA.path)\"\necho \"${images_processed}\" | tee \"$(results.IMAGES_PROCESSED.path)\"\n\nif [ -f \"${WORKDIR}/stderr\" ]; then\n  head -c 4000 \"${WORKDIR}/stderr\" | tee \"$(results.SCAN_LOG.path)\"\nelse\n  echo \"\" \u003e \"$(results.SCAN_LOG.path)\"\nfi\n","volumeMounts":[{"mountPath":"$(params.workdir)","name":"workdir"}]}],"volumes":[{"emptyDir":{},"name":"workdir"},{"configMap":{"items":[{"key":"$(params.ca-trust-config-map-key)","path":"ca-bundle.crt"}],"name":"$(params.ca-trust-config-map-name)","optional":true},"name":"trusted-ca"}]}}