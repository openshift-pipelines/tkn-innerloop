{"apiVersion":"tekton.dev/v1","kind":"Task","metadata":{"annotations":{"tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/tags":"konflux"},"labels":{"app.kubernetes.io/version":"0.1.1"},"name":"sast-shell-check-oci-ta"},"spec":{"description":"The sast-shell-check task uses [shellcheck](https://www.shellcheck.net/) tool to perform Static Application Security Testing (SAST), a popular cloud-native application security platform. This task leverages the shellcheck wrapper (csmock-plugin-shellcheck-core) to run shellcheck on a directory tree.\nShellCheck is a static analysis tool, gives warnings and suggestions for bash/sh shell scripts. This task can run on x86 and arm.","params":[{"default":"true","description":"Whether to include important findings only","name":"IMP_FINDINGS_ONLY","type":"string"},{"default":"SITE_DEFAULT","description":"Known False Positives (KFP) git URL (optionally taking a revision delimited by \\#). Defaults to \"SITE_DEFAULT\", which means the default value \"https://gitlab.cee.redhat.com/osh/known-false-positives.git\" for internal Konflux instance and empty string for external Konflux instance. If set to an empty string, the KFP filtering is disabled.","name":"KFP_GIT_URL","type":"string"},{"default":"","description":"Name of the scanned project, used to find path exclusions. By default, the Konflux component name will be used.","name":"PROJECT_NAME","type":"string"},{"default":"false","description":"Whether to record the excluded findings (default to false).\nIf `true`, the excluded findings will be stored in `excluded-findings.json`.\n","name":"RECORD_EXCLUDED","type":"string"},{"default":"true","description":"Whether to skip files containing Jinja2 template syntax ({{ }}, {% %}, {# #}). ShellCheck cannot parse Jinja2 constructs, so scanning such files produces unreliable findings.","name":"SKIP_JINJA","type":"string"},{"description":"The Trusted Artifact URI pointing to the artifact with the application source code.","name":"SOURCE_ARTIFACT","type":"string"},{"default":".","description":"Target directories in component's source code. Multiple values should be separated with commas.","name":"TARGET_DIRS","type":"string"},{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the CA bundle data.","name":"caTrustConfigMapKey","type":"string"},{"default":"trusted-ca","description":"The name of the ConfigMap to read CA bundle data from.","name":"caTrustConfigMapName","type":"string"},{"default":"","description":"Image digest to report findings for.","name":"image-digest","type":"string"},{"default":"","description":"Image URL.","name":"image-url","type":"string"}],"results":[{"description":"Tekton task test output.","name":"TEST_OUTPUT"}],"stepTemplate":{"volumeMounts":[{"mountPath":"/var/workdir","name":"workdir"}]},"steps":[{"args":["use","$(params.SOURCE_ARTIFACT)=/var/workdir/source"],"computeResources":{"limits":{"memory":"4Gi"},"requests":{"cpu":"50m","memory":"4Gi"}},"image":"quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:d4155ab6553b406bd5ab96b98bb10ab97a38a6f9dcb7c39dd18678428e8b2e64","name":"use-trusted-artifact","volumeMounts":[{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"}]},{"computeResources":{"limits":{"memory":"6Gi"},"requests":{"cpu":"850m","memory":"6Gi"}},"env":[{"name":"KFP_GIT_URL","value":"$(params.KFP_GIT_URL)"},{"name":"PROJECT_NAME","value":"$(params.PROJECT_NAME)"},{"name":"RECORD_EXCLUDED","value":"$(params.RECORD_EXCLUDED)"},{"name":"IMP_FINDINGS_ONLY","value":"$(params.IMP_FINDINGS_ONLY)"},{"name":"TARGET_DIRS","value":"$(params.TARGET_DIRS)"},{"name":"SKIP_JINJA","value":"$(params.SKIP_JINJA)"},{"name":"COMPONENT_LABEL","valueFrom":{"fieldRef":{"fieldPath":"metadata.labels['appstudio.openshift.io/component']"}}},{"name":"BUILD_PLR_LOG_URL","valueFrom":{"fieldRef":{"fieldPath":"metadata.annotations['pipelinesascode.tekton.dev/log-url']"}}}],"image":"quay.io/konflux-ci/konflux-test:v1.5.8@sha256:ce93e7ff1618deda40a66d90289d8fee1bf1ac151c06f1defd33d2a56dbd2b94","name":"sast-shell-check","script":"#!/usr/bin/env bash\nset -x\n# shellcheck source=/dev/null\nsource /utils.sh\ntrap 'handle_error $(results.TEST_OUTPUT.path)' EXIT\n\nif [[ -z \"${PROJECT_NAME}\" ]]; then\n  PROJECT_NAME=${COMPONENT_LABEL}\nfi\n\necho \"INFO: The PROJECT_NAME used is: ${PROJECT_NAME}\"\n\nca_bundle=/mnt/trusted-ca/ca-bundle.crt\nif [ -f \"$ca_bundle\" ]; then\n  echo \"INFO: Using mounted CA bundle: $ca_bundle\"\n  cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors\n  update-ca-trust\nfi\n\nPACKAGE_VERSION=$(rpm -q --queryformat '%{NAME}-%{VERSION}-%{RELEASE}\\n' ShellCheck)\n\nOUTPUT_FILE=\"shellcheck-results.json\"\nSOURCE_CODE_DIR=/var/workdir/source\n\n# generate full path for each dirname separated by comma\ndeclare -a ALL_TARGETS\nIFS=\",\" read -ra TARGET_ARRAY \u003c\u003c\u003c\"$TARGET_DIRS\"\nfor d in \"${TARGET_ARRAY[@]}\"; do\n  potential_path=\"${SOURCE_CODE_DIR}/${d}\"\n\n  resolved_path=$(realpath -m \"$potential_path\")\n\n  # ensure resolved path is still within SOURCE_CODE_DIR\n  if [[ \"$resolved_path\" == \"$SOURCE_CODE_DIR\"* ]]; then\n    ALL_TARGETS+=(\"$resolved_path\")\n  else\n    echo \"Error: path traversal attempt, '$potential_path' is outside '$SOURCE_CODE_DIR'\"\n    exit 1\n  fi\ndone\n\n# Cap ShellCheck parallelism (PSSECAUT-1196). Prefer an explicit SC_JOBS, else\n# derive from a cgroup v2 CPU limit when present. With no limits.cpu (policy),\n# cgroup quota is \"max\" — default to 8 jobs to preserve prior parallelism from\n# limits.cpu: 8 (CPU request stays 850m; override SC_JOBS if needed).\nif [ -z \"$SC_JOBS\" ] \u0026\u0026 [ -r \"/sys/fs/cgroup/cpu.max\" ]; then\n  read -r quota period \u003c/sys/fs/cgroup/cpu.max\n  if [ \"$quota\" != \"max\" ] \u0026\u0026 [ -n \"$period\" ] \u0026\u0026 [ \"$period\" -gt 0 ]; then\n    export SC_JOBS=$(((quota + period - 1) / period))\n    echo \"INFO: Setting SC_JOBS=${SC_JOBS} based on cgroups v2 max for run-shellcheck.sh\"\n  fi\nfi\nif [ -z \"$SC_JOBS\" ]; then\n  export SC_JOBS=8\n  echo \"INFO: Setting SC_JOBS=${SC_JOBS} default (no cgroup CPU limit; override via SC_JOBS env if needed)\"\nfi\n\nif [[ \"${SKIP_JINJA}\" == \"true\" ]]; then\n  export SC_SKIP_JINJA=1\nfi\n\n# generate all shellcheck result JSON files to $SC_RESULTS_DIR, which defaults to ./shellcheck-results/\n/usr/share/csmock/scripts/run-shellcheck.sh \"${ALL_TARGETS[@]}\"\n\nCSGREP_OPTS=(\n  --mode=json\n  --strip-path-prefix=\"$SOURCE_CODE_DIR\"/\n  --remove-duplicates\n  --embed-context=3\n  --set-scan-prop=\"ShellCheck:${PACKAGE_VERSION}\"\n)\nif [[ \"$IMP_FINDINGS_ONLY\" == \"true\" ]]; then\n  # predefined list of shellcheck important findings\n  CSGREP_EVENT_FILTER='\\[SC(1020|1035|1054|1066|1068|1073|1080|1083|1099|1113|1115|1127|1128|1143|2043|2050|'\n  CSGREP_EVENT_FILTER+='2055|2057|2066|2069|2071|2077|2078|2091|2092|2157|2171|2193|2194|2195|2215|2216|'\n  CSGREP_EVENT_FILTER+='2218|2224|2225|2242|2256|2258|2261)\\]$'\n  CSGREP_OPTS+=(\n    --event=\"$CSGREP_EVENT_FILTER\"\n  )\nelse\n  CSGREP_OPTS+=(\n    --event=\"error|warning\"\n  )\nfi\n\nif ! csgrep \"${CSGREP_OPTS[@]}\" ./shellcheck-results/*.json \u003e\"$OUTPUT_FILE\"; then\n  echo \"Error occurred while running 'run-shellcheck.sh'\"\n  note=\"Task $(context.task.name) failed: For details, check Tekton task log.\"\n  ERROR_OUTPUT=$(make_result_json -r ERROR -t \"$note\")\n  echo \"${ERROR_OUTPUT}\" | tee \"$(results.TEST_OUTPUT.path)\"\n  exit 1\nfi\n\nif [[ \"${KFP_GIT_URL}\" == \"SITE_DEFAULT\" ]]; then\n  KFP_GIT_URL=\"https://gitlab.cee.redhat.com/osh/known-false-positives.git\"\nfi\nPROBE_URL=\"${KFP_GIT_URL%.git}\" # trims '.git' suffix\n\n# create the KFP clone directory regardless\nKFP_DIR=\"known-false-positives\"\nKFP_CLONED=\"0\"\nmkdir \"${KFP_DIR}\"\n\n# We check if the KFP_GIT_URL variable is set to clone and apply the filters or not\nif [[ -n \"${KFP_GIT_URL}\" ]]; then\n  # Default location only reachable from internal Konflux instances, check reachable first\n  echo -n \"INFO: Probing ${PROBE_URL}... \"\n  if curl --fail --head --max-time 60 --no-progress-meter \"${PROBE_URL}\" \u003e \u003e(head -1); then\n    echo \"INFO: Trying to clone known-false-positives..\"\n    git clone \"${KFP_GIT_URL}\" \"${KFP_DIR}\" \u0026\u0026 KFP_CLONED=\"1\"\n  fi\nfi\n\nif [[ \"${KFP_CLONED}\" -eq \"0\" ]]; then\n  echo \"WARN: Failed to clone known-false-positives at ${KFP_GIT_URL}, scan results will not be filtered\"\nelse\n  echo \"INFO: Filtering false positives in results files using csfilter-kfp...\"\n\n  # build initial csfilter-kfp command\n  csfilter_kfp_cmd=(\n    csfilter-kfp\n    --verbose\n    --kfp-dir=\"${KFP_DIR}\"\n    --project-nvr=\"${PROJECT_NAME}\"\n  )\n\n  if [[ \"${RECORD_EXCLUDED}\" == \"true\" ]]; then\n    csfilter_kfp_cmd+=(--record-excluded=\"excluded-findings.json\")\n  fi\n\n  # Execute the command and capture any errors\n  set +e\n  \"${csfilter_kfp_cmd[@]}\" \"${OUTPUT_FILE}\" \u003e\"${OUTPUT_FILE}.filtered\" 2\u003e\"${OUTPUT_FILE}.error\"\n  status=$?\n  set -e\n  if [ \"$status\" -ne 0 ]; then\n    echo \"WARN: failed to filter known false positives\" \u003e\u00262\n  else\n    mv \"${OUTPUT_FILE}.filtered\" \"$OUTPUT_FILE\"\n    echo \"INFO: Succeeded filtering known false positives\" \u003e\u00262\n  fi\nfi\n\necho \"ShellCheck results have been saved to $OUTPUT_FILE\"\n\ncsgrep --mode=evtstat \"$OUTPUT_FILE\"\ncsgrep \"$OUTPUT_FILE\"\ncsgrep --mode=sarif \"$OUTPUT_FILE\" \u003eshellcheck-results.sarif\n\nTEST_OUTPUT=\nparse_test_output \"$(context.task.name)\" sarif shellcheck-results.sarif || true\necho \"${TEST_OUTPUT}\" | tee \"$(results.TEST_OUTPUT.path)\"\n","volumeMounts":[{"mountPath":"/mnt/trusted-ca","name":"trusted-ca","readOnly":true}],"workingDir":"/var/workdir/source"},{"computeResources":{"limits":{"memory":"256Mi"},"requests":{"cpu":"100m","memory":"256Mi"}},"env":[{"name":"IMAGE_URL","value":"$(params.image-url)"},{"name":"IMAGE_DIGEST","value":"$(params.image-digest)"}],"image":"quay.io/konflux-ci/oras:latest@sha256:1cc659b4d30536ec98300ac551739ef36dee345a7dcfe06129fd78abdc3688ac","name":"upload","script":"#!/usr/bin/env bash\nset -e\n\nif [ -z \"${IMAGE_URL}\" ] || [ -z \"${IMAGE_DIGEST}\" ]; then\n  echo 'No image-url or image-digest param provided. Skipping upload.'\n  exit 0\nfi\n\nUPLOAD_FILES=\"shellcheck-results.sarif excluded-findings.json\"\n\nfor UPLOAD_FILE in ${UPLOAD_FILES}; do\n  if [ ! -f \"${UPLOAD_FILE}\" ]; then\n    echo \"No ${UPLOAD_FILE} exists. Skipping upload.\"\n    continue\n  fi\n\n  # Determine the media type based on the file extension\n  if [[ \"${UPLOAD_FILE}\" == *.json ]]; then\n    MEDIA_TYPE=\"application/json\"\n  else\n    MEDIA_TYPE=\"application/sarif+json\"\n  fi\n\n  echo \"Selecting auth\"\n  select-oci-auth \"$IMAGE_URL\" \u003e\"$HOME/auth.json\"\n  echo \"Attaching to ${IMAGE_URL}\"\n  if ! retry oras attach --no-tty --registry-config \"$HOME/auth.json\" --artifact-type \"${MEDIA_TYPE}\" \"${IMAGE_URL}@${IMAGE_DIGEST}\" \"${UPLOAD_FILE}:${MEDIA_TYPE}\"; then\n    echo \"Failed to attach ${UPLOAD_FILE} to ${IMAGE_URL}\"\n    exit 1\n  fi\ndone\n","volumeMounts":[{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"}],"workingDir":"/var/workdir/source"}],"volumes":[{"configMap":{"items":[{"key":"$(params.caTrustConfigMapKey)","path":"ca-bundle.crt"}],"name":"$(params.caTrustConfigMapName)","optional":true},"name":"trusted-ca"},{"emptyDir":{},"name":"workdir"}]}}