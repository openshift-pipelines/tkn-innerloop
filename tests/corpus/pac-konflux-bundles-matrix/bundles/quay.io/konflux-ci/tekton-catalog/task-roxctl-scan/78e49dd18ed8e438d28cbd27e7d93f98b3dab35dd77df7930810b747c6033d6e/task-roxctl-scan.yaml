es[] | \"\\(.key) \\(.value)\"' | while read -r arch arch_sha; do\n    echo \"$arch_sha\" \u003e /tekton/home/image-manifest-$arch.sha\n  done\nelse\n  echo \"Failed to get image manifests from image \\\"$imageanddigest\\\"\"\n  note=\"Task $(context.task.name) failed: Failed to get image manifests from image \\\"$imageanddigest\\\". For details, check Tekton task log.\"\n  ERROR_OUTPUT=$(make_result_json -r \"ERROR\" -t \"$note\")\n  echo \"${ERROR_OUTPUT}\" | tee \"$(results.TEST_OUTPUT.path)\"\n  exit 0\nfi\n","securityContext":{"capabilities":{"add":["SETFCAP"]}}},{"env":[{"name":"HOME","value":"/tekton/home"},{"name":"IMAGE","value":"$(params.image-url)"},{"name":"INSECURE","value":"$(params.insecure-skip-tls-verify)"},{"name":"OUTPUT","value":"$(params.output_format)"},{"name":"ROX_CONFIG_DIR","value":"$(params.rox_config_dir)"},{"name":"ROX_API_TOKEN_FILE","value":"$(params.rox_token_file)"},{"name":"ROX_ENDPOINT","value":"$(params.rox_central_endpoint)"},{"name":"ROX_EXECUTION_ENV","value":"Tekton"}],"image":"registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel9@sha256:98f01d623e119acbbc211bdeb36192b619969aa149d9c66bab8034eeef84c861","name":"rox-image-scan","script":"#!/usr/bin/env bash\nset -euo pipefail\n# shellcheck disable=SC2153 # IMAGE is a Tekton env variable, not a typo\n\nimagewithouttag=$(echo -n \"$IMAGE\" | sed \"s/\\(.*\\):.*/\\1/\")\n\nscan_image() {\n  local image=\"$1\"\n  local label=\"$2\"\n  local outfile=\"/tekton/home/rox-output-${label}.json\"\n\n  echo \"Scanning $label image: $image\"\n  if ! roxctl image scan --insecure-skip-tls-verify=\"$INSECURE\" --image=\"$image\" \u003e \"$outfile\"; then\n    rm -f /tekton/home/rox-output-*.json\n    echo \"roxctl image scan failed for $label image: $image\"\n    note=\"Task $(context.task.name) failed: Failed to scan image using Roxctl image: $image For details, check Tekton task log.\"\n    printf '{\"result\":\"ERROR\",\"timestamp\":\"0\",\"note\":\"%s\",\"namespace\":\"default\",\"successes\":0,\"failures\":0,\"warnings\":0}' \"$note\" | tee \"$(results.TEST_OUTPUT.path)\"\n    exit 0\n  fi\n\n  if [ ! -s \"$outfile\" ]; then\n    rm -f /tekton/home/rox-output-*.json\n    echo \"roxctl image scan produced empty output for $label image: $image\"\n    note=\"Task $(context.task.name) failed: Failed to scan image using Roxctl image: $image For details, check Tekton task log.\"\n    printf '{\"result\":\"ERROR\",\"timestamp\":\"0\",\"note\":\"%s\",\"namespace\":\"default\",\"successes\":0,\"failures\":0,\"warnings\":0}' \"$note\" | tee \"$(results.TEST_OUTPUT.path)\"\n    exit 0\n  fi\n}\n\nif compgen -G \"/tekton/home/image-manifest-*.sha\" \u003e /dev/null; then\n  for sha_file in /tekton/home/image-manifest-*.sha; do\n    arch_sha=$(cat \"$sha_file\")\n    arch=$(basename \"$sha_file\" | sed 's/image-manifest-//;s/.sha//')\n    scan_image \"$imagewithouttag@$arch_sha\" \"$arch\"\n  done\nelse\n  echo \"No per-arch manifest files found, scanning image directly.\"\n  scan_image \"$IMAGE\" \"image-index\"\nfi\n"},{"env":[{"name":"IMAGE_URL","value":"$(params.image-url)"},{"name":"IMAGE_DIGEST","value":"$(params.image-digest)"}],"image":"quay.io/konflux-ci/konflux-test:v1.5.10@sha256:2f9960d60c0e4aa0c2fba42b147736fab5bd11644577cff60ec4255a392be252","name":"proccess-output","script":"#!/usr/bin/env bash\n\nset -o errexit\nset -o nounset\nset -o pipefail\n# shellcheck source=/utils.sh\n. /utils.sh\n\n\nfor rox_file in /tekton/home/rox-output-*.json; do\n  if [ -e \"$rox_file\" ]; then\n    arch=$(basename \"$rox_file\" | sed 's/rox-output-//;s/.json//')\n    #STONEINTG-1878 quickfix, create more robust solution\n    sed -E -i 's/%!(.)\\(MISSING\\)/%\\1/g; s/%!\\(NOVERB\\)/%/g' \"$rox_file\"\n    jq -s -f /parse_to_cve_oriented_output.jq \"$rox_file\" | tee \"/tekton/home/pre-parsed-rox-output-${arch}.json\"\n    jq '{roxctl_new: .}' \"/tekton/home/pre-parsed-rox-output-${arch}.json\" \u003e \"/tekton/home/parsed-rox-output-${arch}.json\"\n    jq -f /parse_acs_to_rhsa.jq \"/tekton/home/pre-parsed-rox-output-${arch}.json\" \u003e\u003e \"/tekton/home/rhsas.json\" || true\n  fi\ndone\n\nimages_processed_template='{\"image\": {\"pullspec\": \"'\"$IMAGE_URL\"'\", \"digests\": [%s]}}'\ndigests_processed=()\n\nfor sha_file in image-manifest-*.sha; do\n  if [ -e \"$sha_file\" ]; then\n    arch_sha=$(cat \"$sha_file\")\n\n    digests_processed+=(\"\\\"$arch_sha\\\"\")\n  fi\ndone\n\n# If the image is an Image Index, also add the Image Index digest to the list.\nif [[ \"${digests_processed[*]}\" != *\"$IMAGE_DIGEST\"* ]]; then\n  digests_processed+=(\"\\\"$IMAGE_DIGEST\\\"\")\nfi\ndigests_processed_string=$(IFS=,; echo \"${digests_processed[*]}\")\n\nimages_processed=$(echo \"${images_processed_template/\\[%s]/[$digests_processed_string]}\")\necho \"$images_processed\" \u003e images-processed.json\ncat /tekton/home/images-processed.json | tee $(results.IMAGES_PROCESSED.path)\n","workingDir":"/tekton/home"},{"env":[{"name":"IMAGE_URL","value":"$(params.image-url)"},{"name":"SKIP_UPLOAD","value":"$(params.skip-upload)"}],"image":"quay.io/konflux-ci/task-runner:3.3.0@sha256:0428af436f6942544009e38ef452a6b747e9ec79ab22fd402a3d59585984cf81","name":"oci-attach-report","script":"#!/usr/bin/env bash\n\nset -o errexit\nset -o nounset\nset -o pipefail\n\nif [ \"$SKIP_UPLOAD\" == \"true\" ]; then\n  echo 'Upload skipped by parameter.'\n  # Create an empty reports.json so downstream steps don't fail, required for testing\n  echo \"{}\" \u003e reports.json\n  cat /tekton/home/reports.json \u003e \"$(results.REPORTS.path)\"\n  exit 0\nfi\n\nif ! compgen -G \"rox-output*.json\" \u003e /dev/null; then\n  echo 'No Rox reports generated. Skipping upload.'\n  echo \"{}\" \u003e reports.json\n  cat /tekton/home/reports.json \u003e \"$(results.REPORTS.path)\"\n  exit 0\nfi\n\necho \"Selecting auth\"\nselect-oci-auth \"$IMAGE_URL\" \u003e \"$HOME/auth.json\"\n\nrepository=\"${IMAGE_URL/:*/}\"\n\nMEDIA_TYPE='application/vnd.redhat.rox-report+json'\n\nreports_json=\"{}\"\nif ! compgen -G \"image-manifest-*.sha\" \u003e /dev/null; then\n  echo \"No image manifest files found. Skipping report attachment.\"\n  echo \"${reports_json}\" \u003e reports.json\n  cat /tekton/home/reports.json \u003e \"$(results.REPORTS.path)\"\n  exit 0\nfi\nfor f in image-manifest-*.sha; do\n  arch_name=$(basename \"$f\" | sed 's/image-manifest-//;s/.sha//')\n  digest=$(cat \"$f\")\n  report_file=\"parsed-rox-output-${arch_name}.json\"\n  if [ ! -f \"$report_file\" ]; then\n    echo \"Report file $report_file not found for arch $arch_name, skipping.\"\n    continue\n  fi\n  image_ref=\"${repository}@${digest}\"\n  mkdir -p /tmp/auth \u0026\u0026 select-oci-auth \"${image_ref}\" \u003e /tmp/auth/config.json\n  export DOCKER_CONFIG=/tmp/auth\n  echo \"Attaching $report_file to ${image_ref}\"\n  if ! report_digest=\"$(retry oras attach --no-tty --format go-template='{{.digest}}' --registry-config \\\n    \"/tmp/auth/config.json\" --artifact-type \"${MEDIA_TYPE}\" \"${image_ref}\" \"$report_file:${MEDIA_TYPE}\")\"\n  then\n    echo \"Failed to attach ${report_file} to ${image_ref}\"\n    exit 1\n  fi\n  # shellcheck disable=SC2016\n  reports_json=\"$(yq --output-format json --indent=0 eval-all '. as $i ireduce ({}; . * $i)' \u003c(echo \"${reports_json}\") \u003c(echo \"${digest}: ${report_digest}\"))\"\ndone\necho \"${reports_json}\" \u003e reports.json\ncat /tekton/home/reports.json \u003e \"$(results.REPORTS.path)\"\n","workingDir":"/tekton/home"},{"computeResources":{"limits":{"memory":"2Gi"},"requests":{"cpu":"100m","memory":"256Mi"}},"image":"quay.io/konflux-ci/konflux-test:v1.5.10@sha256:2f9960d60c0e4aa0c2fba42b147736fab5bd11644577cff60ec4255a392be252","name":"conftest-vulnerabilities","script":"#!/usr/bin/env bash\nset -euo pipefail\n. /utils.sh\ntrap 'handle_error $(results.TEST_OUTPUT.path)' EXIT\n\nrox_result_files=$(ls /tekton/home/parsed-rox-output*.json)\nif [ -z \"$rox_result_files\" ]; then\n  echo \"Previous step [get-vulnerabilities] failed: No rox-output files found in /tekton/home.\"\n  exit 1\nfi\n\nmissing_vulnerabilities_files=\"\"\nfor file in $rox_result_files; do\n  file_suffix=$(basename \"$file\" | sed 's/rox-result-//;s/.json//')\n  if [ ! -s \"$file\" ]; then\n    echo \"Previous step [get-vulnerabilities] failed: $file is empty.\"\n  else\n    /usr/bin/conftest test --no-fail $file \\\n    --policy /project/roxctl/vulnerabilities-check.rego --namespace required_checks \\\n    --output=json | tee /tekton/home/rox-vulnerabilities-\"$file_suffix.json\" || true\n  fi\n\n  #check for missing \"rox-vulnerabilities-\u003carch\u003e/image-index\" file and create a string\n  if [ ! -f \"/tekton/home/rox-vulnerabilities-$file_suffix.json\" ]; then\n    missing_vulnerabilities_files+=\"${missing_vulnerabilities_files:+, }/tekton/home/rox-vulnerabilities-$file_suffix.json\"\n  fi\ndone\n\nif [ -n \"$missing_vulnerabilities_files\" ]; then\n  note=\"Task $(context.task.name) failed: $missing_vulnerabilities_files did not generate. For details, check Tekton task log.\"\n  TEST_OUTPUT=$(make_result_json -r \"ERROR\" -t \"$note\")\n  echo \"$missing_vulnerabilities_files did not generate correctly. For details, check conftest command in Tekton task log.\"\n  echo \"${TEST_OUTPUT}\" | tee $(results.TEST_OUTPUT.path)\n  exit 0\nfi\n\nscan_result='{\"vulnerabilities\":{\"critical\":0, \"high\":0, \"medium\":0, \"low\":0}, \"unpatched_vulnerabilities\":{\"critical\":0, \"high\":0, \"medium\":0, \"low\":0}, \"discrepancies\":{\"count\":0}}'\nfor file in /tekton/home/rox-vulnerabilities-*.json; do\n    result=$(jq -rce \\\n        '{\n            vulnerabilities:{\n              critical: (.[] | .warnings? // [] | map(select(.metadata.details.name==\"roxctl_critical_vulnerabilities\").metadata.\"vulnerabilities_number\" // 0)| add // 0),\n              high: (.[] | .warnings? // [] | map(select(.metadata.details.name==\"roxctl_high_vulnerabilities\").metadata.\"vulnerabilities_number\" // 0)| add // 0),\n              medium: (.[] | .warnings? // [] | map(select(.metadata.details.name==\"roxctl_medium_vulnerabilities\").metadata.\"vulnerabilities_number\" // 0)| add // 0),\n              low: (.[] | .warnings? // [] | map(select(.metadata.details.name==\"roxctl_low_vulnerabilities\").metadata.\"vulnerabilities_number\" // 0)| add // 0),\n            },\n            unpatched_vulnerabilities:{\n              critical: (.[] | .warnings? // [] | map(select(.metadata.details.name==\"roxctl_unpatched_critical_vulnerabilities\").metadata.\"vulnerabilities_number\" // 0)| add // 0),\n              high: (.[] | .warnings? // [] | map(select(.metadata.details.name==\"roxctl_unpatched_high_vulnerabilities\").metadata.\"vulnerabilities_number\" // 0)| add // 0),\n              medium: (.[] | .warnings? // [] | map(select(.metadata.details.name==\"roxctl_unpatched_medium_vulnerabilities\").metadata.\"vulnerabilities_number\" // 0)| add // 0),\n              low: (.[] | .warnings? // [] | map(select(.metadata.details.name==\"roxctl_unpatched_low_vulnerabilities\").metadata.\"vulnerabilities_number\" // 0)| add // 0),\n            },\n            discrepancies:{\n            count: (.[] | .warnings? // [] | map(select(.metadata.details.name==\"discrepancies\").metadata.\"discrepancies_number\" // 0)| add // 0),\n            }\n        }' \"$file\")\n\n    scan_result=$(jq -s -rce \\\n          '.[0].vulnerabilities.critical += .[1].vulnerabilities.critical |\n          .[0].vulnerabilities.high += .[1].vulnerabilities.high |\n          .[0].vulnerabilities.medium += .[1].vulnerabilities.medium |\n          .[0].vulnerabilities.low += .[1].vulnerabilities.low |\n          .[0].unpatched_vulnerabilities.critical += .[1].unpatched_vulnerabilities.critical |\n          .[0].unpatched_vulnerabilities.high += .[1].unpatched_vulnerabilities.high |\n          .[0].unpatched_vulnerabilities.medium += .[1].unpatched_vulnerabilities.medium |\n          .[0].unpatched_vulnerabilities.low += .[1].unpatched_vulnerabilities.low |\n          .[0].discrepancies.count += .[1].discrepancies.count |\n          .[0]' \u003c\u003c\u003c\"$scan_result $result\")\ndone\n\necho \"$scan_result\" | tee \"$(results.SCAN_OUTPUT.path)\"\n\n# shellcheck disable=SC2154\nnote=\"Task $(context.task.name) completed: Refer to Tekton task result SCAN_OUTPUT for vulnerabilities scanned by Rox.\"\nTEST_OUTPUT=$(make_result_json -r \"SUCCESS\" -t \"$note\")\necho \"${TEST_OUTPUT}\" | tee $(results.TEST_OUTPUT.path)\n","securityContext":{"capabilities":{"add":["SETFCAP"]}}},{"image":"quay.io/konflux-ci/konflux-test:v1.5.10@sha256:2f9960d60c0e4aa0c2fba42b147736fab5bd11644577cff60ec4255a392be252","name":"get-rhsas","script":"#!/usr/bin/env bash\nset -euo pipefail\n# parse rhsas\njq -s 'def unique_preserving_order: reduce .[] as $item ([]; if index($item) == null then . + [$item] else . end);{ CRITICAL: ([.[].CRITICAL[]?] | unique_preserving_order), IMPORTANT: ([.[].IMPORTANT[]?] | unique_preserving_order) }' \"/tekton/home/rhsas.json\" \u003e rhsas-final.json || true\n# check for rhsas file size, exit in case it is larger\nfsize=$(wc -c \u003c rhsas-final.json)\nif [ \"$fsize\" -gt 4096 ]; then\n  echo \"File containing RHSAs is larger than 4096 bytes, result can't be used.\"\n  echo \"File content:\"\n  cat rhsas-final.json\n  echo \"Setting ACS_RHSAS result as overflow.\"\n  ACS_RHSAS='{\"CRITICAL\":[],\"IMPORTANT\":[],\"truncated\":true}'\n  echo \"${ACS_RHSAS}\" | tee \"$(results.ACS_RHSAS.path)\"\n  exit 0\nfi\nACS_RHSAS=$(\u003c rhsas-final.json)\necho \"${ACS_RHSAS}\" | tee \"$(results.ACS_RHSAS.path)\"\n","workingDir":"/tekton/home"}],"volumes":[{"name":"token-vol","projected":{"sources":[{"serviceAccountToken":{"audience":"rhacs","expirationSeconds":3600,"path":"token"}}]}},{"configMap":{"items":[{"key":"$(params.ca-trust-config-map-key)","path":"ca-bundle.crt"}],"name":"$(params.ca-trust-config-map-name)","optional":true},"name":"trusted-ca"}]}}