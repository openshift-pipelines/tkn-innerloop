{"apiVersion":"tekton.dev/v1","kind":"Task","metadata":{"annotations":{"tekton.dev/categories":"Git","tekton.dev/displayName":"git clone oci trusted artifacts","tekton.dev/pipelines.minVersion":"0.21.0","tekton.dev/platforms":"linux/amd64,linux/s390x,linux/ppc64le,linux/arm64","tekton.dev/tags":"git"},"labels":{"app.kubernetes.io/version":"0.2.6"},"name":"git-clone-oci-ta"},"spec":{"description":"The git-clone-oci-ta Task will clone a repo from the provided url and store it as a trusted artifact in the provided OCI repository.","params":[{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the CA bundle data.","name":"caTrustConfigMapKey","type":"string"},{"default":"trusted-ca","description":"The name of the ConfigMap to read CA bundle data from.","name":"caTrustConfigMapName","type":"string"},{"default":"1","description":"Perform a shallow clone, fetching only the most recent N commits.","name":"depth","type":"string"},{"default":"true","description":"Check symlinks in the repo. If they're pointing outside of the repo, the build will fail.\n","name":"enableSymlinkCheck","type":"string"},{"default":"false","description":"Fetch all tags for the repo.","name":"fetchTags","type":"string"},{"default":"","description":"HTTP proxy server for non-SSL requests.","name":"httpProxy","type":"string"},{"default":"","description":"HTTPS proxy server for SSL requests.","name":"httpsProxy","type":"string"},{"default":"info","description":"Log level for the git-clone command.","name":"logLevel","type":"string"},{"default":"","description":"Perform a shallow fetch of the target branch, fetching only the most recent N commits.\nIf empty, fetches the full history of the target branch.\n","name":"mergeSourceDepth","type":"string"},{"default":"","description":"URL of the repository to fetch the target branch from when mergeTargetBranch is true.\nIf empty, uses the same repository (origin). This allows merging a branch from a different repository.\n","name":"mergeSourceRepoUrl","type":"string"},{"default":"false","description":"Set to \"true\" to merge the targetBranch into the checked-out revision.","name":"mergeTargetBranch","type":"string"},{"default":"","description":"Opt out of proxying HTTP/HTTPS requests.","name":"noProxy","type":"string"},{"default":"","description":"Expiration date for the trusted artifacts created in the OCI repository. An empty string means the artifacts do not expire.","name":"ociArtifactExpiresAfter","type":"string"},{"description":"The OCI repository where the Trusted Artifacts are stored.","name":"ociStorage","type":"string"},{"default":"","description":"Refspec to fetch before checking out revision.","name":"refspec","type":"string"},{"default":"","description":"Revision to checkout. (branch, tag, sha, ref, etc...)","name":"revision","type":"string"},{"default":"7","description":"Minimum length of the short commit SHA. Git may return a longer prefix if needed for uniqueness.","name":"shortCommitLength","type":"string"},{"default":"","description":"Define the directory patterns to match or exclude when performing a sparse checkout.","name":"sparseCheckoutDirectories","type":"string"},{"default":"true","description":"Set the `http.sslVerify` global git config. Setting this to `false` is not advised unless you are sure that you trust your git remote.","name":"sslVerify","type":"string"},{"default":"","description":"Comma-separated list of specific submodule paths to initialize and fetch. Only submodules in the specified directories and their subdirectories will be fetched. Empty string fetches all submodules. Parameter \"submodules\" must be set to \"true\" to make this parameter applicable.","name":"submodulePaths","type":"string"},{"default":"true","description":"Initialize and fetch git submodules.","name":"submodules","type":"string"},{"default":"","description":"CSV list of path patterns to exclude from the symlink check. Symlinks whose paths match\nare not checked. Patterns are relative to the checkout directory and must not start with '/'.\nUse '*' and '?' as wildcards ('*' matches across '/').\nQuote patterns containing commas using CSV double quotes.\n","name":"symlinkCheckIgnorePattern","type":"string"},{"default":"main","description":"The target branch to merge into the revision (if mergeTargetBranch is true).","name":"targetBranch","type":"string"},{"description":"Repository URL to clone from.","name":"url","type":"string"}],"results":[{"description":"The precise commit SHA that was fetched by this Task. This result uses Chains type hinting to include in the provenance.","name":"CHAINS-GIT_COMMIT"},{"description":"The precise URL that was fetched by this Task. This result uses Chains type hinting to include in the provenance.","name":"CHAINS-GIT_URL"},{"description":"The Trusted Artifact URI pointing to the artifact with the application source code.","name":"SOURCE_ARTIFACT","type":"string"},{"description":"The precise commit SHA that was fetched by this Task.","name":"commit"},{"description":"The commit timestamp of the checkout","name":"commit-timestamp"},{"description":"The SHA of the commit after merging the target branch (if the param mergeTargetBranch is true).","name":"merged_sha"},{"description":"Abbreviated commit SHA for the checkout. At least params.shortCommitLength characters; longer if Git requires more for uniqueness.","name":"short-commit"},{"description":"The precise URL that was fetched by this Task.","name":"url"}],"steps":[{"computeResources":{"limits":{"memory":"2Gi"},"requests":{"cpu":"350m","memory":"2Gi"}},"env":[{"name":"KBC_GIT_CLONE_URL","value":"$(params.url)"},{"name":"KBC_GIT_CLONE_REVISION","value":"$(params.revision)"},{"name":"KBC_GIT_CLONE_REFSPEC","value":"$(params.refspec)"},{"name":"KBC_GIT_CLONE_SUBMODULES","value":"$(params.submodules)"},{"name":"KBC_GIT_CLONE_SUBMODULE_PATHS","value":"$(params.submodulePaths)"},{"name":"KBC_GIT_CLONE_DEPTH","value":"$(params.depth)"},{"name":"KBC_GIT_CLONE_SHORT_COMMIT_LENGTH","value":"$(params.shortCommitLength)"},{"name":"KBC_GIT_CLONE_SSL_VERIFY","value":"$(params.sslVerify)"},{"name":"KBC_GIT_CLONE_SPARSE_CHECKOUT_DIRECTORIES","value":"$(params.sparseCheckoutDirectories)"},{"name":"KBC_GIT_CLONE_ENABLE_SYMLINK_CHECK","value":"$(params.enableSymlinkCheck)"},{"name":"KBC_GIT_CLONE_SYMLINK_CHECK_IGNORE_PATTERN","value":"$(params.symlinkCheckIgnorePattern)"},{"name":"KBC_GIT_CLONE_FETCH_TAGS","value":"$(params.fetchTags)"},{"name":"KBC_GIT_CLONE_MERGE_TARGET_BRANCH","value":"$(params.mergeTargetBranch)"},{"name":"KBC_GIT_CLONE_TARGET_BRANCH","value":"$(params.targetBranch)"},{"name":"KBC_GIT_CLONE_MERGE_SOURCE_REPO_URL","value":"$(params.mergeSourceRepoUrl)"},{"name":"KBC_GIT_CLONE_MERGE_SOURCE_DEPTH","value":"$(params.mergeSourceDepth)"},{"name":"KBC_GIT_CLONE_BASIC_AUTH_DIRECTORY","value":"$(workspaces.basic-auth.path)"},{"name":"KBC_GIT_CLONE_SSH_DIRECTORY","value":"$(workspaces.ssh-directory.path)"},{"name":"PARAM_HTTP_PROXY","value":"$(params.httpProxy)"},{"name":"PARAM_HTTPS_PROXY","value":"$(params.httpsProxy)"},{"name":"PARAM_NO_PROXY","value":"$(params.noProxy)"},{"name":"KBC_LOG_LEVEL","value":"$(params.logLevel)"},{"name":"KBC_GIT_CLONE_OUTPUT_DIR","value":"/var/workdir"},{"name":"KBC_GIT_CLONE_SUBDIRECTORY","value":"source"}],"image":"quay.io/konflux-ci/konflux-build-cli@sha256:85141954209ee158fe9e559869a0da196ff08c5d4bb15b1a6c2e54d4fcd6b52f","name":"clone","script":"#!/usr/bin/env bash\nset -euo pipefail\n\nca_bundle=/mnt/trusted-ca/ca-bundle.crt\nif [ -f \"$ca_bundle\" ]; then\n  echo \"INFO: Using mounted CA bundle: $ca_bundle\"\n  cp -vf \"$ca_bundle\" /etc/pki/ca-trust/source/anchors\n  update-ca-trust\nfi\n\ntest -z \"${PARAM_HTTP_PROXY}\" || export HTTP_PROXY=\"${PARAM_HTTP_PROXY}\"\ntest -z \"${PARAM_HTTPS_PROXY}\" || export HTTPS_PROXY=\"${PARAM_HTTPS_PROXY}\"\ntest -z \"${PARAM_NO_PROXY}\" || export NO_PROXY=\"${PARAM_NO_PROXY}\"\n\nRESULT_FILE=\"$(mktemp)\"\nkonflux-build-cli git-clone \u003e\"${RESULT_FILE}\"\n\nprintf \"%s\" \"$(jq -r '.commit' \"${RESULT_FILE}\")\" \u003e\"$(results.commit.path)\"\nprintf \"%s\" \"$(jq -r '.shortCommit' \"${RESULT_FILE}\")\" \u003e\"$(results.short-commit.path)\"\nprintf \"%s\" \"$(jq -r '.url' \"${RESULT_FILE}\")\" \u003e\"$(results.url.path)\"\nprintf \"%s\" \"$(jq -r '.commitTimestamp' \"${RESULT_FILE}\")\" \u003e\"$(results.commit-timestamp.path)\"\nprintf \"%s\" \"$(jq -r '.\"CHAINS-GIT_URL\"' \"${RESULT_FILE}\")\" \u003e\"$(results.CHAINS-GIT_URL.path)\"\nprintf \"%s\" \"$(jq -r '.\"CHAINS-GIT_COMMIT\"' \"${RESULT_FILE}\")\" \u003e\"$(results.CHAINS-GIT_COMMIT.path)\"\n\nMERGED_SHA=$(jq -r '.mergedSha // empty' \"${RESULT_FILE}\")\nif [ -n \"${MERGED_SHA}\" ]; then\n  printf \"%s\" \"${MERGED_SHA}\" \u003e\"$(results.merged_sha.path)\"\nfi\n","securityContext":{"runAsUser":0},"volumeMounts":[{"mountPath":"/mnt/trusted-ca","name":"trusted-ca","readOnly":true},{"mountPath":"/var/workdir","name":"workdir"}]},{"args":["create","--store","$(params.ociStorage)","$(results.SOURCE_ARTIFACT.path)=/var/workdir/source"],"computeResources":{"limits":{"memory":"3Gi"},"requests":{"cpu":"1","memory":"3Gi"}},"env":[{"name":"IMAGE_EXPIRES_AFTER","value":"$(params.ociArtifactExpiresAfter)"}],"image":"quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:6df16e808f147926a2ba5f88588350bd8f77e73fde43614e79ddbd6e2b097d2e","name":"create-trusted-artifact","volumeMounts":[{"mountPath":"/var/workdir","name":"workdir"},{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"}]}],"volumes":[{"configMap":{"items":[{"key":"$(params.caTrustConfigMapKey)","path":"ca-bundle.crt"}],"name":"$(params.caTrustConfigMapName)","optional":true},"name":"trusted-ca"},{"emptyDir":{},"name":"workdir"}],"workspaces":[{"description":"A Workspace containing a .gitconfig and .git-credentials file or username and password.\nThese will be copied to the user's home before any git commands are run. Any\nother files in this Workspace are ignored. It is strongly recommended\nto use ssh-directory over basic-auth whenever possible and to bind a\nSecret to this Workspace over other volume types.\n","name":"basic-auth","optional":true},{"description":"A .ssh directory with private key, known_hosts, config, etc. Copied to\nthe user's home before git commands are executed. Used to authenticate\nwith the git remote when performing the clone. Binding a Secret to this\nWorkspace is strongly recommended over other volume types.\n","name":"ssh-directory","optional":true}]}}