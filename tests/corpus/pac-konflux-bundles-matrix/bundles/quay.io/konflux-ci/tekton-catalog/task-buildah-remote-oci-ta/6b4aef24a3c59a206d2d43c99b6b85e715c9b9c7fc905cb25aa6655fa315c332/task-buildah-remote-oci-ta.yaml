values will be used\" \u003e\u00262\nelse\n  SIGNING_CONFIG=\"$(cat ${KFLX_CONFIG_PATH})\"\nfi\n\n# configmap key -\u003e variable name mapping\ndeclare -A SIGNING_KEY_MAP=(\n   [defaultOIDCIssuer]=SIGSTORE_OIDC_ISSUER\n   [rekorInternalUrl]=REKOR_URL\n   [fulcioInternalUrl]=SIGSTORE_FULCIO_URL\n   [tufInternalUrl]=TUF_URL\n)\n\n# fallback keys when internal URL is not available\ndeclare -A SIGNING_FALLBACK_MAP=(\n   [rekorInternalUrl]=rekorExternalUrl\n   [fulcioInternalUrl]=fulcioExternalUrl\n   [tufInternalUrl]=tufExternalUrl\n)\n\nmissing=\"\"\nconfigured=0\nfor key in \"${!SIGNING_KEY_MAP[@]}\"; do\n  val=$(echo \"${SIGNING_CONFIG}\" | jq -r \".data.${key} // empty\")\n  if [ -z \"${val}\" ] \u0026\u0026 [ -n \"${SIGNING_FALLBACK_MAP[$key]+x}\" ]; then\n    fallback_key=\"${SIGNING_FALLBACK_MAP[$key]}\"\n    val=$(echo \"${SIGNING_CONFIG}\" | jq -r \".data.${fallback_key} // empty\")\n    if [ -n \"${val}\" ]; then\n      echo \"Using fallback ${fallback_key} instead of ${key}\"\n    fi\n  fi\n  if [ -z \"${val}\" ]; then\n    missing=\"${missing:+${missing}, }${key}\"\n  else\n    declare \"${SIGNING_KEY_MAP[$key]}=${val}\"\n    configured=$((configured + 1))\n  fi\ndone\n\nif [ \"${configured}\" -eq 0 ]; then\n  echo \"Keyless signing is disabled (none of ${missing} are configured in the konflux-info/cluster-config configmap)\"\nelif [ \"${configured}\" -ne \"${#SIGNING_KEY_MAP[@]}\" ]; then\n  echo \"ERROR: Incomplete keyless signing configuration in konflux-info/cluster-config configmap. Missing: ${missing}\" \u003e\u00262\n  exit 1\nelse\n  echo \"Keyless signing is enabled\"\n\n  echo \"Using Rekor URL: ${REKOR_URL}\"\n  echo \"Using Fulcio URL: ${SIGSTORE_FULCIO_URL}\"\n  echo \"Using OIDC issuer: ${SIGSTORE_OIDC_ISSUER}\"\n\n  echo \"Initializing TUF root from ${TUF_URL}\"\n  if ! retry cosign initialize --root \"${TUF_URL}/root.json\" --mirror \"${TUF_URL}\"; then\n    echo \"Failed to initialize TUF root\" \u003e\u00262\n    exit 1\n  fi\n\n  # env var consumed by cosign\n  SIGSTORE_ID_TOKEN=\"$(cat /var/run/sigstore/cosign/oidc-token)\"\n  export SIGSTORE_ID_TOKEN\n\n  echo \"[$(date --utc -Ins)] Sign image\"\n  echo \"Signing image ${IMAGE_REF} using keyless signing\"\n  if ! retry cosign sign -y \\\n    --use-signing-config=false \\\n    --rekor-url=\"${REKOR_URL}\" \\\n    --fulcio-url=\"${SIGSTORE_FULCIO_URL}\" \\\n    --oidc-issuer=\"${SIGSTORE_OIDC_ISSUER}\" \\\n    \"${IMAGE_REF}\"; then\n    echo \"Failed to sign image\" \u003e\u00262\n    exit 1\n  fi\n\n  if [ \"${SKIP_SBOM_GENERATION}\" = \"true\" ]; then\n    echo \"Skipping SBOM signing because SBOM generation is disabled\"\n  else\n    ATT_SBOM_TYPE=\"${SBOM_TYPE}\"\n    if [ \"${ATT_SBOM_TYPE}\" = \"spdx\" ]; then\n      # for format cossistency with cyclonedx format, we want to use spdxjson instad of spdx\n      # spdx export data as rawstring, we want structured json as cyclonedx\n      ATT_SBOM_TYPE=\"spdxjson\"\n    fi\n\n    echo \"[$(date --utc -Ins)] Sign SBOM\"\n    echo \"Signing and attaching SBOM to ${IMAGE_REF} using keyless signing\"\n    if ! retry cosign attest -y --type \"${ATT_SBOM_TYPE}\" --predicate sbom.json \\\n      --use-signing-config=false \\\n      --rekor-url=\"${REKOR_URL}\" \\\n      --fulcio-url=\"${SIGSTORE_FULCIO_URL}\" \\\n      --oidc-issuer=\"${SIGSTORE_OIDC_ISSUER}\" \\\n      \"${IMAGE_REF}\"; then\n      echo \"Failed to sign SBOM\" \u003e\u00262\n      exit 1\n    fi\n  fi\nfi\n\necho\necho \"[$(date --utc -Ins)] End upload-sbom\"\n","securityContext":{"runAsNonRoot":false,"runAsUser":0},"volumeMounts":[{"mountPath":"/mnt/trusted-ca","name":"trusted-ca","readOnly":true},{"mountPath":"/var/run/sigstore/cosign","name":"oidc-token","readOnly":true}],"workingDir":"/var/workdir"}],"volumes":[{"name":"activation-key","secret":{"optional":true,"secretName":"$(params.ACTIVATION_KEY)"}},{"name":"additional-secret","secret":{"optional":true,"secretName":"$(params.ADDITIONAL_SECRET)"}},{"name":"etc-pki-entitlement","se