{"apiVersion":"tekton.dev/v1","kind":"Task","metadata":{"annotations":{"tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/tags":"image-build, konflux"},"labels":{"app.kubernetes.io/version":"0.14.1","build.appstudio.redhat.com/build_type":"docker"},"name":"buildah-remote-oci-ta"},"spec":{"description":"Buildah task builds source code into a container image and pushes the image into container registry using buildah tool.\nIn addition, it generates a SBOM file, injects the SBOM file into final container image and pushes the SBOM file as separate image using cosign tool.\nWhen prefetch-dependencies task is activated it is using its artifacts to run build in hermetic environment.","params":[{"default":"activation-key","description":"Name of secret which contains subscription activation key","name":"ACTIVATION_KEY","type":"string"},{"default":[],"description":"Additional base image references to include to the SBOM. Array of image_reference_with_digest strings","name":"ADDITIONAL_BASE_IMAGES","type":"array"},{"default":"does-not-exist","description":"Name of a secret which will be made available to the build with 'buildah build --secret' at /run/secrets/$ADDITIONAL_SECRET","name":"ADDITIONAL_SECRET","type":"string"},{"default":"","description":"Comma separated list of extra capabilities to add when running 'buildah build'","name":"ADD_CAPABILITIES","type":"string"},{"default":"false","description":"Allows to use parent images that don't match the build host architecture. This option must be used with caution as it may create incompatible images.","name":"ALLOW_CROSS_PLATFORM_IMAGES","type":"string"},{"default":[],"description":"Additional key=value annotations that should be applied to the image","name":"ANNOTATIONS","type":"array"},{"default":"","description":"Path to a file with additional key=value annotations that should be applied to the image","name":"ANNOTATIONS_FILE","type":"string"},{"default":"oci","description":"The format for the resulting image's mediaType. Valid values are oci (default) or docker.","name":"BUILDAH_FORMAT","type":"string"},{"default":[],"description":"Array of --build-arg values (\"arg=value\" strings)","name":"BUILD_ARGS","type":"array"},{"default":[],"description":"Array of paths to files with build arguments, see https://www.mankier.com/1/buildah-build#--build-arg-file","name":"BUILD_ARGS_FILES","type":"array"},{"default":"","description":"Defines the single build time for all buildah builds in seconds since UNIX epoch. Conflicts with SOURCE_DATE_EPOCH.","name":"BUILD_TIMESTAMP","type":"string"},{"default":"","description":"The image is built from this commit.","name":"COMMIT_SHA","type":"string"},{"default":".","description":"Path to the directory to use as context.","name":"CONTEXT","type":"string"},{"default":"false","description":"Determines if SBOM will be contextualized.","name":"CONTEXTUALIZE_SBOM","type":"string"},{"default":"./Dockerfile","description":"Path to the Dockerfile to build.","name":"DOCKERFILE","type":"string"},{"default":"etc-pki-entitlement","description":"Name of secret which contains the entitlement certificates","name":"ENTITLEMENT_SECRET","type":"string"},{"default":[],"description":"Array of --env values (\"env=value\" strings)","name":"ENV_VARS","type":"array"},{"default":"false","description":"Determines if build will be executed without network access.","name":"HERMETIC","type":"string"},{"default":"","description":"HTTP/HTTPS proxy to use for the buildah pull and build operations. Will not be passed through to the container during the build process.","name":"HTTP_PROXY","type":"string"},{"default":"true","description":"Whether to keep compatibility location at /root/buildinfo/ for ICM injection","name":"ICM_KEEP_COMPAT_LOCATION","type":"string"},{"description":"Reference of the image buildah will produce.","name":"IMAGE","type":"string"},{"default":"","description":"Delete image tag after specified time. Empty means to keep the image tag. Time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.","name":"IMAGE_EXPIRES_AFTER","type":"string"},{"default":"true","description":"Determines if the image inherits the base image labels.","name":"INHERIT_BASE_IMAGE_LABELS","type":"string"},{"default":[],"description":"Additional key=value labels that should be applied to the image","name":"LABELS","type":"array"},{"default":"info","description":"Log level for the build command.","name":"LOG_LEVEL","type":"string"},{"default":"","description":"Comma separated list of hosts or domains which should bypass the HTTP/HTTPS proxy.","name":"NO_PROXY","type":"string"},{"default":"false","description":"Omit build history information from the resulting image. Improves reproducibility by excluding timestamps and layer metadata.","name":"OMIT_HISTORY","type":"string"},{"default":"","description":"The Trusted Artifact URI pointing to the artifact with the prefetched dependencies.","name":"PREFETCH_ARTIFACT","type":"string"},{"default":"","description":"In case it is not empty, the prefetched content should be made available to the build.","name":"PREFETCH_INPUT","type":"string"},{"default":"false","description":"Whether to enable privileged mode, should be used only with remote VMs","name":"PRIVILEGED_NESTED","type":"string"},{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the proxy CA bundle data.","name":"PROXY_CA_TRUST_CONFIG_MAP_KEY","type":"string"},{"default":"caching-ca-bundle","description":"The name of the ConfigMap to read proxy CA bundle data from.","name":"PROXY_CA_TRUST_CONFIG_MAP_NAME","type":"string"},{"default":"false","description":"Clamp mtime of all files to at most SOURCE_DATE_EPOCH. Does nothing if SOURCE_DATE_EPOCH is not defined.","name":"REWRITE_TIMESTAMP","type":"string"},{"default":"auto","description":"Mount /etc/rhsm/ca from the host machine into the build. Valid values are 'always', 'auto' (default), 'never'. Only effective if HERMETIC=false and ACTIVATION_KEY or ENTITLEMENT_SECRET is set.","name":"RHSM_MOUNT_CA_CERTS","type":"string"},{"default":"true","description":"Flag to enable or disable SBOM validation before save. Validation is optional - use this if you are experiencing performance issues.","name":"SBOM_SKIP_VALIDATION","type":"string"},{"default":"true","description":"Flag to enable or disable SBOM generation from source code. The scanner of the source code is enabled only for non-hermetic builds and can be disabled if the SBOM_SYFT_SELECT_CATALOGERS can't turn off catalogers that cause false positives on source code scanning.","name":"SBOM_SOURCE_SCAN_ENABLED","type":"string"},{"default":"","description":"Extra option to customize Syft's default catalogers when generating SBOMs. The value corresponds to Syft's CLI flag --select-catalogers. The details about available catalogers can be found here: https://github.com/anchore/syft/wiki/Package-Cataloger-Selection","name":"SBOM_SYFT_SELECT_CATALOGERS","type":"string"},{"default":"spdx","description":"Select the SBOM format to generate. Valid values: spdx, cyclonedx. Note: the SBOM from the prefetch task - if there is one - must be in the same format.","name":"SBOM_TYPE","type":"string"},{"default":"false","description":"Don't inject a content-sets.json or a labels.json file. This requires that the canonical Containerfile takes care of this itself.","name":"SKIP_INJECTIONS","type":"string"},{"default":"false","description":"Skip SBOM-related operations. This will likely cause EC policies to fail if enabled","name":"SKIP_SBOM_GENERATION","type":"string"},{"default":"true","description":"Whether to skip stages in Containerfile that seem unused by subsequent stages","name":"SKIP_UNUSED_STAGES","type":"string"},{"description":"The Trusted Artifact URI pointing to the artifact with the application source code.","name":"SOURCE_ARTIFACT","type":"string"},{"default":"","description":"Timestamp in seconds since Unix epoch for reproducible builds. Sets image created time and SOURCE_DATE_EPOCH build arg. Conflicts with BUILD_TIMESTAMP.","name":"SOURCE_DATE_EPOCH","type":"string"},{"default":"","description":"The image is built from this URL.","name":"SOURCE_URL","type":"string"},{"default":"false","description":"Squash all new and previous layers added as a part of this build, as per --squash","name":"SQUASH","type":"string"},{"default":"overlay","description":"Storage driver to configure for buildah","name":"STORAGE_DRIVER","type":"string"},{"default":"","description":"Target stage in Dockerfile to build. If not specified, the Dockerfile is processed entirely to (and including) its last stage.","name":"TARGET_STAGE","type":"string"},{"default":"true","description":"Verify the TLS on the registry endpoint (for push/pull to a non-TLS registry)","name":"TLSVERIFY","type":"string"},{"default":"","description":"Mount the current working directory into the build using --volume $PWD:/$WORKINGDIR_MOUNT. Note that the $PWD will be the context directory for the build (see the CONTEXT param).","name":"WORKINGDIR_MOUNT","type":"string"},{"default":"fetched.repos.d","description":"Path in source workspace where dynamically-fetched repos are present","name":"YUM_REPOS_D_FETCHED"},{"default":"repos.d","description":"Path in the git repository in which yum repository files are stored","name":"YUM_REPOS_D_SRC"},{"default":"/etc/yum.repos.d","description":"Target path on the container in which yum repository files should be made available","name":"YUM_REPOS_D_TARGET"},{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the CA bundle data.","name":"caTrustConfigMapKey","type":"string"},{"default":"trusted-ca","description":"The name of the ConfigMap to read CA bundle data from.","name":"caTrustConfigMapName","type":"string"},{"description":"The platform to build on","name":"PLATFORM","type":"string"},{"default":"false","description":"Whether to append a sanitized platform architecture on the IMAGE tag","name":"IMAGE_APPEND_PLATFORM","type":"string"}],"results":[{"description":"Digest of the image just built","name":"IMAGE_DIGEST"},{"description":"Image reference of the built image","name":"IMAGE_REF"},{"description":"Image repository and tag where the built image was pushed","name":"IMAGE_URL"},{"description":"Reference of SBOM blob digest to enable digest-based verification from provenance","name":"SBOM_BLOB_URL","type":"string"}],"stepTemplate":{"computeResources":{"limits":{"memory":"4Gi"},"requests":{"cpu":"1","memory":"4Gi"}},"env":[{"name":"ADDITIONAL_SECRET","value":"$(params.ADDITIONAL_SECRET)"},{"name":"ADD_CAPABILITIES","value":"$(params.ADD_CAPABILITIES)"},{"name":"ALLOW_CROSS_PLATFORM_IMAGES","value":"$(params.ALLOW_CROSS_PLATFORM_IMAGES)"},{"name":"ANNOTATIONS_FILE","value":"$(params.ANNOTATIONS_FILE)"},{"name":"BUILD_TIMESTAMP","value":"$(params.BUILD_TIMESTAMP)"},{"name":"CONTEXT","value":"$(params.CONTEXT)"},{"name":"CONTEXTUALIZE_SBOM","value":"$(params.CONTEXTUALIZE_SBOM)"},{"name":"HERMETIC","value":"$(params.HERMETIC)"},{"name":"IMAGE","value":"$(params.IMAGE)"},{"name":"IMAGE_EXPIRES_AFTER","value":"$(params.IMAGE_EXPIRES_AFTER)"},{"name":"INHERIT_BASE_IMAGE_LABELS","value":"$(params.INHERIT_BASE_IMAGE_LABELS)"},{"name":"KBC_LOG_LEVEL","value":"$(params.LOG_LEVEL)"},{"name":"PRIVILEGED_NESTED","value":"$(params.PRIVILEGED_NESTED)"},{"name":"PUSH_FORMAT","value":"$(params.BUILDAH_FORMAT)"},{"name":"RHSM_MOUNT_CA_CERTS","value":"$(params.RHSM_MOUNT_CA_CERTS)"},{"name":"SBOM_SKIP_VALIDATION","value":"$(params.SBOM_SKIP_VALIDATION)"},{"name":"SBOM_SOURCE_SCAN_ENABLED","value":"$(params.SBOM_SOURCE_SCAN_ENABLED)"},{"name":"SBOM_SYFT_SELECT_CATALOGERS","value":"$(params.SBOM_SYFT_SELECT_CATALOGERS)"},{"name":"SBOM_TYPE","value":"$(params.SBOM_TYPE)"},{"name":"SKIP_INJECTIONS","value":"$(params.SKIP_INJECTIONS)"},{"name":"SKIP_SBOM_GENERATION","value":"$(params.SKIP_SBOM_GENERATION)"},{"name":"SKIP_UNUSED_STAGES","value":"$(params.SKIP_UNUSED_STAGES)"},{"name":"SOURCE_CODE_DIR","value":"source"},{"name":"SQUASH","value":"$(params.SQUASH)"},{"name":"STORAGE_DRIVER","value":"$(params.STORAGE_DRIVER)"},{"name":"TARGET_STAGE","value":"$(params.TARGET_STAGE)"},{"name":"TASKRUN_NAME","value":"$(context.taskRun.name)"},{"name":"TLSVERIFY","value":"$(params.TLSVERIFY)"},{"name":"WORKINGDIR_MOUNT","value":"$(params.WORKINGDIR_MOUNT)"},{"name":"YUM_REPOS_D_FETCHED","value":"$(params.YUM_REPOS_D_FETCHED)"},{"name":"YUM_REPOS_D_SRC","value":"$(params.YUM_REPOS_D_SRC)"},{"name":"YUM_REPOS_D_TARGET","value":"$(params.YUM_REPOS_D_TARGET)"},{"name":"BUILDER_IMAGE","value":"quay.io/konflux-ci/konflux-build-cli@sha256:42809082a271a037f0774af81e536d9f7d03cf0236634ff44b1c5f85b7fa2216"},{"name":"PLATFORM","value":"$(params.PLATFORM)"},{"name":"IMAGE_APPEND_PLATFORM","value":"$(params.IMAGE_APPEND_PLATFORM)"}],"imagePullPolicy":"IfNotPresent","volumeMounts":[{"mountPath":"/shared","name":"shared"},{"mountPath":"/var/workdir","name":"workdir"}]},"steps":[{"args":["use","$(params.SOURCE_ARTIFACT)=/var/workdir/source","$(params.PREFETCH_ARTIFACT)=/var/workdir/prefetch"],"computeResources":{},"image":"quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:6df16e808f147926a2ba5f88588350bd8f77e73fde43614e79ddbd6e2b097d2e","name":"use-trusted-artifact","volumeMounts":[{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"}]},{"args":["--build-args","$(params.BUILD_ARGS[*])","--build-args-files","$(params.BUILD_ARGS_FILES[*])","--envs","$(params.ENV_VARS[*])","--labels","$(params.LABELS[*])","--annotations","$(params.ANNOTATIONS[*])"],"computeResources":{"limits":{"cpu":"4600m","memory":"8Gi"},"requests":{"cpu":"4600m","memory":"8Gi"}},"env":[{"name":"HOME","value":"/root"},{"name":"COMMIT_SHA","value":"$(params.COMMIT_SHA)"},{"name":"SOURCE_URL","value":"$(params.SOURCE_URL)"},{"name":"DOCKERFILE","value":"$(params.DOCKERFILE)"},{"name":"BUILDAH_HTTP_PROXY","value":"$(params.HTTP_PROXY)"},{"name":"BUILDAH_NO_PROXY","value":"$(params.NO_PROXY)"},{"name":"ICM_KEEP_COMPAT_LOCATION","value":"$(params.ICM_KEEP_COMPAT_LOCATION)"},{"name":"BUILDAH_OMIT_HISTORY","value":"$(params.OMIT_HISTORY)"},{"name":"BUILDAH_SOURCE_DATE_EPOCH","value":"$(params.SOURCE_DATE_EPOCH)"},{"name":"BUILDAH_REWRITE_TIMESTAMP","value":"$(params.REWRITE_TIMESTAMP)"}],"image":"quay.io/konflux-ci/konflux-build-cli@sha256:42809082a271a037f0774af81e536d9f7d03cf0236634ff44b1c5f85b7fa2216","name":"build","script":"#!/bin/bash\nset -e\nset -o verbose\n\necho \"[$(date --utc -Ins)] Prepare connection\"\n\nmkdir -p ~/.ssh\nif [ -e \"/ssh/error\" ]; then\n  #no server could be provisioned\n  cat /ssh/error\n  exit 1\nfi\n\nSSH_HOST=$(cat /ssh/host)\nexport SSH_HOST\n\nif [ \"$SSH_HOST\" == \"localhost\" ] ; then\n  IS_LOCALHOST=true\n  echo \"Localhost detected; running build in cluster\"\nelif [ -e \"/ssh/otp\" ]; then\n  if ! curl --fail --cacert /ssh/otp-ca -XPOST -d @/ssh/otp \"$(cat /ssh/otp-server)\" \u003e~/.ssh/id_rsa; then\n    echo \"Failed to retrieve SSH key from the OTP server. This can happen when the PipelineRun retry option re-runs a task whose one-time credential was already consumed. Please, start a new build, and if problem persists, please report it as an MPC bug.\" \u003e\u00262\n    exit 1\n  fi\n  echo \"\" \u003e\u003e ~/.ssh/id_rsa\nelse\n  cp /ssh/id_rsa ~/.ssh\nfi\n\nmkdir -p scripts\n\nif ! [[ $IS_LOCALHOST ]]; then\n  echo \"[$(date --utc -Ins)] Setup VM\"\n\n  if [[ \"$BUILDAH_HTTP_PROXY\" =~ .+\\.cluster\\.local ]]; then\n    echo \"[$(date --utc -Ins)] Ignoring cluster local proxy for remote build\"\n    unset BUILDAH_HTTP_PROXY BUILDAH_NO_PROXY\n  fi\n\n  chmod 0400 ~/.ssh/id_rsa\n\n  # Share a single ssh connection to the build VM between every ssh and rsync\n  # invocation below. ControlMaster only multiplexes if a ControlPath is set,\n  # and ControlPersist keeps the master alive between invocations.\n  cat \u003e~/.ssh/config \u003c\u003c'SSHCONFIGEOF'\nHost *\n  ControlMaster auto\n  ControlPath ~/.ssh/control-%C\n  ControlPersist yes # should persist for the lifetime of the task pod\nSSHCONFIGEOF\n  chmod 0600 ~/.ssh/config\n\n  BUILD_DIR=$(cat /ssh/user-dir)\n  export BUILD_DIR\n  export SSH_ARGS=\"-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10\"\n  echo \"$BUILD_DIR\"\n  # shellcheck disable=SC2086\n  ssh $SSH_ARGS \"$SSH_HOST\"  mkdir -p \"${BUILD_DIR@Q}/workspaces\" \"${BUILD_DIR@Q}/scripts\" \"${BUILD_DIR@Q}/volumes\"\n\n  echo \"[$(date --utc -Ins)] Rsync data\"\n\n  rsync --timeout=300 -razW /shared/ \"$SSH_HOST:$BUILD_DIR/volumes/shared/\"\n  rsync --timeout=300 -razW /var/workdir/ \"$SSH_HOST:$BUILD_DIR/volumes/workdir/\"\n  rsync --timeout=300 -razW /entitlement/ \"$SSH_HOST:$BUILD_DIR/volumes/etc-pki-entitlement/\"\n  rsync --timeout=300 -razW /activation-key/ \"$SSH_HOST:$BUILD_DIR/volumes/activation-key/\"\n  rsync --timeout=300 -razW /additional-secret/ \"$SSH_HOST:$BUILD_DIR/volumes/additional-secret/\"\n  rsync --timeout=300 -razW /mnt/trusted-ca/ \"$SSH_HOST:$BUILD_DIR/volumes/trusted-ca/\"\n  rsync --timeout=300 -razW /mnt/proxy-ca-bundle/ \"$SSH_HOST:$BUILD_DIR/volumes/proxy-ca-bundle/\"\n  rsync --timeout=300 -razW  \"$HOME/.docker/\" \"$SSH_HOST:$BUILD_DIR/.docker/\"\n  rsync --timeout=300 -razW  \"/tekton/results/\" \"$SSH_HOST:$BUILD_DIR/results/\"\nfi\nif [ \"${IMAGE_APPEND_PLATFORM}\" == \"true\" ]; then\n  IMAGE=\"${IMAGE}-${PLATFORM//[^a-zA-Z0-9]/-}\"\n  export IMAGE\nfi\n\ncat \u003escripts/script-build.sh \u003c\u003c'REMOTESSHEOF'\n#!/bin/bash\nset -euo pipefail\ncd /var/workdir\n\nca_bundle=/mnt/trusted-ca/ca-bundle.crt\nproxy_ca_bundle=/mnt/proxy-ca-bundle/ca-bundle.crt\nupdate_ca_trust=false\n\nif [ -f \"$ca_bundle\" ]; then\n  echo \"[$(date --utc -Ins)] Using mounted CA bundle: $ca_bundle\"\n  cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors/ca-bundle.crt\n  update_ca_trust=true\nfi\n\nif [ -f \"$proxy_ca_bundle\" ] \u0026\u0026 [ -n \"${BUILDAH_HTTP_PROXY}\" ]; then\n  echo \"[$(date --utc -Ins)] Using mounted proxy CA bundle: $proxy_ca_bundle\"\n  cp -vf $proxy_ca_bundle /etc/pki/ca-trust/source/anchors/proxy-ca-bundle.crt\n  update_ca_trust=true\nfi\n\nif [ \"$update_ca_trust\" = \"true\" ]; then\n  echo \"[$(date --utc -Ins)] Update CA trust\"\n  update-ca-trust\nfi\n\necho \"[$(date --utc -Ins)] Prepare system (architecture: $(uname -m))\"\n\n# Fixing group permission on /var/lib/containers\nchown root:root /var/lib/containers\n\nsed -i 's/^\\s*short-name-mode\\s*=\\s*.*/short-name-mode = \"disabled\"/' /etc/containers/registries.conf\n\n# Delete policy settings for Red Hat registries to disable signature verification.\n# TODO: don't do this?\ncontainer_policy=$(\n  jq '.transports |= (\n        del(.docker.[\"registry.access.redhat.com\"]) |\n        del(.docker.[\"registry.redhat.io\"]) |\n        if (.docker == {}) then del(.docker) else . end\n      )' /etc/containers/policy.json\n)\necho \"Effective container policy:\"\nprintf '%s\\n' \"$container_policy\" | tee /etc/containers/policy.json\n\n# Setting new namespace to run buildah - 2^32-2\necho 'root:1:4294967294' | tee -a /etc/subuid \u003e\u003e/etc/subgid\n\necho \"[$(date --utc -Ins)] Run the build\"\n\nif [ -e \"$SOURCE_CODE_DIR/$CONTEXT/$DOCKERFILE\" ]; then\n  dockerfile_path=\"$(pwd)/$SOURCE_CODE_DIR/$CONTEXT/$DOCKERFILE\"\nelif [ -e \"$SOURCE_CODE_DIR/$DOCKERFILE\" ]; then\n  dockerfile_path=\"$(pwd)/$SOURCE_CODE_DIR/$DOCKERFILE\"\nelse\n  echo \"Cannot find Dockerfile $DOCKERFILE\"\n  exit 1\nfi\n\n# Necessary for newer version of buildah if the host system does not contain up to date version of container-selinux\n# TODO remove the option once all hosts were updated\nsecurity_args=(--security-opts unmask=/proc/interrupts)\n\nif [ \"${PRIVILEGED_NESTED}\" == \"true\" ]; then\n  security_args+=(--security-opts label=disable)\n  security_args+=(--cap-add all)\n  security_args+=(--devices /dev/fuse)\nfi\nif [ -n \"${ADD_CAPABILITIES}\" ]; then\n  security_args+=(--cap-add \"${ADD_CAPABILITIES}\")\nfi\n\nif [ -f \"/var/workdir/prefetch/cachi2.env\" ]; then\n  prefetch_dir=\"/var/workdir/prefetch\"\n  # KBC defaults to ${prefetch_dir}/copy-*\n  # Copy to a sibling dir instead in case we don't have write permissions to the prefetch_dir.\n  # It's still on the same filesystem, so copying via reflinks should be possible.\n  prefetch_dir_copy=\"/var/workdir/prefetch-copy\"\n  # Save the build machine's architecture to pass to Mobster later\n  uname -m \u003e/shared/prefetch-arch\nelse\n  prefetch_dir=\"\"\n  prefetch_dir_copy=\"\"\nfi\n\nyum_repos_d_sources=()\nif [ -d \"${YUM_REPOS_D_FETCHED}\" ]; then\n  yum_repos_d_sources+=(\"${YUM_REPOS_D_FETCHED}\")\nfi\nif [ -d \"${SOURCE_CODE_DIR}/${YUM_REPOS_D_SRC}\" ]; then\n  yum_repos_d_sources+=(\"${SOURCE_CODE_DIR}/${YUM_REPOS_D_SRC}\")\nfi\n\n# 0. if hermetic=true, skip all subscription related stuff\n# 1. do not enable activation key and entitlement at same time. If both are provided, prefer activation key.\n# 2. Activation-keys will be used when the key 'org' exists in the activation key secret.\n# 3. try to pre-register and mount files to the correct location so that users do no need to modify Dockerfiles.\n# 4. If the Dockerfile contains the string \"subcription-manager register\", add the activation-keys volume\n#    to buildah but don't pre-register for backwards compatibility. Mount an empty directory on\n#    to \"/etc/pki/entitlement\" to prevent certificates from being included\nrhsm_args=()\nif [ \"${HERMETIC}\" != \"true\" ]; then\n  if [ -e /activation-key/org ]; then\n    rhsm_args+=(--rhsm-activation-key=/activation-key/activationkey\n      --rhsm-org=/activation-key/org\n      --rhsm-activation-mount=/activation-key)\n\n    if ! grep -E \"^[^#]*subscription-manager.[^#]*register\" \"$dockerfile_path\"; then\n      # user is not running registration in the Containerfile: pre-register.\n      rhsm_args+=(--rhsm-activation-preregister)\n    fi\n  elif find /entitlement -name \"*.pem\" \u003e/dev/null; then\n    rhsm_args+=(--rhsm-entitlements=/entitlement)\n  fi\nfi\nif [ \"${RHSM_MOUNT_CA_CERTS}\" != \"auto\" ]; then\n  rhsm_args+=(--rhsm-mount-ca-certs=\"$RHSM_MOUNT_CA_CERTS\")\nfi\n\nsbom_args=()\nif [[ \"$SKIP_SBOM_GENERATION\" != true ]]; then\n  sbom_args+=(\n    --sbom-format \"$SBOM_TYPE\"\n    --syft-select-catalogers \"$SBOM_SYFT_SELECT_CATALOGERS\"\n    --syft-image-output /shared/sbom-image.json\n  )\n  if [[ \"${HERMETIC}\" == \"false\" \u0026\u0026 \"${SBOM_SOURCE_SCAN_ENABLED}\" == \"true\" ]]; then\n    sbom_args+=(--syft-source-output /shared/sbom-source.json)\n  fi\n  if [ \"${CONTEXTUALIZE_SBOM}\" == \"true\" ]; then\n    sbom_args+=(\n      --builder-metadata-output=/shared/builder-metadata.json\n      --buildprobe-output=/shared/buildprobe-metadata.yaml\n    )\n  fi\nfi\n\n# Prevent ShellCheck from giving a warning because 'image' is defined and 'IMAGE' is not.\ndeclare IMAGE\n\ncmd=(\n  konflux-build-cli image build\n  -f \"$dockerfile_path\" -t \"$IMAGE\" --source \"$SOURCE_CODE_DIR\" --context \"$CONTEXT\"\n  # use the taskRun name as a unique tag to prevent the $IMAGE from being garbage collected\n  # if another build pushes to the same $IMAGE output ref\n  --additional-tags \"$TASKRUN_NAME\"\n  --push\n  --push-format \"$PUSH_FORMAT\"\n  --secret-dirs \"src=/additional-secret,name=$ADDITIONAL_SECRET,optional=true\"\n  --workdir-mount \"$WORKINGDIR_MOUNT\"\n  --target \"$TARGET_STAGE\"\n  --inherit-labels=\"$INHERIT_BASE_IMAGE_LABELS\"\n  --source-date-epoch \"$BUILDAH_SOURCE_DATE_EPOCH\"\n  --rewrite-timestamp=\"$BUILDAH_REWRITE_TIMESTAMP\"\n  --squash=\"$SQUASH\"\n  --omit-history=\"$BUILDAH_OMIT_HISTORY\"\n  --image-source \"$SOURCE_URL\"\n  --image-revision \"$COMMIT_SHA\"\n  --quay-image-expires-after \"$IMAGE_EXPIRES_AFTER\"\n  --annotations-file \"$ANNOTATIONS_FILE\"\n  --legacy-build-timestamp \"$BUILD_TIMESTAMP\"\n  --add-legacy-labels\n  --include-legacy