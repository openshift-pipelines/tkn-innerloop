{"apiVersion":"tekton.dev/v1","kind":"Task","metadata":{"annotations":{"tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/tags":"image-build, konflux"},"labels":{"app.kubernetes.io/version":"0.11.0"},"name":"prefetch-dependencies-oci-ta"},"spec":{"description":"Task that prefetches project dependencies for hermetic build.","params":[{"default":"activation-key","description":"Name of secret which contains subscription activation key","name":"ACTIVATION_KEY","type":"string"},{"default":"service-ca.crt","description":"The name of the key in the ConfigMap that contains the service CA bundle data. Used to verify TLS connections to in-cluster services such as the package registry proxy.","name":"SERVICE_CA_TRUST_CONFIG_MAP_KEY","type":"string"},{"default":"openshift-service-ca.crt","description":"The name of the ConfigMap to read service CA bundle data from. Used to verify TLS connections to in-cluster services such as the package registry proxy.","name":"SERVICE_CA_TRUST_CONFIG_MAP_NAME","type":"string"},{"description":"The Trusted Artifact URI pointing to the artifact with the application source code.","name":"SOURCE_ARTIFACT","type":"string"},{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the CA bundle data.","name":"caTrustConfigMapKey","type":"string"},{"default":"trusted-ca","description":"The name of the ConfigMap to read CA bundle data from.","name":"caTrustConfigMapName","type":"string"},{"default":"","description":"Pass configuration to the prefetch tool.\nNote this needs to be passed as a YAML-formatted config dump, not as a file path!\n","name":"config-file-content"},{"default":"true","description":"Use the package registry proxy when prefetching dependencies","name":"enable-package-registry-proxy","type":"string"},{"description":"Configures project packages that will have their dependencies prefetched.","name":"input"},{"default":"debug","description":"Set the logging level (debug, info, warn, error, fatal).","name":"log-level"},{"default":"strict","description":"Control how input requirement violations are handled: strict (errors) or permissive (warnings).","name":"mode","type":"string"},{"default":"","description":"Expiration date for the trusted artifacts created in the OCI repository. An empty string means the artifacts do not expire.","name":"ociArtifactExpiresAfter","type":"string"},{"description":"The OCI repository where the Trusted Artifacts are stored.","name":"ociStorage","type":"string"},{"default":"","description":"Python package index URL to use when prefetching pip dependencies. Used as a fallback when requirements.txt does not specify --index-url. When empty (default), the standard PyPI index is used.","name":"pip-index-url","type":"string"},{"default":"spdx","description":"Select the SBOM format to generate. Valid values: spdx, cyclonedx.","name":"sbom-type"}],"results":[{"description":"The Trusted Artifact URI pointing to the artifact with the prefetched dependencies.","name":"PREFETCH_ARTIFACT","type":"string"},{"description":"The Trusted Artifact URI pointing to the artifact with the application source code.","name":"SOURCE_ARTIFACT","type":"string"}],"stepTemplate":{"imagePullPolicy":"IfNotPresent","volumeMounts":[{"mountPath":"/var/workdir","name":"workdir"}]},"steps":[{"computeResources":{"limits":{"memory":"64Mi"},"requests":{"cpu":"50m","memory":"64Mi"}},"env":[{"name":"SOURCE_ARTIFACT","value":"$(params.SOURCE_ARTIFACT)"}],"image":"quay.io/konflux-ci/task-runner:2.0.0@sha256:4b01fbf98fa7155f5c21443c285f88853864ae7cc66981cf6b543fc6ba16b81b","name":"skip-ta","script":"#!/bin/bash\n\necho -n \"${SOURCE_ARTIFACT}\" \u003e\"$(results.SOURCE_ARTIFACT.path)\"\necho -n \"\" \u003e\"$(results.PREFETCH_ARTIFACT.path)\"\n","when":[{"input":"$(params.input)","operator":"in","values":[""]}]},{"args":["use","$(params.SOURCE_ARTIFACT)=/var/workdir/source"],"image":"quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:6df16e808f147926a2ba5f88588350bd8f77e73