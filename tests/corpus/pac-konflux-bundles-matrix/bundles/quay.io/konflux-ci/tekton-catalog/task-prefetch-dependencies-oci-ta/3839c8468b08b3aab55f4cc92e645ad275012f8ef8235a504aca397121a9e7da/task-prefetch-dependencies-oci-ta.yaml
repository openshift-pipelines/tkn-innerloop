H\"\n  cp -vf \"$SERVICE_CA_BUNDLE_PATH\" /etc/pki/ca-trust/source/anchors/service-ca.crt\n  UPDATE_CA_TRUST=true\nfi\n\nif [ \"$UPDATE_CA_TRUST\" = \"true\" ]; then\n  update-ca-trust\n  # requests ignores the system CA store. Set REQUESTS_CA_BUNDLE explicitly.\n  export REQUESTS_CA_BUNDLE=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem\nfi\n\nif [ -e /activation-key/org ] \u0026\u0026 [ -e /activation-key/activationkey ]; then\n  export KBC_PD_RHSM_ORG=/activation-key/org\n  export KBC_PD_RHSM_ACTIVATION_KEY=/activation-key/activationkey\nfi\n\nif [ -n \"${CONFIG_FILE_CONTENT}\" ]; then\n  echo \"${CONFIG_FILE_CONTENT}\" \u003e/mnt/config/config.yaml\n  export KBC_PD_CONFIG_FILE=/mnt/config/config.yaml\nfi\n\nif [ -z \"${PIP_INDEX_URL}\" ]; then\n  unset PIP_INDEX_URL\nfi\n\nkonflux-build-cli prefetch-dependencies\n","volumeMounts":[{"mountPath":"/activation-key","name":"activation-key"},{"mountPath":"/mnt/config","name":"config"},{"mountPath":"/mnt/trusted-ca","name":"trusted-ca","readOnly":true},{"mountPath":"/mnt/service-ca","name":"service-ca","readOnly":true}],"when":[{"input":"$(params.input)","operator":"notin","values":[""]}]},{"args":["create","--store","$(params.ociStorage)","$(results.SOURCE_ARTIFACT.path)=/var/workdir/source","$(results.PREFETCH_ARTIFACT.path)=/var/workdir/prefetch"],"computeResources":{"limits":{"memory":"3Gi"},"requests":{"cpu":"1","memory":"3Gi"}},"env":[{"name":"IMAGE_EXPIRES_AFTER","value":"$(params.ociArtifactExpiresAfter)"}],"image":"quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:6df16e808f147926a2ba5f88588350bd8f77e73fde43614e79ddbd6e2b097d2e","name":"create-trusted-artifact","volumeMounts":[{"mountPath":"/etc/pki/tls/certs/ca-custom-bundle.crt","name":"trusted-ca","readOnly":true,"subPath":"ca-bundle.crt"}],"when":[{"input":"$(params.input)","operator":"notin","values":[""]}]}],"volumes":[{"name":"activation-key","secret":{"optional":true,"secretName":"$(params.ACTIVATION_KEY)"}},{"emptyDir":{},"name":"config"},{"configMap":{"items":[{"key":"$(params.SERVICE_CA_TRUST_CONFIG_MAP_KEY)","path":"ca-bundle.crt"}],"name":"$(params.SERVICE_CA_TRUST_CONFIG_MAP_NAME)","optional":true},"name":"service-ca"},{"configMap":{"items":[{"key":"$(params.caTrustConfigMapKey)","path":"ca-bundle.crt"}],"name":"$(params.caTrustConfigMapName)","optional":true},"name":"trusted-ca"},{"emptyDir":{},"name":"workdir"}],"workspaces":[{"description":"A Workspace containing a .gitconfig and .git-credentials file or username and password.\nThese will be copied to the user's home before prefetch is run. Any\nother files in this Workspace are ignored. It is strongly recommended\nto bind a Secret to this Workspace over other volume types.\n","name":"git-basic-auth","optional":true},{"description":"Workspace containing a .netrc file. Prefetch will use the credentials in this file when\nperforming http(s) requests.\n","name":"netrc","optional":true}]}}