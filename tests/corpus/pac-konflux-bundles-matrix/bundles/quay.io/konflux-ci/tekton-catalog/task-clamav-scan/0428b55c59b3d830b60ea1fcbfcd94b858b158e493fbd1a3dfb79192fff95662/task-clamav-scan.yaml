{"apiVersion":"tekton.dev/v1","kind":"Task","metadata":{"annotations":{"tekton.dev/pipelines.minVersion":"0.12.1","tekton.dev/tags":"virus, konflux"},"labels":{"app.kubernetes.io/version":"0.3.6"},"name":"clamav-scan"},"spec":{"description":"Scans the content of container images and OCI artifacts for viruses, malware, and other malicious content using ClamAV antivirus scanner.","params":[{"description":"Image digest to scan.","name":"image-digest"},{"description":"Image URL.","name":"image-url"},{"default":"","description":"Image platform or architecture.","name":"image-arch"},{"default":"","description":"unused","name":"docker-auth"},{"default":"trusted-ca","description":"The name of the ConfigMap to read CA bundle data from.","name":"ca-trust-config-map-name","type":"string"},{"default":"ca-bundle.crt","description":"The name of the key in the ConfigMap that contains the CA bundle data.","name":"ca-trust-config-map-key","type":"string"},{"default":"8","description":"Maximum number of threads clamd runs.","name":"clamd-max-threads"},{"default":"false","description":"If true, skips uploading the results to the image registry. Useful for read-only tests.","name":"skip-upload"}],"results":[{"description":"Tekton task test output.","name":"TEST_OUTPUT"},{"description":"Images processed in the task.","name":"IMAGES_PROCESSED"}],"steps":[{"computeResources":{"limits":{"cpu":"7300m","memory":"12Gi"},"requests":{"cpu":"7300m","memory":"12Gi"}},"env":[{"name":"HOME","value":"/work"},{"name":"IMAGE_URL","value":"$(params.image-url)"},{"name":"IMAGE_DIGEST","value":"$(params.image-digest)"},{"name":"IMAGE_ARCH","value":"$(params.image-arch)"},{"name":"MAX_THREADS","value":"$(params.clamd-max-threads)"}],"image":"quay.io/konflux-ci/clamav-db:latest","name":"extract-and-scan-image","script":"#!/usr/bin/env bash\nset -euo pipefail\n# shellcheck disable=SC1091 # /utils.sh is only available in the container image at runtime\n. /utils.sh\ntrap 'handle_error $(results.TEST_OUTPUT.path)' EXIT\n\n# Recursively unpack nested archives into a loose file tree so clamd\n# scans each file directly instead of recursing through archive layers,\n# which is faster. bsdtar detects archives by content, not extension\n# (the scanned payload can be an extension-less blob).\nextract_archives() {\n  local dir=\"$1\"\n  find \"$dir\" -type f -print0 | while IFS= read -r -d \"\" f; do\n    # Treat as an archive only if bsdtar can list at least one entry.\n    if bsdtar -tf \"$f\" 2\u003e/dev/null | grep -q .; then\n      out=\"${f}.d\"\n      mkdir -p \"$out\"\n      if bsdtar -xf \"$f\" -C \"$out\" \u003e/dev/null 2\u003e\u00261; then\n        rm -f \"$f\"\n        extract_archives \"$out\"\n      else\n        # Extraction failed: drop the dir if empty and leave the\n        # original file in place for clamd to scan.\n        rmdir \"$out\" 2\u003e/dev/null || true\n      fi\n    fi\n  done\n}\n\n# Start clamd in background\n/start-clamd.sh\n\n# Bootstrap .docker config in overridden HOME.\n# This prevents 'oc' CLI failures in clean environments where ~/.docker does not exist.\nif [ ! -d ~/.docker ]; then\n    mkdir -p ~/.docker\n    echo '{}' \u003e ~/.docker/config.json\nfi\n\nimagewithouttag=$(echo \"$IMAGE_URL\" | sed \"s/\\(.*\\):.*/\\1/\" | tr -d '\\n')\n\n# strip new-line escape symbol from parameter and save it to variable\nimageanddigest=\"${imagewithouttag}@${IMAGE_DIGEST}\"\n\n# check if image is attestation one, skip the clamav scan in such case\nif [[ $imageanddigest == *.att ]]\nthen\n    echo \"$imageanddigest is an attestation image. Skipping ClamAV scan.\"\n    exit 0\nfi\n\nimages_processed_template='{\"image\": {\"pullspec\": \"'\"$IMAGE_URL\"'\", \"digests\": [%s]}}'\ndigests_processed=()\nmkdir logs\nmkdir content\ncd content\necho \"Detecting artifact type for ${imageanddigest}.\"\necho '{\"artifact\":{\"pullspec\":\"'\"${imageanddigest}\"'\",\"type\":\"unknown\",\"mediaType\":\"\"}}' \u003e /work/logs/artifact-meta.json\n\n# Function to scan content and process results with ClamAV and EC\n# Parameters:\n#   $1: destination - path to the content to scan\n#   $2: suffix - suffix for log file names (e.g., \"oci\", \"amd64\")\n#   $3: digest - digest to add to digests_processed array\n#   $4: scan_message - optional message describing what is being scanned\nscan_and_process() {\n  local destination=\"$1\"\n  local suffix=\"$2\"\n  local digest=\"$3\"\n  local scan_message=\"${4:-Scanning content}\"\n\n  db_version=$(clamdscan --version | sed 's|.*/\\(.*\\)/.*|\\1|')\n\n  echo \"$scan_message. This operation may take a while.\"\n\n  # Unpack nested archives into a loose file tree so clamd scans loose\n  # files directly rather than recursing into archives (see extract_archives).\n  echo \"Pre-extracting archives under ${destination}.\"\n  extract_archives \"${destination}\" 2\u003e\u00261 \\\n    | tee \"/work/logs/extract-${suffix}.log\" || true\n\n  clamdscan \"${destination}\" -vi --multiscan --fdpass \\\n    | tee \"/work/logs/clamscan-result-${suffix}.log\" || true\n\n  echo \"Executed-on: Scan was executed on clamsdcan version - $(clamdscan --version) Database version: $db_version\" | tee -a \"/work/logs/clamscan-result-${suffix}.log\"\n\n  digests_processed+=(\"\\\"$digest\\\"\")\n\n  if [[ -e \"/work/logs/clamscan-result-${suffix}.log\" ]]; then\n    # OPA/EC requires structured data input, add clamAV log into json\n    jq -Rs '{ output: . }' \"/work/logs/clamscan-result-${suffix}.log\" \u003e \"/work/logs/clamscan-result-log-${suffix}.json\"\n\n    EC_EXPERIMENTAL=1 ec test \\\n      --namespace required_checks \\\n      --policy /project/clamav/virus-check.rego \\\n      -o json \\\n      \"/work/logs/clamscan-result-log-${suffix}.json\" || true\n\n    # workaround: due to a bug in ec-cli, we cannot generate json and appstudio output at the same time, running it again\n    EC_EXPERIMENTAL=1 ec test \\\n      --namespace required_checks \\\n      --policy /project/clamav/virus-check.rego \\\n      -o appstudio \\\n      \"/work/logs/clamscan-result-log-${suffix}.json\" | tee \"/work/logs/clamscan-ec-test-${suffix}.json\" || true\n\n    cat \"/work/logs/clamscan-ec-test-${suffix}.json\"\n  fi\n}\n\n# Skip extract only when every real file is a known weight type.\nis_weight_filename() {\n  local base=\"$1\"\n  case \"$base\" in\n    *.safetensors|*.gguf|*.ggml|*.pt|*.pth|*.onnx|*.onnx_data|*.onnx_data_*) return 0 ;;\n    *) return 1 ;;\n  esac\n}\n\n# 2000MiB: slightly under ClamAV's ~2GiB MaxFileSize (0.2 used --max-filesize=2000M).\nCLAMAV_SKIP_BLOB_BYTES=2097152000\n\n# listing = stdout of: oc image extract --dry-run\nis_weight_only_layer() {\n  local listing=\"$1\"\n  local mode entry base\n  # Fail closed: empty stdout is not evidence the layer is weight-only.\n  [[ -z \"${listing}\" ]] \u0026\u0026 return 1\n  while IFS= read -r line; do\n    [ -z \"$line\" ] \u0026\u0026 continue\n    mode=$(awk '{print $2}' \u003c\u003c\u003c \"$line\")\n    [[ \"$mode\" == d* ]] \u0026\u0026 continue\n    [[ \"$line\" == *\" -\u003e \"* ]] \u0026\u0026 return 1\n    entry=$(awk '{print $NF}' \u003c\u003c\u003c \"$line\")\n    base=$(basename \"$entry\")\n    [[ \"$base\" == .wh.* ]] \u0026\u0026 continue\n    is_weight_filename \"$base\" || return 1\n  done \u003c\u003c\u003c \"$listing\"\n  return 0\n}\n\n# title/path from the OCI layer descriptor (olot ModelCars). Empty is not a skip.\nlayer_annotation_is_weight() {\n  local title=\"$1\" inpath=\"$2\" base candidate\n  for candidate in \"$title\" \"$inpath\"; do\n    [ -z \"$candidate\" ] \u0026\u0026 continue\n    base=$(basename \"$candidate\")\n    is_weight_filename \"$base\" \u0026\u0026 return 0\n  done\n  return 1\n}\n\n# BEGIN PLATFORM HELPERS\nplatform_manifests_from_index() {\n  local manifest_index=\"$1\"\n  jq -c '[\n    .manifests[]?\n    | select(\n        .platform.os != null\n        and .platform.architecture != null\n        and .platform.os != \"unknown\"\n        and .platform.architecture != \"unknown\"\n      )\n    | {\n        os: (.platform.os | ascii_downcase),\n        architecture: (.platform.architecture | ascii_downcase),\n        variant: (.platform.variant // \"\"),\n        digest: .digest\n      }\n  ]' \u003c\u003c\u003c \"$manifest_index\"\n}\n\nplatform_manifest_from_config() {\n  local image_config=\"$1\"\n  local digest=\"$2\"\n  if [ -z \"$image_config\" ]; then\n    image_config='{}'\n  fi\n  jq -c --arg digest \"$digest\" '\n    if (.os // \"\") != \"\" and (.architecture // \"\") != \"\" then\n      [{\n        os: (.os | ascii_downcase),\n        architecture: (.architecture | ascii_downcase),\n        variant: (.variant // \"\"),\n        digest: $digest\n      }]\n    else\n      []\n    end\n  ' \u003c\u003c\u003c \"$image_config\"\n}\n\nselect_platform_manifests() {\n  local platform_manifests=\"$1\"\n  local requested_platform=\"$2\"\n  local requested_os=\"\"\n  local requested_arch=\"$requested_platform\"\n  local requested_variant=\"\"\n  local os_prefix=\"\"\n\n  if [ -z \"$requested_platform\" ]; then\n    echo \"$platform_manifests\"\n    return\n  fi\n\n  if [[ \"$requested_platform\" == */* ]]; then\n    requested_os=\"${requested_platform%%/*}\"\n    requested_arch=\"${requested_platform#*/}\"\n    if [[ \"$requested_arch\" == */* ]]; then\n      requested_variant=\"${requested_arch#*/}\"\n      requested_arch=\"${requested_arch%%/*}\"\n    fi\n  fi\n\n  requested_os=$(echo \"$requested_os\" | tr '[:upper:]' '[:lower:]')\n  requested_arch=$(echo \"$requested_arch\" | tr '[:upper:]' '[:lower:]')\n  # Konflux build-platforms values are scheduling labels such as\n  # linux-m2xlarge/arm64. The hyphenated suffix names a node pool and\n  # is not part of the OCI operating system.\n  os_prefix=\"${requested_os%%-*}\"\n  case \"$os_prefix\" in\n    linux|windows|darwin|mac|macos|osx) requested_os=\"$os_prefix\" ;;\n  esac\n  case \"$requested_os\" in\n    mac|macos|osx) requested_os=\"darwin\" ;;\n  esac\n  case \"$requested_arch\" in\n    x86_64) requested_arch=\"amd64\" ;;\n    aarch64) requested_arch=\"arm64\" ;;\n    local) requested_arch=\"amd64\" ;;\n  esac\n\n  jq -c --arg os \"$requested_os\" --arg arch \"$requested_arch\" --arg variant \"$requested_variant\" '\n    [\n      .[]\n      | select(\n          .architecture == $arch\n          and ($os == \"\" or .os == $os)\n          and ($variant == \"\" or .variant == $variant)\n        )\n    ]\n  ' \u003c\u003c\u003c \"$platform_manifests\"\n}\n\nsafe_platform_component() {\n  local value=\"$1\"\n  local safe\n  safe=$(printf '%s' \"$value\" | LC_ALL=C tr -c '[:alnum:]_-' '-' | tr -s '-' | sed 's/^-//; s/-$//')\n  if [ -z \"$safe\" ]; then\n    safe=\"unknown\"\n  fi\n  echo \"$safe\"\n}\n\nplatform_log_suffix() {\n  local os\n  local arch\n  local variant\n  local suffix\n  os=$(safe_platform_component \"$1\")\n  arch=$(safe_platform_component \"$2\")\n  variant=\"\"\n  suffix=\"$arch\"\n\n  if [ \"$os\" != \"linux\" ]; then\n    suffix=\"${os}-${arch}\"\n  fi\n  if [ -n \"$3\" ]; then\n    variant=$(safe_platform_component \"$3\")\n    suffix=\"${suffix}-${variant}\"\n  fi\n  echo \"$suffix\"\n}\n\ninspect_raw_manifest() {\n  local image_ref=\"$1\"\n  retry skopeo inspect --raw --authfile \"${HOME}/.docker/config.json\" \\\n    \"docker://${image_ref}\"\n}\n\ninspect_image_config() {\n  local image_ref=\"$1\"\n  retry skopeo inspect --config --authfile \"${HOME}/.docker/config.json\" \\\n    \"docker://${image_ref}\"\n}\n\nextract_image_layer() {\n  local image_ref=\"$1\"\n  local layer_digest=\"$2\"\n  local destination=\"$3\"\n  local platform=\"$4\"\n  retry oc image extract --confirm --only-files=true \\\n    --registry-config \"${HOME}/.docker/config.json\" \\\n    \"${image_ref}[~${layer_digest}]\" \\\n    --path=\"/:${destination}\" --filter-by-os=\"${platform}\"\n}\n\nextract_full_image() {\n  local image_ref=\"$1\"\n  local destination=\"$2\"\n  local platform=\"$3\"\n  retry oc image extract --confirm --only-files=true \\\n    --registry-config \"${HOME}/.docker/config.json\" \"$image_ref\" \\\n    --path=\"/:${destination}\" --filter-by-os=\"${platform}\"\n}\n\nlist_image_layer() {\n  local image_ref=\"$1\"\n  local layer_digest=\"$2\"\n  local destination=\"$3\"\n  local platform=\"$4\"\n  retry oc image extract --dry-run --confirm \\\n    --registry-config \"${HOME}/.docker/config.json\" \\\n    \"${image_ref}[~${layer_digest}]\" \\\n    --path=\"/:${destination}\" --filter-by-os=\"${platform}\"\n}\n# END PLATFORM HELPERS\n\n# Detect artifact type: container image vs OCI artifact\n# First, try to get image manifests (works for container images)\n# Use subshell to prevent get_image_manifests() from exiting the main script if it fails\n# (get_image_manifests uses exit 1 when Architecture field is missing, which happens for OCI artifacts)\nimage_manifests=$(bash -c '. /utils.sh; get_image_manifests -i \"'\"${imageanddigest}\"'\"' 2\u003e/dev/null || echo \"\")\n\nraw_manifest=$(inspect_raw_manifest \"$imageanddigest\" 2\u003e/dev/null || true)\nplatform_manifests='[]'\nplatform_inspection_failed=false\n\nif [ -n \"$image_manifests\" ]; then\n  if [ -n \"$raw_manifest\" ]; then\n    if jq -e 'has(\"manifests\")' \u003c\u003c\u003c \"$raw_manifest\" \u003e/dev/null; then\n      platform_manifests=$(platform_manifests_from_index \"$raw_manifest\")\n    else\n      image_config=$(inspect_image_config \"$imageanddigest\" 2\u003e/dev/null || true)\n      platform_manifests=$(platform_manifest_from_config \"$image_config\" \"$IMAGE_DIGEST\")\n    fi\n  fi\n\n  if [ \"$(jq 'length' \u003c\u003c\u003c \"$platform_manifests\")\" -eq 0 ]; then\n    platform_inspection_failed=true\n    image_manifests=\"\"\n  fi\nfi\n\n# If get_image_manifests failed, check if it's an OCI artifact by inspecting manifest media type\nif [ -z \"$image_manifests\" ]; then\n  if [ \"$platform_inspection_failed\" = true ]; then\n    echo \"Unable to determine image platforms, checking the manifest type...\"\n  else\n    echo \"get_image_manifests returned empty, checking if this is an OCI artifact...\"\n  fi\n  if [ -s /work/logs/artifact-meta.json ]; then\n    tmp=$(mktemp)\n    if jq '.artifact.type = \"inspected\"' /work/logs/artifact-meta.json \u003e \"$tmp\"; then\n      mv \"$tmp\" /work/logs/artifact-meta.json || true\n    fi\n  fi\n\n  if [ -n \"$raw_manifest\" ]; then\n    media_type=$(echo \"$raw_manifest\" | jq -r '.mediaType // .config.mediaType // empty' 2\u003e/dev/null || echo \"\")\n    artifact_type=$(echo \"$raw_manifest\" | jq -r '.artifactType // empty' 2\u003e/dev/null || echo \"\")\n    config_media_type=$(echo \"$raw_manifest\" | jq -r '.config.mediaType // empty' 2\u003e/dev/null || echo \"\")\n\n    if [ \"$platform_inspection_failed\" = true ]; then\n      echo \"Failed to determine platforms for container image \\\"$imageanddigest\\\".\"\n      if [ -s /work/logs/artifact-meta.json ]; then\n        tmp=$(mktemp)\n        if jq '.artifact.mediaType = '\"\\\"${media_type:-unknown}\\\"\"' | .artifact.type = \"image\"' /work/logs/artifact-meta.json \u003e \"$tmp\"; then\n          mv \"$tmp\" /work/logs/artifact-meta.json || true\n        fi\n      fi\n      note=\"Task $(context.task.name) failed: Failed to determine the platforms of image \\\"$imageanddigest\\\". For details, check Tekton task log.\"\n      ERROR_OUTPUT=$(make_result_json -r \"ERROR\" -t \"$note\")\n      echo \"${ERROR_OUTPUT}\" | tee \"$(results.TEST_OUTPUT.path)\"\n      exit 0\n    fi\n\n    # Determine if this is an OCI artifact (not a container image)\n    # OCI artifacts typically have:\n    # - An empty/scratch config (config.mediaType contains \"empty\" or \"scratch\")\n    # - An explicit artifactType field that is not a container image type\n    is_oci_artifact=false\n\n    # Check if config is empty/scratch (typical for OCI artifacts like python wheels, helm charts, etc.)\n    if echo \"$config_media_type\" | grep -qiE \"(empty|scratch)\"; then\n      is_oci_artifact=true\n    fi\n\n    # Check if artifactType is set and is not a container image type\n    if [ -n \"$artifact_type\" ] \u0026\u0026 ! echo \"$artifact_type\" | grep -qE \"application/vnd\\.(oci|docker)\\.(image|container)\"; then\n      is_oci_artifact=true\n    fi\n\n    if [ \"$is_oci_artifact\" = true ]; then\n      # This is an OCI artifact (e.g., python wheels, helm charts, etc.)\n      echo \"Detected OCI artifact (artifactType: ${artifact_type:-unset}, config.mediaType: ${config_media_type:-unset}). Downloading for scanning...\"\n      if [ -s /work/logs/artifact-meta.json ]; then\n        tmp=$(mktemp)\n        if jq '.artifact.mediaType = '\"\\\"${media_type:-unknown}\\\"\"' | .artifact.artifactType = '\"\\\"${artifact_type:-unknown}\\\"\"' | .artifact.type = \"oci\"' /work/logs/artifact-meta.json \u003e \"$tmp\"; then\n          mv \"$tmp\" /work/logs/artifact-meta.json || true\n        fi\n      fi\n      destination=\"content-oci\"\n      mkdir -p \"$destination\"\n\n      # Download OCI artifact using skopeo copy\n      echo \"Downloading OCI artifact using skopeo copy\"\n      if ! retry skopeo copy --authfile ~/.docker/config.json \"docker://${imageanddigest}\" \"dir:${destination}\" 2\u003e\u00261; then\n        echo \"Failed to download OCI artifact \\\"$imageanddigest\\\". Skipping ClamAV scan!\"\n        note=\"Task $(context.task.name) failed: Failed to download OCI artifact \\\"$imageanddigest\\\". For details, check Tekton task log.\"\n        ERROR_OUTPUT=$(make_result_json -r \"ERROR\" -t \"$note\")\n        echo \"${ERROR_OUTPUT}\" | tee \"$(results.TEST_OUTPUT.path)\"\n        exit 0\n      fi\n\n      # Scan and process OCI artifact\n      scan_and_process \"${destination}\" \"oci\" \"$IMAGE_DIGEST\" \"Scanning OCI artifact\"\n\n      # Skip the container image processing path\n      image_manifests=\"\"\n    elif echo \"$media_type\" | grep -qE \"(application/vnd\\.(docker|oci)\\.(distribution|image)\\.manifest|application/vnd\\.docker\\.distribution\\.manifest)\"; then\n      # This looks like a container image manifest, but get_image_manifests failed\n      echo \"Detected container image manifest type: $media_type, but failed to resolve its manifests and platform.\"\n      if [ -s /work/logs/artifact-meta.json ]; then\n        tmp=$(mktemp)\n        if jq '.artifact.mediaType = '\"\\\"$media_type\\\"\"' | .artifact.type = \"image\"' /work/logs/artifact-meta.json \u003e \"$tmp\"; then\n          mv \"$tmp\" /work/logs/artifact-meta.json || true\n        fi\n      fi\n      note=\"Task $(context.task.name) failed: Failed to resolve the manifests and platform of image \\\"$imageanddigest\\\". For details, check Tekton task log.\"\n      ERROR_OUTPUT=$(make_result_json -r \"ERROR\" -t \"$note\")\n      echo \"${ERROR_OUTPUT}\" | tee \"$(results.TEST_OUTPUT.path)\"\n      exit 0\n    else\n      # Likely an OCI artifact with non-standard media type\n      echo \"Detected OCI artifact (media type: ${media_type:-unknown}). Downloading for scanning...\"\n      if [ -s /work/logs/artifact-meta.json ]; then\n        tmp=$(mktemp)\n        if jq '.artifact.mediaType = '\"\\\"${media_type:-unknown}\\\"\"' | .artifact.type = \"oci\"' /work/logs/artifact-meta.json \u003e \"$tmp\"; then\n          mv \"$tmp\" /work/logs/artifact-meta.json || true\n        fi\n      fi\n      destination=\"content-oci\"\n      mkdir -p \"$destination\"\n\n      # Download OCI artifact using skopeo copy\n      echo \"Downloading OCI artifact using skopeo copy\"\n      if ! retry skopeo copy --authfile ~/.docker/config.json \"docker://${imageanddigest}\" \"dir:${destination}\" 2\u003e\u00261; then\n        echo \"Failed to download OCI artifact \\\"$imageanddigest\\\". Skipping ClamAV scan!\"\n        note=\"Task $(context.task.name) failed: Failed to download OCI artifact \\\"$imageanddigest\\\". For details, check Tekton task log.\"\n        ERROR_OUTPUT=$(make_result_json -r \"ERROR\" -t \"$note\")\n        echo \"${ERROR_OUTPUT}\" | tee \"$(results.TEST_OUTPUT.path)\"\n        exit 0\n      fi\n\n      # Scan and process OCI artifact\n      scan_and_process \"${destination}\" \"oci\" \"$IMAGE_DIGEST\" \"Scanning OCI artifact\"\n\n      # Skip the container image processing path\n      image_manifests=\"\"\n    fi\n  else\n    if [ \"$platform_inspection_failed\" = true ]; then\n      echo \"Failed to inspect image \\\"$imageanddigest\\\". Unable to determine its platform.\"\n      note=\"Task $(context.task.name) failed: Failed to determine the platform of image \\\"$imageanddigest\\\". For details, check Tekton task log.\"\n    else\n      echo \"Failed to inspect artifact \\\"$imageanddigest\\\". Unable to determine type.\"\n      note=\"Task $(context.task.name) failed: Failed to inspect artifact \\\"$imageanddigest\\\". For details, check Tekton task log.\"\n    fi\n    ERROR_OUTPUT=$(make_result_json -r \"ERROR\" -t \"$note\")\n    echo \"${ERROR_OUTPUT}\" | tee \"$(results.TEST_OUTPUT.path)\"\n    exit 0\n  fi\nfi\n\n# Process container images (existing logic)\nif [ -n \"$image_manifests\" ]; then\n  echo \"Detected container image. Processing image manifests.\"\n  if [ -s /work/logs/artifact-meta.json ]; then\n    tmp=$(mktemp)\n    if jq '.artifact.type = \"image\"' /work/logs/artifact-meta.json \u003e \"$tmp\"; then\n      mv \"$tmp\" /work/logs/artifact-meta.json || true\n    fi\n  fi\n  # Proceed only with a specific platform if image-arch is provided.\n  # This typically occurs when using Tekton Matrix to launch multiple TaskRuns to scan all architectures of a multi-arch image in parallel.\n  if [ -n \"$IMAGE_ARCH\" ]; then\n    platform_manifests=$(select_platform_manifests \"$platform_manifests\" \"$IMAGE_ARCH\")\n    if [ \"$(jq 'length' \u003c\u003c\u003c \"$platform_manifests\")\" -eq 0 ]; then\n      echo \"No image manifest found for requested platform ${IMAGE_ARCH}.\"\n      note=\"Task $(context.task.name) failed: No image manifest found for requested platform ${IMAGE_ARCH} in image \\\"$imageanddigest\\\".\"\n      ERROR_OUTPUT=$(make_result_json -r \"ERROR\" -t \"$note\")\n      echo \"${ERROR_OUTPUT}\" | tee \"$(results.TEST_OUTPUT.path)\"\n      exit 0\n    fi\n  fi\n\n  while IFS= read -r platform_manifest; do\n    os=$(jq -r '.os' \u003c\u003c\u003c \"$platform_manifest\")\n    arch=$(jq -r '.architecture' \u003c\u003c\u003c \"$platform_manifest\")\n    variant=$(jq -r '.variant' \u003c\u003c\u003c \"$platform_manifest\")\n    arch_sha=$(jq -r '.digest' \u003c\u003c\u003c \"$platform_manifest\")\n    platform=\"${os}/${arch}\"\n    if [ -n \"$variant\" ]; then\n      platform=\"${platform}/${variant}\"\n    fi\n    suffix=$(platform_log_suffix \"$os\" \"$arch\" \"$variant\")\n    destination=\"content-${suffix}\"\n    mkdir -p \"$destination\"\n    arch_imageanddigest=\"${imagewithouttag}@${arch_sha}\"\n\n    echo \"Inspecting layers for platform $platform\"\n    skip_log=\"\"\n    layers=$(skopeo inspect --raw --authfile ~/.docker/config.json \\\n      \"docker://${arch_imageanddigest}\" | jq -c '\n        .layers[]? | {\n          digest: (.digest // \"\"),\n          size: ((.size // 0) | if type == \"number\" then . else 0 end),\n          title: (.annotations[\"org.opencontainers.image.title\"] // \"\"),\n          inpath: (.annotations[\"olot.layer.content.inlayerpath\"] // \"\")\n        }') || layers=\"\"\n\n    if [ -z \"${layers}\" ]; then\n      echo \"Could not list layers; extracting full image\"\n      if ! extract_full_image \"$arch_imageanddigest\" \"$destination\" \"$platform\"; then\n        echo \"Unable to extract image for platform $platform. Skipping ClamAV scan!\"\n        exit 0\n      fi\n    else\n      skip_log=\"/work/logs/skipped-layers-${suffix}.log\"\n      : \u003e \"$skip_log\"\n      while IFS= read -r layer_json; do\n        [ -z \"$layer_json\" ] \u0026\u0026 continue\n        digest=$(jq -r '.digest' \u003c\u003c\u003c \"$layer_json\")\n        size=$(jq -r '.size' \u003c\u003c\u003c 