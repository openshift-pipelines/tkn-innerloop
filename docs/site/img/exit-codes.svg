<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="t">
  <title id="t">Exit code 0 means every check passed, 1 means a check failed, 2 means some steps stayed unresolved</title>
  <style>
    .ink { stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .num { font: 900 84px "Red Hat Display", system-ui, sans-serif; }
    .label { font: 700 18px "Red Hat Display", system-ui, sans-serif; }
    .pop { animation: pop 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .p2 { animation-delay: .3s; } .p3 { animation-delay: .6s; }
    @keyframes pop { 0%, 70%, 100% { transform: scale(1); } 8% { transform: scale(1.14); } 16% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#d3dae1"/></pattern>
  </defs>
  <rect width="800" height="280" fill="#fff"/>
  <rect width="800" height="280" fill="url(#dots)"/>

  <rect class="ink" x="40" y="36" width="224" height="208" rx="18" fill="#d5ecdf" stroke="#1f7a52"/>
  <text class="num" x="70" y="140" fill="#1f7a52">0</text>
  <g class="pop">
    <circle cx="210" cy="108" r="26" fill="#1f7a52"/>
    <path d="M198 108 L206 116 L222 98" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="label" x="70" y="200" fill="#172231">all checks passed</text>

  <rect class="ink" x="288" y="36" width="224" height="208" rx="18" fill="#f6d9d6" stroke="#b8322a"/>
  <text class="num" x="318" y="140" fill="#b8322a">1</text>
  <g class="pop p2">
    <circle cx="458" cy="108" r="26" fill="#b8322a"/>
    <path d="M448 98 L468 118 M468 98 L448 118" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text class="label" x="318" y="200" fill="#172231">a check failed</text>

  <rect class="ink" x="536" y="36" width="224" height="208" rx="18" fill="#fde9b8" stroke="#b07a00"/>
  <text class="num" x="566" y="140" fill="#8a5d00">2</text>
  <g class="pop p3">
    <circle cx="706" cy="108" r="26" fill="#d99a00"/>
    <text x="697" y="118" fill="#fff" style="font: 900 28px system-ui, sans-serif">?</text>
  </g>
  <text class="label" x="566" y="200" fill="#172231">passed, but some</text>
  <text class="label" x="566" y="222" fill="#172231">steps unresolved</text>
</svg>
