<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t">
  <title id="t">Before each commit, the change passes through the tkn-innerloop checks; a failing check stops the commit</title>
  <style>
    .ink { stroke: #172231; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .mono { font: 600 14px "Red Hat Mono", ui-monospace, monospace; }
    .label { font: 700 15px "Red Hat Display", system-ui, sans-serif; }
    .go { animation: go 3.6s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes go { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 45%, 55% { transform: translateX(170px); } 92% { opacity: 1; } 100% { transform: translateX(340px); opacity: 0; } }
    .ring { animation: ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ring { 0%, 42% { transform: scale(1); opacity: 0; } 50% { opacity: .9; } 70%, 100% { transform: scale(1.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .go, .ring { animation: none; } .go, .ring { opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#d3dae1"/></pattern>
  </defs>
  <rect width="800" height="320" fill="#fff"/>
  <rect width="800" height="320" fill="url(#dots)"/>

  <path d="M40 200 H360" stroke="#172231" stroke-width="5" stroke-linecap="round"/>
  <path d="M440 200 H700" stroke="#172231" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g class="ink" stroke-width="4" fill="#fff">
    <circle cx="80" cy="200" r="14"/>
    <circle cx="170" cy="200" r="14"/>
    <circle cx="260" cy="200" r="14"/>
  </g>
  <text class="mono" x="60" y="240" fill="#536173">main</text>

  <g transform="translate(330 140)">
    <rect class="ink" x="0" y="10" width="20" height="38" rx="3" fill="#fde9b8"/>
    <rect class="ink" x="8" y="2" width="20" height="38" rx="3" fill="#fde9b8"/>
    <rect class="ink" x="16" y="-6" width="20" height="38" rx="3" fill="#fff"/>
  </g>
  <text class="mono" x="288" y="124" fill="#536173">staged</text>

  <rect class="ink" x="386" y="120" width="16" height="130" rx="4" fill="#172231"/>
  <rect class="ink" x="478" y="120" width="16" height="130" rx="4" fill="#172231"/>
  <rect class="ink" x="370" y="96" width="140" height="34" rx="8" fill="#172231"/>
  <circle cx="392" cy="113" r="6" fill="#f2b630"/>
  <text class="mono" x="404" y="118" fill="#fff">innerloop</text>

  <g transform="translate(410 46)">
    <rect class="ink" x="-60" y="-22" width="120" height="30" rx="15" fill="#d5ecdf" stroke="#1f7a52"/>
    <text class="mono" x="-44" y="-2" fill="#1f7a52">✓ codespell</text>
  </g>
  <g transform="translate(560 64)">
    <rect class="ink" x="-58" y="-22" width="116" height="30" rx="15" fill="#d5ecdf" stroke="#1f7a52"/>
    <text class="mono" x="-42" y="-2" fill="#1f7a52">✓ yamllint</text>
  </g>

  <circle class="ink go" cx="270" cy="200" r="9" fill="#f2b630"/>
  <circle class="ring" cx="440" cy="200" r="22" fill="none" stroke="#1f7a52" stroke-width="4"/>

  <circle cx="640" cy="200" r="20" fill="#fff" stroke="#f2b630" stroke-width="4" stroke-dasharray="6 6"/>
  <text class="label" x="586" y="248" fill="#172231">your commit</text>
  <text class="mono" x="520" y="290" fill="#536173">SKIP=tkn-innerloop to bypass</text>
</svg>
