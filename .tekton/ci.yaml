---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: tkn-innerloop-ci
  annotations:
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/on-event: "[pull_request, push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  params:
    - name: repo_url
      value: "{{repo_url}}"
    - name: revision
      value: "{{revision}}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
    tasks:
      - name: python
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: fetch-repo
              displayName: "Fetch Repository"
              ref:
                resolver: hub
                params:
                  - name: catalog
                    value: git-clone-stepaction
                  - name: type
                    value: artifact
                  - name: kind
                    value: stepaction
                  - name: name
                    value: git-clone
                  - name: version
                    value: "1.7.0"
              params:
                - name: output-path
                  value: $(workspaces.source.path)
                - name: url
                  value: "$(params.repo_url)"
                - name: revision
                  value: "$(params.revision)"
            - name: lint
              displayName: "Lint"
              image: docker.io/library/python:3.13
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                python -m pip install --quiet --root-user-action=ignore --disable-pip-version-check ruff==0.17.5
                ruff check .
            - name: shellcheck
              displayName: "Shellcheck"
              image: docker.io/koalaman/shellcheck-alpine:stable
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                shellcheck docs/demo/*.sh
            - name: unittest
              displayName: "Unit Tests"
              image: docker.io/library/python:3.13
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                python -m pip install --quiet --root-user-action=ignore --disable-pip-version-check 'PyYAML>=6.0,<7'
                python -m unittest discover -s tests -t .
    workspaces:
      - name: source
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
