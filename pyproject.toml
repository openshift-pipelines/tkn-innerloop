[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tkn-innerloop"
version = "0.1.0"
description = "Run Tekton pipeline checks locally with an agent-written execution plan"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
tkn-innerloop = "tkn_innerloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tkn_innerloop"]

[tool.hatch.build.targets.wheel.force-include]
"skills/tekton-innerloop/SKILL.md" = "tkn_innerloop/SKILL.md"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["hack/corpus-check", "hack/corpus-bundles", "bin/tkn-innerloop"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "SIM105"]
